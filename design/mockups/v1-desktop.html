<title>Unfold — Konzept-Mockup (Desktop)</title>
<style>
  :root {
    --paper: #faf7f1;
    --surface: #ffffff;
    --surface-sunken: #eae0cc;
    --line: #ddd0af;
    --line-soft: #ece3cc;
    --ink: #293241;
    --ink-soft: #5c6472;
    --ink-faint: #93989f;
    --accent: #ee6c4d;
    --accent-ink: #ffffff;
    --accent-soft: #fce7e0;
    --accent-line: #f5bda9;
    --urgent: #c1443e;
    --urgent-soft: #fbeae8;
    --green: #3f8f62;
    --list-inbox: #a39c8c;
    --list-personal: #4fa6a0;
    --list-work: #ee6c4d;
    --list-groceries: #6e7fd1;
    --shadow-window: 0 30px 70px -25px rgba(41, 50, 65, 0.35), 0 2px 8px rgba(41, 50, 65, 0.06);
    --radius-window: 18px;
    --col-w: 276px;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --paper: #1f242e;
    --surface: #293241;
    --surface-sunken: #191d25;
    --line: #3c4454;
    --line-soft: #333a48;
    --ink: #f2ede0;
    --ink-soft: #b6aea0;
    --ink-faint: #756e60;
    --accent: #f38a6e;
    --accent-ink: #1f242e;
    --accent-soft: #3a281f;
    --accent-line: #5c3d2e;
    --urgent: #e1746b;
    --urgent-soft: #3a2321;
    --green: #67b78c;
    --list-inbox: #8f8a78;
    --list-personal: #5cbdb6;
    --list-work: #f38a6e;
    --list-groceries: #8b98e8;
    --shadow-window: 0 30px 70px -25px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17161c;
      --surface: #1e1d24;
      --surface-sunken: #1a191f;
      --line: #322f3a;
      --line-soft: #29272f;
      --ink: #f2ede0;
      --ink-soft: #b6aea0;
      --ink-faint: #756e60;
      --accent: #f38a6e;
      --accent-ink: #1f242e;
      --accent-soft: #3a281f;
      --accent-line: #5c3d2e;
      --urgent: #e1746b;
      --urgent-soft: #3a2321;
      --green: #67b78c;
      --list-inbox: #8f8a78;
      --list-personal: #5cbdb6;
      --list-work: #f38a6e;
      --list-groceries: #8b98e8;
      --shadow-window: 0 30px 70px -25px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }

  .page { max-width: 1180px; margin: 0 auto; padding: 40px 24px; min-height: 100vh; display: flex; align-items: center; }

  .window-frame { display: flex; justify-content: center; width: 100%; }

  .app-window {
    width: 100%;
    max-width: 1040px;
    height: 640px;
    display: grid;
    grid-template-columns: 248px 1fr;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-window);
    box-shadow: var(--shadow-window);
    overflow: hidden;
    position: relative;
  }

  /* --- Sidebar --- */
  .sidebar { background: var(--surface-sunken); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; overflow-y: auto; transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1); }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }

  .app-window.sidebar-collapsed { grid-template-columns: 0 1fr; }
  .app-window.sidebar-collapsed .sidebar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 248px;
    transform: translateX(-100%); z-index: 30;
    box-shadow: 14px 0 28px -14px rgba(0, 0, 0, 0.3);
  }
  .sidebar-hover-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; z-index: 25; }
  .app-window:not(.sidebar-collapsed) .sidebar-hover-zone { display: none; }
  .app-window.sidebar-collapsed:has(.sidebar-hover-zone:hover) .sidebar,
  .app-window.sidebar-collapsed .sidebar:hover {
    transform: translateX(0);
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 20px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-faint); padding: 14px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: none; background: transparent; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink); cursor: pointer; text-align: left; font-family: inherit; transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease; }
  .nav-item:hover { background: var(--line-soft); }
  .nav-item:active { transform: scale(0.97); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .nav-icon { width: 15px; height: 15px; flex-shrink: 0; color: var(--ink-soft); }
  .nav-item.active .nav-icon { color: var(--accent); }
  .nav-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-count { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-faint); min-width: 16px; text-align: right; }
  .nav-item.active .nav-count { color: var(--accent); }
  .nav-item-indented { padding-left: 26px; }
  .nav-item[draggable="true"], .group-row[draggable="true"] { cursor: grab; }
  .nav-item.drag-ghost { opacity: 0.35; }

  .nav-item-wrap { position: relative; }
  .nav-item-wrap:hover .nav-count { opacity: 0; }
  .nav-delete {
    opacity: 0; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; border: none; background: transparent; color: var(--ink-faint);
    cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 5px;
    transition: opacity 0.12s ease, color 0.12s ease, background-color 0.12s ease;
  }
  .nav-item-wrap:hover .nav-delete, .group-row:hover .nav-delete { opacity: 1; }
  .nav-delete:hover { color: var(--urgent); background: var(--urgent-soft); }

  .group-row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 4px 7px 6px; border-radius: 8px; margin-top: 2px; position: relative; }
  .group-row.drag-ghost { opacity: 0.35; }
  .group-row:hover .nav-count { opacity: 0; }
  .group-chevron { width: 16px; height: 16px; flex-shrink: 0; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .group-chevron svg { transition: transform 0.15s ease; }
  .group-chevron.collapsed svg { transform: rotate(-90deg); }
  .group-title { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 12.5px; font-weight: 650; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-soft); padding: 2px; border-radius: 4px; }
  .group-title:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 1px var(--line); text-transform: none; }

  .drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .drop-after { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .drop-into { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-soft); }

  .sidebar-spacer { flex: 1; }
  .sidebar-bottom-actions { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 2px; flex-shrink: 0; }
  .icon-action-btn { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease; }
  .icon-action-btn:hover { background: var(--line-soft); color: var(--ink); border-color: var(--ink-faint); }
  .icon-action-btn:active { transform: scale(0.92); }
  .icon-action-btn.primary { width: 42px; height: 42px; border-radius: 13px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .icon-action-btn.primary svg { width: 15px; height: 15px; }
  .icon-action-btn.primary:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* --- Content: horizontal column stack --- */
  .content-area {
    grid-column: 2;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    height: 100%;
    background: var(--surface);
  }
  .content-area::-webkit-scrollbar { height: 8px; }
  .content-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  .column {
    flex: 1 1 0%;
    min-width: 240px;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line-soft);
    scroll-snap-align: start;
  }
  .column.col-animating {
    transition: flex-basis 0.32s cubic-bezier(0.32, 0.72, 0, 1), transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-reduced-motion: reduce) { .column.col-animating { transition: none; } }

  .col-header { padding: 18px 18px 4px; flex-shrink: 0; }
  .col-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .col-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 0; border: none; background: transparent; color: var(--ink); font-family: inherit; padding: 0; width: 100%; }
  .col-title.done { color: var(--ink-faint); text-decoration: line-through; }
  .col-title:focus { outline: none; }
  .col-meta { font-size: 12px; color: var(--ink-faint); margin-top: 4px; font-variant-numeric: tabular-nums; }

  .col-close { width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease; }
  .col-close:hover { background: var(--line-soft); color: var(--ink); }
  .col-close:active { transform: scale(0.9); }

  .col-progress-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }

  .quick-add { margin: 8px 18px 12px; display: flex; align-items: center; gap: 8px; padding: 8px 11px; background: var(--surface-sunken); border: 1px solid var(--line); border-radius: 10px; flex-shrink: 0; }
  .quick-add svg { color: var(--accent); flex-shrink: 0; }
  .quick-add input { border: none; background: transparent; outline: none; font: inherit; font-size: 13px; color: var(--ink); flex: 1; min-width: 0; }
  .quick-add input::placeholder { color: var(--ink-faint); }

  .editor-toolbar { display: flex; gap: 6px; margin: 0 18px; padding-top: 10px; border-top: 1px solid var(--line-soft); flex-shrink: 0; }
  .insert-btn { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--ink-faint); background: transparent; border: 1px dashed var(--line); border-radius: 100px; padding: 4px 10px 4px 8px; cursor: pointer; font-family: inherit; transition: color 0.15s ease, border-color 0.15s ease, transform 0.1s ease; }
  .insert-btn:hover { color: var(--ink-soft); border-color: var(--ink-faint); }
  .insert-btn:active { transform: scale(0.95); }

  .blocks { flex: 1; overflow-y: auto; padding: 4px 6px 24px; }

  .page-editor {
    min-height: 100%;
    padding: 10px 12px;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
    outline: none;
    cursor: text;
  }
  .page-editor:empty::before { content: attr(data-placeholder); color: var(--ink-faint); pointer-events: none; }
  .page-editor div { min-height: 1.65em; }

  .inline-embed { position: relative; margin: 3px 0; animation: block-in 0.18s ease; overflow: hidden; cursor: grab; }
  .inline-embed.drag-ghost { opacity: 0.35; }
  .inline-embed.drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .inline-embed.drop-after { box-shadow: inset 0 -2px 0 0 var(--accent); }
  @keyframes block-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  .inline-embed.removing { animation: none; transition: height 0.2s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.18s ease, margin 0.2s ease; opacity: 0 !important; margin: 0 !important; }
  @media (prefers-reduced-motion: reduce) { .inline-embed { animation: none; } .inline-embed.removing { transition: opacity 0.15s ease; } }
  .removing { transition: height 0.2s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.18s ease, margin 0.2s ease; opacity: 0 !important; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .removing { transition: opacity 0.15s ease; } }

  .inline-embed .task-row { padding-right: 26px; }

  .block-image { display: flex; align-items: center; gap: 8px; padding: 14px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-faint); font-size: 12px; margin-right: 26px; }
  .block-image svg { flex-shrink: 0; }

  .row-delete { opacity: 0; width: 18px; height: 18px; flex-shrink: 0; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 5px; transition: opacity 0.12s ease, color 0.12s ease, background-color 0.12s ease, transform 0.1s ease; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); }
  .inline-embed:hover .row-delete { opacity: 1; }
  .row-delete:hover { color: var(--urgent); background: var(--urgent-soft); }
  .row-delete:active { transform: translateY(-50%) scale(0.88); }

  .page-editor.drag-over { background: var(--accent-soft); }

  .task-row { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 8px; cursor: pointer; transition: background-color 0.15s ease, transform 0.1s ease; }
  .task-row:hover { background: var(--line-soft); }
  .task-row:active { transform: scale(0.985); }

  .check-btn { width: 17px; height: 17px; flex-shrink: 0; border-radius: 6px; border: 1.5px solid var(--ink-faint); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .check-btn.done { background: var(--green); border-color: var(--green); color: #fff; }
  .check-btn:active { transform: scale(0.85); }
  .check-btn svg { opacity: 0; transform: scale(0.4); transition: opacity 0.15s ease, transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .check-btn.done svg { opacity: 1; transform: scale(1); }

  .task-title { font-size: 13.3px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.2s ease; }
  .task-row.done .task-title { color: var(--ink-faint); text-decoration: line-through; }

  .list-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .mini-progress { width: 34px; height: 5px; border-radius: 100px; background: var(--line); flex-shrink: 0; overflow: hidden; }
  .mini-progress > span { display: block; height: 100%; background: var(--accent); border-radius: 100px; transition: width 0.3s cubic-bezier(0.32, 0.72, 0, 1); }

  .due-pill { font-size: 10.5px; font-weight: 600; padding: 3px 7px; border-radius: 100px; background: var(--line-soft); color: var(--ink-soft); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .due-pill.today { background: var(--urgent-soft); color: var(--urgent); }

  .group-heading { display: flex; align-items: center; gap: 8px; padding: 14px 8px 6px; font-size: 11.5px; font-weight: 650; color: var(--ink-soft); }
  .group-heading:first-child { padding-top: 4px; }

  .empty-state { text-align: center; padding: 40px 16px; color: var(--ink-faint); font-size: 13px; }

  .options-wrap { position: relative; }
  .options-panel {
    position: absolute; left: 0; bottom: calc(100% + 8px); width: 224px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.28); padding: 12px; z-index: 20;
  }
  .options-panel[hidden] { display: none; }
  .options-title { font-size: 11px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin: 2px 2px 8px; }
  .theme-segmented { display: flex; background: var(--surface-sunken); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
  .theme-seg-btn { flex: 1; border: none; background: transparent; color: var(--ink-soft); font: inherit; font-size: 12px; font-weight: 600; padding: 6px 4px; border-radius: 7px; cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease; }
  .theme-seg-btn.active { background: var(--accent); color: var(--accent-ink); }
  .theme-seg-btn:not(.active):hover { background: var(--line-soft); color: var(--ink); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .page-editor:focus, .page-editor:focus-visible { outline: none; }
</style>

<div class="page">
  <div class="window-frame">
    <div class="app-window" id="appWindow">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="sidebar-hover-zone" id="sidebarHoverZone"></div>
      <div class="content-area" id="contentArea"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TODAY_ISO = "2026-08-05";
  var uid = 100;
  function nextId() { uid += 1; return "t" + uid; }

  function task(title, opts) {
    opts = opts || {};
    var t = {
      id: nextId(),
      title: title,
      done: !!opts.done,
      due: opts.due || null,
      subtasks: opts.subtasks || [],
      blocks: []
    };
    if (opts.text) t.blocks.push({ type: "text", text: opts.text });
    if (opts.image) t.blocks.push({ type: "image", id: nextId(), caption: opts.image });
    for (var i = 0; i < t.subtasks.length; i++) { t.blocks.push({ type: "task", id: t.subtasks[i].id }); }
    return t;
  }

  function makeList(id, name, color, items, intro, groupId) {
    var l = { id: id, name: name, color: color, tasks: items, blocks: [], groupId: groupId || null };
    if (intro) l.blocks.push({ type: "text", text: intro });
    for (var i = 0; i < items.length; i++) { l.blocks.push({ type: "task", id: items[i].id }); }
    return l;
  }

  var groups = [
    { id: "g1", name: "Privat" },
    { id: "g2", name: "Arbeit" }
  ];

  var lists = [
    makeList("inbox", "Inbox", "var(--list-inbox)", [
      task("Zahnarzttermin verschieben", { due: "2026-08-05" }),
      task("Rauchmelder in der Wohnung prüfen"),
      task("Podcast-Folge zu Fokusarbeit hören", { done: true })
    ]),
    makeList("personal", "Persönlich", "var(--list-personal)", [
      task("Urlaub planen", {
        text: "Zwei Wochen im September, Ziel noch offen.",
        image: "Reiseziel-Moodboard",
        subtasks: [
          task("Flüge vergleichen", {
            due: "2026-08-05",
            subtasks: [
              task("Preise auf Skyscanner checken"),
              task("Mit Anna Termine abgleichen", { done: true })
            ]
          }),
          task("Unterkunft aussuchen"),
          task("Reiseversicherung abschließen", { done: true })
        ]
      }),
      task("Laufschuhe neu kaufen", { due: "2026-08-14" })
    ], "Fokus für diese Woche: Urlaub startklar machen.", "g1"),
    makeList("work", "Redesign-Launch", "var(--list-work)", [
      task("Onboarding-Flow überarbeiten", {
        subtasks: [
          task("Wireframes im Team reviewen", { due: "2026-08-05" }),
          task("Copy für Empty-States schreiben"),
          task("Mit Design-Team abstimmen", { done: true })
        ]
      }),
      task("Launch-Checkliste finalisieren", { due: "2026-08-20" })
    ], null, "g2"),
    makeList("groceries", "Einkaufen", "var(--list-groceries)", [
      task("Hafermilch"), task("Kaffeebohnen"), task("Spülmaschinentabs", { done: true })
    ], null, "g1")
  ];

  var state = { view: "list", currentListId: "inbox", panelStack: [], collapsedGroups: {}, optionsOpen: false };
  var drag = { type: null, id: null, embedEl: null, embedOwnerId: null };

  function findList(id) { for (var i = 0; i < lists.length; i++) { if (lists[i].id === id) return lists[i]; } return null; }
  function findGroup(id) { for (var i = 0; i < groups.length; i++) { if (groups[i].id === id) return groups[i]; } return null; }
  function childrenOf(owner) { return owner.tasks ? owner.tasks : owner.subtasks; }

  function findTaskGlobal(id) {
    function search(nodes) {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].id === id) return nodes[i];
        var f = search(nodes[i].subtasks);
        if (f) return f;
      }
      return null;
    }
    for (var i = 0; i < lists.length; i++) { var f = search(lists[i].tasks); if (f) return f; }
    return null;
  }

  function findParentTask(id) {
    function search(nodes) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        for (var k = 0; k < n.subtasks.length; k++) { if (n.subtasks[k].id === id) return n; }
        var f = search(n.subtasks);
        if (f) return f;
      }
      return null;
    }
    for (var i = 0; i < lists.length; i++) { var f = search(lists[i].tasks); if (f) return f; }
    return null;
  }

  function setDoneCascade(node, value) {
    node.done = value;
    for (var i = 0; i < node.subtasks.length; i++) { setDoneCascade(node.subtasks[i], value); }
  }

  function recomputeAncestors(id) {
    var current = id;
    while (true) {
      var parent = findParentTask(current);
      if (!parent) break;
      parent.done = parent.subtasks.length > 0 && parent.subtasks.every(function (s) { return s.done; });
      current = parent.id;
    }
  }

  function progress(node) {
    var kids = childrenOf(node);
    if (!kids.length) return null;
    var done = 0;
    for (var i = 0; i < kids.length; i++) { if (kids[i].done) done += 1; }
    return { done: done, total: kids.length };
  }

  function countAll(nodes) {
    var total = 0, done = 0;
    for (var i = 0; i < nodes.length; i++) {
      total += 1; if (nodes[i].done) done += 1;
      var c = countAll(nodes[i].subtasks);
      total += c.total; done += c.done;
    }
    return { total: total, done: done };
  }

  function collectToday() {
    var out = [];
    function walk(nodes, list) {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].due === TODAY_ISO) out.push({ node: nodes[i], list: list });
        walk(nodes[i].subtasks, list);
      }
    }
    for (var i = 0; i < lists.length; i++) { walk(lists[i].tasks, lists[i]); }
    return out;
  }

  function formatDue(iso) {
    if (iso === TODAY_ISO) return "Heute";
    var d = new Date(iso + "T00:00:00");
    var months = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
    return d.getDate() + ". " + months[d.getMonth()];
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; });
  }

  function svgCheck() { return '<svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgPlus() { return '<svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'; }
  function svgFolderPlus() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M1.5 4.2c0-.55.45-1 1-1h2.7l1.1 1.3H12c.55 0 1 .45 1 1V11c0 .55-.45 1-1 1H2.5c-.55 0-1-.45-1-1V4.2z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M7.5 7v3.2M5.9 8.6h3.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'; }
  function svgImg() { return '<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/><circle cx="5" cy="6" r="1" fill="currentColor"/><path d="M2 11l3.5-3.5L8 10l2-2 3 3" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>'; }
  function svgClose() { return '<svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M1 1l11 11M12 1L1 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'; }
  function svgChevronDown() { return '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 3.5l3.5 3 3.5-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgGearPath() { return '<path d="M7.5 5.3a2.2 2.2 0 100 4.4 2.2 2.2 0 000-4.4z" stroke="currentColor" stroke-width="1.1"/><path d="M7.5 1.5v1.3M7.5 12.2v1.3M13.5 7.5h-1.3M2.8 7.5H1.5M11.6 3.4l-.9.9M4.3 10.7l-.9.9M11.6 11.6l-.9-.9M4.3 4.3l-.9-.9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>'; }

  function svgTrash() { return '<svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M2.5 3.5h8M5 3.5V2a1 1 0 011-1h1a1 1 0 011 1v1.5M3.5 3.5l.5 8a1 1 0 001 1h4a1 1 0 001-1l.5-8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

  function renderTaskRow(node, colIndex, listBadge, deleteCtx) {
    var prog = progress(node);
    var html = '<div class="task-row' + (node.done ? " done" : "") + '" data-open-task="' + node.id + '" data-col-index="' + colIndex + '">';
    html += '<button class="check-btn' + (node.done ? " done" : "") + '" data-check="' + node.id + '" role="checkbox" aria-checked="' + node.done + '" aria-label="Als erledigt markieren">' + svgCheck() + "</button>";
    if (listBadge) html += '<span class="list-dot" style="background:' + listBadge.color + '" title="' + escapeHtml(listBadge.name) + '"></span>';
    html += '<span class="task-title">' + escapeHtml(node.title) + "</span>";
    if (prog) {
      var pct = Math.round((prog.done / prog.total) * 100);
      html += '<span class="mini-progress" title="' + prog.done + " von " + prog.total + ' erledigt"><span style="width:' + pct + '%"></span></span>';
    }
    if (node.due) html += '<span class="due-pill' + (node.due === TODAY_ISO ? " today" : "") + '">' + formatDue(node.due) + "</span>";
    if (deleteCtx) html += '<button class="row-delete" data-delete-owner="' + deleteCtx.ownerId + '" data-delete-block="' + node.id + '" data-delete-kind="task" aria-label="Aufgabe löschen">' + svgTrash() + "</button>";
    html += "</div>";
    return html;
  }

  function ownerAt(colIndex) {
    if (colIndex === 0) return state.view === "list" ? findList(state.currentListId) : null;
    return findTaskGlobal(state.panelStack[colIndex - 1]);
  }

  // --- Free-form page editor: renders owner.blocks as a live contenteditable
  // document instead of a fixed block list, so text can be typed anywhere
  // and tasks/images inserted at the cursor.

  function makeInlineTaskNode(node, colIndex, ownerId) {
    var tmp = document.createElement("div");
    tmp.innerHTML = renderTaskRow(node, colIndex, null, { ownerId: ownerId });
    var wrap = document.createElement("div");
    wrap.className = "inline-embed";
    wrap.contentEditable = "false";
    wrap.draggable = true;
    wrap.setAttribute("data-embed-marker", "task:" + node.id);
    wrap.appendChild(tmp.firstElementChild);
    return wrap;
  }

  function makeInlineImageNode(block, ownerId) {
    var wrap = document.createElement("div");
    wrap.className = "inline-embed";
    wrap.contentEditable = "false";
    wrap.draggable = true;
    wrap.setAttribute("data-embed-marker", "image:" + block.id);
    wrap.innerHTML = '<div class="block-image">' + svgImg() + "<span>" + escapeHtml(block.caption || "Bild") + ' · Platzhalter</span></div><button class="row-delete" data-delete-owner="' + ownerId + '" data-delete-block="' + block.id + '" data-delete-kind="image" aria-label="Bild löschen">' + svgTrash() + "</button>";
    return wrap;
  }

  function buildEditorDOM(owner, colIndex) {
    var el = document.createElement("div");
    el.className = "page-editor";
    el.contentEditable = "true";
    el.setAttribute("data-editor-for", owner.id);
    el.setAttribute("data-editor-col", colIndex);
    el.setAttribute("data-placeholder", "Schreib einfach los …");
    var kids = childrenOf(owner);
    for (var i = 0; i < owner.blocks.length; i++) {
      var b = owner.blocks[i];
      if (b.type === "text") {
        el.appendChild(document.createTextNode(b.text));
      } else if (b.type === "task") {
        var child = null;
        for (var k = 0; k < kids.length; k++) { if (kids[k].id === b.id) { child = kids[k]; break; } }
        if (child) el.appendChild(makeInlineTaskNode(child, colIndex, owner.id));
      } else if (b.type === "image") {
        el.appendChild(makeInlineImageNode(b, owner.id));
      }
    }
    return el;
  }

  function mountEditors() {
    var slots = document.querySelectorAll("[data-editor-slot]");
    for (var i = 0; i < slots.length; i++) {
      var slot = slots[i];
      var ownerId = slot.getAttribute("data-editor-slot");
      var colIndex = parseInt(slot.getAttribute("data-editor-col"), 10);
      var owner = findList(ownerId) || findTaskGlobal(ownerId);
      if (!owner) continue;
      slot.appendChild(buildEditorDOM(owner, colIndex));
    }
  }

  function serializeEditor(ownerId) {
    var editorEl = document.querySelector('[data-editor-for="' + ownerId + '"]');
    if (!editorEl) return;
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    if (!owner) return;

    var clone = editorEl.cloneNode(true);
    var embeds = clone.querySelectorAll("[data-embed-marker]");
    for (var i = 0; i < embeds.length; i++) {
      var marker = document.createTextNode("" + embeds[i].getAttribute("data-embed-marker") + "");
      embeds[i].parentNode.replaceChild(marker, embeds[i]);
    }
    var raw = clone.innerText || clone.textContent || "";
    var parts = raw.split("");

    var newBlocks = [];
    for (var p = 0; p < parts.length; p++) {
      if (p % 2 === 0) {
        var text = parts[p].replace(/^\n+|\n+$/g, "");
        if (text !== "") newBlocks.push({ type: "text", text: text });
      } else {
        var mm = parts[p].split(":");
        if (mm[0] === "task") {
          newBlocks.push({ type: "task", id: mm.slice(1).join(":") });
        } else if (mm[0] === "image") {
          var imgId = mm.slice(1).join(":");
          var oldImg = owner.blocks.filter(function (b) { return b.type === "image" && b.id === imgId; })[0];
          newBlocks.push({ type: "image", id: imgId, caption: oldImg ? oldImg.caption : "Bild" });
        }
      }
    }

    var oldTaskIds = owner.blocks.filter(function (b) { return b.type === "task"; }).map(function (b) { return b.id; });
    var newTaskIds = newBlocks.filter(function (b) { return b.type === "task"; }).map(function (b) { return b.id; });
    var removedAncestorUpdateNeeded = owner.subtasks ? true : false;
    for (var t = 0; t < oldTaskIds.length; t++) {
      if (newTaskIds.indexOf(oldTaskIds[t]) === -1) {
        var kids2 = childrenOf(owner);
        var ki = kids2.findIndex(function (k) { return k.id === oldTaskIds[t]; });
        if (ki >= 0) kids2.splice(ki, 1);
        var stackIdx = state.panelStack.indexOf(oldTaskIds[t]);
        if (stackIdx >= 0) state.panelStack = state.panelStack.slice(0, stackIdx);
      }
    }

    owner.blocks = newBlocks;
    if (removedAncestorUpdateNeeded) {
      owner.done = owner.subtasks.length > 0 && owner.subtasks.every(function (s) { return s.done; });
      recomputeAncestors(owner.id);
    }
  }

  function insertEmbedInEditor(editorEl, node) {
    var sel = window.getSelection();
    var hasCursorHere = sel && sel.rangeCount > 0 && editorEl.contains(sel.anchorNode);
    var range;
    if (hasCursorHere) {
      range = sel.getRangeAt(0);
    } else {
      // not focused/positioned in this page: insert at the very top instead of the end
      range = document.createRange();
      range.selectNodeContents(editorEl);
      range.collapse(true);
    }
    range.deleteContents();
    range.insertNode(node);
    range.setStartAfter(node);
    range.setEndAfter(node);
    range.collapse(true);
    editorEl.focus();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  var prevPanelStack = [];

  function renderColumns() {
    var el = document.getElementById("contentArea");
    var html = "";
    var newlyOpened = state.panelStack.filter(function (id) { return prevPanelStack.indexOf(id) === -1; });

    var beforeRects = {};
    var prevCols = el.querySelectorAll(".column[data-col-key]");
    for (var bi = 0; bi < prevCols.length; bi++) {
      beforeRects[prevCols[bi].getAttribute("data-col-key")] = prevCols[bi].getBoundingClientRect().width;
    }

    if (state.view === "today") {
      var d = new Date(TODAY_ISO + "T00:00:00");
      var weekdays = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
      var months = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
      html += '<div class="column" data-col-index="0" data-col-key="today">';
      html += '<div class="col-header"><div class="col-header-top"><h2 class="col-title">Heute</h2></div>';
      html += '<div class="col-meta">' + weekdays[d.getDay()] + ", " + d.getDate() + ". " + months[d.getMonth()] + "</div></div>";
      html += '<div class="blocks">';
      var items = collectToday();
      if (!items.length) {
        html += '<div class="empty-state">Keine Aufgaben mit Fälligkeit heute.</div>';
      } else {
        var byList = {}, order = [];
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          if (!byList[it.list.id]) { byList[it.list.id] = []; order.push(it.list); }
          byList[it.list.id].push(it);
        }
        for (var j = 0; j < order.length; j++) {
          var l = order[j];
          html += '<div class="group-heading"><span class="nav-dot" style="background:' + l.color + '"></span>' + escapeHtml(l.name) + "</div>";
          var group = byList[l.id];
          for (var k = 0; k < group.length; k++) { html += '<div class="block">' + renderTaskRow(group[k].node, 0, null) + "</div>"; }
        }
      }
      html += "</div></div>";
    } else {
      var list = findList(state.currentListId);
      var c = countAll(list.tasks);
      html += '<div class="column" data-col-index="0" data-col-key="list:' + list.id + '">';
      html += '<div class="col-header"><div class="col-header-top"><h2 class="col-title">' + escapeHtml(list.name) + '</h2></div>';
      html += '<div class="col-meta">' + (c.total - c.done) + " offen · " + c.done + " von " + c.total + " erledigt</div></div>";
      html += '<div class="blocks"><div data-editor-slot="' + list.id + '" data-editor-col="0"></div></div>';
      html += '<div class="editor-toolbar"><button class="insert-btn" data-insert-task-at="0">' + svgPlus() + " Aufgabe</button><button class=\"insert-btn\" data-insert-image-at=\"0\">" + svgPlus() + " Bild</button></div>";
      html += '<div class="quick-add"><span style="display:flex">' + svgPlus() + '</span><input type="text" placeholder="Aufgabe hinzufügen …" data-quick-add="0" autocomplete="off" /></div>';
      html += "</div>";
    }

    // panel columns
    for (var p = 0; p < state.panelStack.length; p++) {
      var colIndex = p + 1;
      var node = findTaskGlobal(state.panelStack[p]);
      if (!node) continue;
      html += '<div class="column" data-col-index="' + colIndex + '" data-col-key="task:' + node.id + '">';
      html += '<div class="col-header"><div class="col-header-top">';
      html += '<input class="col-title' + (node.done ? " done" : "") + '" value="' + escapeHtml(node.title) + '" data-title-for="' + node.id + '" />';
      html += '<button class="col-close" data-close-col="' + colIndex + '" aria-label="Seite schließen">' + svgClose() + "</button>";
      html += "</div>";
      if (node.due) {
        html += '<div class="col-progress-row">';
        html += '<span class="due-pill' + (node.due === TODAY_ISO ? " today" : "") + '">' + formatDue(node.due) + "</span>";
        html += "</div>";
      }
      html += "</div>";
      html += '<div class="blocks"><div data-editor-slot="' + node.id + '" data-editor-col="' + colIndex + '"></div></div>';
      html += '<div class="editor-toolbar"><button class="insert-btn" data-insert-task-at="' + colIndex + '">' + svgPlus() + " Aufgabe</button><button class=\"insert-btn\" data-insert-image-at=\"" + colIndex + "\">" + svgPlus() + " Bild</button></div>";
      html += '<div class="quick-add"><span style="display:flex">' + svgPlus() + '</span><input type="text" placeholder="Unteraufgabe hinzufügen …" data-quick-add="' + colIndex + '" autocomplete="off" /></div>';
      html += "</div>";
    }

    el.innerHTML = html;
    mountEditors();
    sizeColumns();
    animateColumnChange(el, beforeRects, newlyOpened);
    prevPanelStack = state.panelStack.slice();
  }

  function animateColumnChange(el, beforeRects, newlyOpened) {
    if (prefersReducedMotion()) return;
    var newKeys = newlyOpened.map(function (id) { return "task:" + id; });
    var cols = el.querySelectorAll(".column[data-col-key]");
    var plan = [];

    for (var i = 0; i < cols.length; i++) {
      var colEl = cols[i];
      var key = colEl.getAttribute("data-col-key");
      var isNew = newKeys.indexOf(key) !== -1;
      var finalWidth = colEl.getBoundingClientRect().width;
      if (isNew) {
        colEl.style.transform = "translateX(100%)";
        plan.push({ el: colEl, isNew: true });
      } else if (beforeRects[key] !== undefined && Math.abs(beforeRects[key] - finalWidth) > 1) {
        colEl.style.flex = "0 0 " + beforeRects[key] + "px";
        plan.push({ el: colEl, isNew: false, targetWidth: finalWidth });
      }
    }

    if (!plan.length) return;
    void el.offsetWidth;

    requestAnimationFrame(function () {
      for (var p = 0; p < plan.length; p++) {
        var item = plan[p];
        item.el.classList.add("col-animating");
        if (item.isNew) { item.el.style.transform = "translateX(0)"; }
        else { item.el.style.flex = "0 0 " + item.targetWidth + "px"; }
      }
      setTimeout(function () {
        for (var q = 0; q < plan.length; q++) {
          plan[q].el.classList.remove("col-animating");
          plan[q].el.style.transform = "";
        }
      }, 340);
    });
  }

  function sizeColumns() {
    var el = document.getElementById("contentArea");
    var cols = el.querySelectorAll(".column");
    if (!cols.length) return;
    var available = el.clientWidth;
    var perColumn = Math.max(240, available / Math.min(cols.length, 3));
    for (var i = 0; i < cols.length; i++) {
      cols[i].style.flex = "0 0 " + perColumn + "px";
    }
  }

  function renderSidebar() {
    var el = document.getElementById("sidebar");
    var html = "";
    html += '<div class="brand"><span class="brand-mark">' + svgPlus() + '</span><span class="brand-name">Unfold</span></div>';
    html += '<div class="nav-label">Übersicht</div>';
    html += navItem({ kind: "today", active: state.view === "today", label: "Heute", count: collectToday().length, icon: true });
    html += '<div class="nav-label">Listen</div>';

    var ungrouped = lists.filter(function (l) { return !l.groupId; });
    for (var i = 0; i < ungrouped.length; i++) { html += listNavItem(ungrouped[i]); }

    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      var collapsed = !!state.collapsedGroups[g.id];
      var groupLists = lists.filter(function (l) { return l.groupId === g.id; });
      html += groupHeader(g, collapsed, groupLists.length);
      if (!collapsed) { for (var k = 0; k < groupLists.length; k++) { html += listNavItem(groupLists[k], true); } }
    }

    html += '<div class="sidebar-spacer"></div>';

    var pref = currentThemePref();
    html += '<div class="options-wrap">';
    html += '<button class="nav-item" id="optionsBtn" type="button"><svg class="nav-icon" viewBox="0 0 15 15" fill="none">' + svgGearPath() + '</svg><span class="nav-name">Optionen</span></button>';
    html += '<div class="options-panel" id="optionsPanel"' + (state.optionsOpen ? "" : " hidden") + '>';
    html += '<div class="options-title">Darstellung</div>';
    html += '<div class="theme-segmented">';
    html += '<button class="theme-seg-btn' + (pref === "light" ? " active" : "") + '" data-set-theme="light">Hell</button>';
    html += '<button class="theme-seg-btn' + (pref === "dark" ? " active" : "") + '" data-set-theme="dark">Dunkel</button>';
    html += '<button class="theme-seg-btn' + (pref === "system" ? " active" : "") + '" data-set-theme="system">System</button>';
    html += "</div></div></div>";

    html += '<div class="sidebar-bottom-actions">';
    html += '<button class="icon-action-btn primary" id="newListBtn" type="button" title="Neue Liste" aria-label="Neue Liste">' + svgPlus() + "</button>";
    html += '<button class="icon-action-btn" id="newGroupBtn" type="button" title="Neue Gruppe" aria-label="Neue Gruppe">' + svgFolderPlus() + "</button>";
    html += "</div>";
    el.innerHTML = html;
  }

  function currentThemePref() {
    var attr = document.documentElement.getAttribute("data-theme");
    return attr === "dark" ? "dark" : attr === "light" ? "light" : "system";
  }

  function listNavItem(l, indented) {

    return '<div class="nav-item-wrap">' +
      '<button class="nav-item' + (active ? " active" : "") + (indented ? " nav-item-indented" : "") + '" data-nav="list" data-list="' + l.id + '" draggable="true" data-drag-type="list" data-drag-id="' + l.id + '" type="button"><span class="nav-dot" style="background:' + l.color + '"></span><span class="nav-name">' + escapeHtml(l.name) + '</span><span class="nav-count">' + (c.total - c.done) + "</span></button>" +

  function groupHeader(g, collapsed, count) {

      '<input class="group-title" value="' + escapeHtml(g.name) + '" data-group-title-for="' + g.id + '" />' +
      '<span class="nav-count">' + count + "</span>" +

      "</div>";
  }

  function navItem(opts) {
    var attrs = 'data-nav="today"';
    var iconOrDot = '<svg class="nav-icon" viewBox="0 0 15 15" fill="none"><path d="M7.5 1.2l1.7 3.7 4 .5-3 2.8.8 4-3.5-2-3.5 2 .8-4-3-2.8 4-.5z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>';
    return '<button class="nav-item' + (opts.active ? " active" : "") + '" ' + attrs + ' type="button">' + iconOrDot + '<span class="nav-name">' + escapeHtml(opts.label) + '</span><span class="nav-count">' + opts.count + "</span></button>";

  function renderAll() {
    renderSidebar();
    document.getElementById("appWindow").classList.toggle("sidebar-collapsed", state.panelStack.length >= 2);
    renderColumns();
  }

  function scrollToEnd() {
    requestAnimationFrame(function () {
      var el = document.getElementById("contentArea");
      el.scrollLeft = el.scrollWidth;
    });
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function animateRemove(el, cb) {
    if (!el || prefersReducedMotion()) { cb(); return; }
    var h = el.getBoundingClientRect().height;
    el.style.height = h + "px";
    void el.offsetHeight;
    el.classList.add("removing");
    requestAnimationFrame(function () { el.style.height = "0px"; });
    setTimeout(cb, 210);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-nav]");
    if (el) {
      if (el.getAttribute("data-nav") === "today") { state.view = "today"; } else { state.view = "list"; state.currentListId = el.getAttribute("data-list"); }
      state.panelStack = [];
      renderAll();
      return;
    }

    el = e.target.closest("#newListBtn");
    if (el) {
      var n = lists.length + 1;
      var newList = makeList("list" + n, "Neue Liste", "var(--list-inbox)", []);
      lists.push(newList);
      state.view = "list"; state.currentListId = newList.id; state.panelStack = [];
      renderAll();
      return;
    }

    el = e.target.closest("#newGroupBtn");
    if (el) {
      var gn = groups.length + 1;
      groups.push({ id: "grp" + Date.now(), name: "Neue Gruppe " + gn });
      renderSidebar();
      return;
    }

    el = e.target.closest("[data-toggle-group]");
    if (el) {
      var gid = el.getAttribute("data-toggle-group");
      state.collapsedGroups[gid] = !state.collapsedGroups[gid];
      renderSidebar();
      return;
    }

    el = e.target.closest("[data-delete-list]");
    if (el) {
      var delListId = el.getAttribute("data-delete-list");
      var wrap = el.closest(".nav-item-wrap");
      animateRemove(wrap, function () {
        var idx = lists.findIndex(function (l) { return l.id === delListId; });
        if (idx >= 0) lists.splice(idx, 1);
        if (state.currentListId === delListId) {
          state.currentListId = lists.length ? lists[0].id : null;
          state.view = lists.length ? "list" : "today";
          state.panelStack = [];
        }
        renderAll();
      });
      return;
    }

    el = e.target.closest("[data-delete-group]");
    if (el) {
      var delGroupId = el.getAttribute("data-delete-group");
      var groupRow = el.closest(".group-row");
      animateRemove(groupRow, function () {
        for (var gi2 = 0; gi2 < lists.length; gi2++) { if (lists[gi2].groupId === delGroupId) lists[gi2].groupId = null; }
        var gidx = groups.findIndex(function (g) { return g.id === delGroupId; });
        if (gidx >= 0) groups.splice(gidx, 1);
        delete state.collapsedGroups[delGroupId];
        renderAll();
      });
      return;
    }

    el = e.target.closest("[data-check]");
    if (el) {
      var node = findTaskGlobal(el.getAttribute("data-check"));
      if (node) {
        setDoneCascade(node, !node.done);
        recomputeAncestors(node.id);
        renderColumns();
        renderSidebar();
      }
      return;
    }

    el = e.target.closest("[data-delete-owner]");
    if (el) {
      var ownerId = el.getAttribute("data-delete-owner");
      var blockId = el.getAttribute("data-delete-block");
      var kind = el.getAttribute("data-delete-kind");
      var deleteOwner = findList(ownerId) || findTaskGlobal(ownerId);
      var embedEl = el.closest(".inline-embed");
      if (deleteOwner) {
        animateRemove(embedEl, function () {
          var bidx = deleteOwner.blocks.findIndex(function (b) { return b.id === blockId; });
          if (kind === "task" && bidx >= 0) {
            var kids = childrenOf(deleteOwner);
            var ki = kids.findIndex(function (k) { return k.id === blockId; });
            if (ki >= 0) kids.splice(ki, 1);
            var stackIdx = state.panelStack.indexOf(blockId);
            if (stackIdx >= 0) state.panelStack = state.panelStack.slice(0, stackIdx);
            if (deleteOwner.subtasks) {
              deleteOwner.done = deleteOwner.subtasks.length > 0 && deleteOwner.subtasks.every(function (s) { return s.done; });
              recomputeAncestors(deleteOwner.id);
            }
          }
          if (bidx >= 0) deleteOwner.blocks.splice(bidx, 1);
          renderAll();
        });
      }
      return;
    }

    el = e.target.closest("[data-open-task]");
    if (el) {
      var taskId = el.getAttribute("data-open-task");
      var j = parseInt(el.getAttribute("data-col-index"), 10);
      state.panelStack = state.panelStack.slice(0, j).concat([taskId]);
      renderAll();
      scrollToEnd();
      return;
    }

    el = e.target.closest("[data-close-col]");
    if (el) {
      var j2 = parseInt(el.getAttribute("data-close-col"), 10);
      state.panelStack = state.panelStack.slice(0, j2 - 1);
      renderAll();
      return;
    }

    el = e.target.closest("[data-insert-task-at]");
    if (el) {
      var colIndex1 = parseInt(el.getAttribute("data-insert-task-at"), 10);
      var owner1 = ownerAt(colIndex1);
      if (!owner1) return;
      var editorEl1 = document.querySelector('[data-editor-for="' + owner1.id + '"]');
      var t1 = task("Neue Aufgabe");
      childrenOf(owner1).push(t1);
      if (owner1.subtasks) { owner1.done = false; recomputeAncestors(owner1.id); }
      if (editorEl1) {
        insertEmbedInEditor(editorEl1, makeInlineTaskNode(t1, colIndex1, owner1.id));
        serializeEditor(owner1.id);
      } else {
        owner1.blocks.push({ type: "task", id: t1.id });
      }
      state.panelStack = state.panelStack.slice(0, colIndex1).concat([t1.id]);
      renderAll();
      scrollToEnd();
      return;
    }

    el = e.target.closest("[data-insert-image-at]");
    if (el) {
      var colIndex2 = parseInt(el.getAttribute("data-insert-image-at"), 10);
      var owner2 = ownerAt(colIndex2);
      if (!owner2) return;
      var editorEl2 = document.querySelector('[data-editor-for="' + owner2.id + '"]');
      var imgBlock = { type: "image", id: "img" + Date.now(), caption: "Neues Bild" };
      if (editorEl2) {
        insertEmbedInEditor(editorEl2, makeInlineImageNode(imgBlock, owner2.id));
        serializeEditor(owner2.id);
      } else {
        owner2.blocks.push(imgBlock);
      }
      renderColumns();
      return;
    }
  });

  document.addEventListener("mousedown", function (e) {
    if (e.target.closest("[data-insert-task-at], [data-insert-image-at]")) { e.preventDefault(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.hasAttribute && e.target.hasAttribute("data-quick-add")) {
      e.preventDefault();
      var val = e.target.value.trim();
      if (!val) return;
      var colIndex = parseInt(e.target.getAttribute("data-quick-add"), 10);
      var owner = ownerAt(colIndex);
      if (!owner) return;
      var t = task(val);
      childrenOf(owner).push(t);
      owner.blocks.push({ type: "task", id: t.id });
      if (owner.subtasks) { owner.done = false; recomputeAncestors(owner.id); }
      e.target.value = "";
      renderAll();
      var again = document.querySelector('[data-quick-add="' + colIndex + '"]');
      if (again) again.focus();
      return;
    }
    if (e.key === "Escape" && state.panelStack.length) { state.panelStack = []; renderAll(); }
  });

  document.addEventListener("blur", function (e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-editor-for")) {
      serializeEditor(e.target.getAttribute("data-editor-for"));
    }
  }, true);

  document.addEventListener("dragover", function (e) {
    var editor = e.target.closest(".page-editor");
    if (!editor || drag.type) return;
    e.preventDefault();
    editor.classList.add("drag-over");
  });

  document.addEventListener("dragleave", function (e) {
    var editor = e.target.closest(".page-editor");
    if (editor) editor.classList.remove("drag-over");
  });

  document.addEventListener("drop", function (e) {
    var editor = e.target.closest(".page-editor");
    if (!editor || drag.type) return;
    e.preventDefault();
    editor.classList.remove("drag-over");
    var ownerId = editor.getAttribute("data-editor-for");
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    if (!owner) return;
    var imgBlock = { type: "image", id: "img" + Date.now(), caption: "Reingezogenes Bild" };
    var range = null;
    if (document.caretRangeFromPoint) { range = document.caretRangeFromPoint(e.clientX, e.clientY); }
    else if (document.caretPositionFromPoint) {
      var pos = document.caretPositionFromPoint(e.clientX, e.clientY);
      if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); range.collapse(true); }
    }
    var node = makeInlineImageNode(imgBlock, owner.id);
    if (range && editor.contains(range.startContainer)) {
      range.insertNode(node);
    } else {
      editor.appendChild(node);
    }
    serializeEditor(ownerId);
    renderColumns();
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-title-for")) {
      var node = findTaskGlobal(e.target.getAttribute("data-title-for"));
      if (node) node.title = e.target.value;
    }
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-group-title-for")) {
      var group = findGroup(e.target.getAttribute("data-group-title-for"));
      if (group) group.name = e.target.value;
    }
  });

  function moveList(draggedId, targetId, position) {
    var draggedIdx = lists.findIndex(function (l) { return l.id === draggedId; });
    if (draggedIdx < 0) return;
    var draggedList = lists[draggedIdx];
    lists.splice(draggedIdx, 1);
    var targetIdx = lists.findIndex(function (l) { return l.id === targetId; });
    if (targetIdx < 0) { lists.push(draggedList); return; }
    var target = lists[targetIdx];
    draggedList.groupId = target.groupId;
    var insertAt = position === "before" ? targetIdx : targetIdx + 1;
    lists.splice(insertAt, 0, draggedList);
  }

  function moveListToGroupEnd(draggedId, groupId) {
    var idx = lists.findIndex(function (l) { return l.id === draggedId; });
    if (idx < 0) return;
    var draggedList = lists[idx];
    lists.splice(idx, 1);
    draggedList.groupId = groupId;
    lists.push(draggedList);
  }

  function moveGroup(draggedId, targetId, position) {
    var draggedIdx = groups.findIndex(function (g) { return g.id === draggedId; });
    if (draggedIdx < 0) return;
    var draggedGroup = groups[draggedIdx];
    groups.splice(draggedIdx, 1);
    var targetIdx = groups.findIndex(function (g) { return g.id === targetId; });
    if (targetIdx < 0) { groups.push(draggedGroup); return; }
    var insertAt = position === "before" ? targetIdx : targetIdx + 1;
    groups.splice(insertAt, 0, draggedGroup);
  }

  var dropIndicatorEl = null;
  function clearDropIndicator() {
    if (dropIndicatorEl) { dropIndicatorEl.classList.remove("drop-before", "drop-after", "drop-into"); dropIndicatorEl = null; }
  }

  var sidebarEl = document.getElementById("sidebar");

  sidebarEl.addEventListener("dragstart", function (e) {
    var handle = e.target.closest('[data-drag-type]');
    if (!handle) return;
    drag.type = handle.getAttribute("data-drag-type");
    drag.id = handle.getAttribute("data-drag-id");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", drag.id);
    setTimeout(function () { handle.classList.add("drag-ghost"); }, 0);
  });

  sidebarEl.addEventListener("dragend", function (e) {
    var handle = e.target.closest('[data-drag-type]');
    if (handle) handle.classList.remove("drag-ghost");
    clearDropIndicator();
    drag.type = null; drag.id = null;
  });

  sidebarEl.addEventListener("dragover", function (e) {
    if (!drag.type) return;
    var groupTarget = e.target.closest('.group-row[data-drag-type="group"]');
    var listTarget = e.target.closest('.nav-item[data-drag-type="list"]');

    if (drag.type === "list" && groupTarget) {
      e.preventDefault();
      clearDropIndicator();
      groupTarget.classList.add("drop-into");
      dropIndicatorEl = groupTarget;
      return;
    }
    if (drag.type === "list" && listTarget && listTarget.getAttribute("data-drag-id") !== drag.id) {
      e.preventDefault();
      var rect = listTarget.getBoundingClientRect();
      var pos = e.clientY < rect.top + rect.height / 2 ? "drop-before" : "drop-after";
      clearDropIndicator();
      listTarget.classList.add(pos);
      dropIndicatorEl = listTarget;
      return;
    }
    if (drag.type === "group" && groupTarget && groupTarget.getAttribute("data-drag-id") !== drag.id) {
      e.preventDefault();
      var grect = groupTarget.getBoundingClientRect();
      var gpos = e.clientY < grect.top + grect.height / 2 ? "drop-before" : "drop-after";
      clearDropIndicator();
      groupTarget.classList.add(gpos);
      dropIndicatorEl = groupTarget;
      return;
    }
  });

  sidebarEl.addEventListener("drop", function (e) {
    if (!drag.type) return;
    e.preventDefault();
    var groupTarget = e.target.closest('.group-row[data-drag-type="group"]');
    var listTarget = e.target.closest('.nav-item[data-drag-type="list"]');

    if (drag.type === "list" && groupTarget) {
      moveListToGroupEnd(drag.id, groupTarget.getAttribute("data-drag-id"));
    } else if (drag.type === "list" && listTarget && listTarget.getAttribute("data-drag-id") !== drag.id) {
      var rect = listTarget.getBoundingClientRect();
      var pos = e.clientY < rect.top + rect.height / 2 ? "before" : "after";
      moveList(drag.id, listTarget.getAttribute("data-drag-id"), pos);
    } else if (drag.type === "group" && groupTarget && groupTarget.getAttribute("data-drag-id") !== drag.id) {
      var grect = groupTarget.getBoundingClientRect();
      var gpos = e.clientY < grect.top + grect.height / 2 ? "before" : "after";
      moveGroup(drag.id, groupTarget.getAttribute("data-drag-id"), gpos);
    }

    clearDropIndicator();
    drag.type = null; drag.id = null;
    renderSidebar();
  });

  var embedDropIndicatorEl = null;
  function clearEmbedDropIndicator() {
    if (embedDropIndicatorEl) { embedDropIndicatorEl.classList.remove("drop-before", "drop-after"); embedDropIndicatorEl = null; }
  }

  document.addEventListener("dragstart", function (e) {
    var handle = e.target.closest(".inline-embed[data-embed-marker]");
    if (!handle) return;
    var editor = handle.closest(".page-editor");
    if (!editor) return;
    drag.type = "embed";
    drag.embedEl = handle;
    drag.embedOwnerId = editor.getAttribute("data-editor-for");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", handle.getAttribute("data-embed-marker"));
    setTimeout(function () { handle.classList.add("drag-ghost"); }, 0);
  });

  document.addEventListener("dragover", function (e) {
    if (drag.type !== "embed") return;
    var target = e.target.closest(".inline-embed[data-embed-marker]");
    if (!target || target === drag.embedEl) return;
    var editor = target.closest(".page-editor");
    if (!editor || editor.getAttribute("data-editor-for") !== drag.embedOwnerId) return;
    e.preventDefault();
    var rect = target.getBoundingClientRect();
    var pos = e.clientY < rect.top + rect.height / 2 ? "drop-before" : "drop-after";
    clearEmbedDropIndicator();
    target.classList.add(pos);
    embedDropIndicatorEl = target;
  });

  document.addEventListener("drop", function (e) {
    if (drag.type !== "embed") return;
    var target = e.target.closest(".inline-embed[data-embed-marker]");
    if (target && target !== drag.embedEl) {
      var editor = target.closest(".page-editor");
      if (editor && editor.getAttribute("data-editor-for") === drag.embedOwnerId) {
        e.preventDefault();
        var rect = target.getBoundingClientRect();
        var pos = e.clientY < rect.top + rect.height / 2 ? "before" : "after";
        if (pos === "before") { target.parentNode.insertBefore(drag.embedEl, target); }
        else { target.parentNode.insertBefore(drag.embedEl, target.nextSibling); }
        serializeEditor(drag.embedOwnerId);
        renderAll();
      }
    }
    clearEmbedDropIndicator();
  });

  document.addEventListener("dragend", function (e) {
    if (drag.type !== "embed") return;
    if (drag.embedEl) drag.embedEl.classList.remove("drag-ghost");
    clearEmbedDropIndicator();
    drag.type = null; drag.embedEl = null; drag.embedOwnerId = null;
  });

  document.addEventListener("click", function (e) {
    if (e.target.closest("#optionsBtn")) {
      state.optionsOpen = !state.optionsOpen;
      renderSidebar();
      return;
    }
    var themeChoice = e.target.closest("[data-set-theme]");
    if (themeChoice) {
      var choice = themeChoice.getAttribute("data-set-theme");
      if (choice === "system") { document.documentElement.removeAttribute("data-theme"); }
      else { document.documentElement.setAttribute("data-theme", choice); }
      state.optionsOpen = false;
      renderSidebar();
      return;
    }
    if (state.optionsOpen && !e.target.closest(".options-wrap")) {
      state.optionsOpen = false;
      renderSidebar();
    }
  });

  document.documentElement.setAttribute("data-theme", "light");
  renderAll();
})();
</script>
