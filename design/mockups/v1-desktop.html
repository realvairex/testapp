    var survivingCount = survivingEls.length || 1;
    var contentWidth = contentAreaWidth();
    var newSurvivorWidth = Math.max(240, contentWidth / Math.min(survivingCount, 3));

    // Commit the final layout instantly (temporary - afterClose() rebuilds
    // the real DOM from state shortly), then FLIP-compensate every column
    // back to how it looked a moment ago and animate to identity/exit.
    for (var s = 0; s < survivingEls.length; s++) { survivingEls[s].style.flex = "0 0 " + newSurvivorWidth + "px"; }
    var newScrollWidth = survivingCount * newSurvivorWidth;
    el.scrollLeft = Math.max(0, newScrollWidth - contentWidth);

    var plan = [];
    for (var s2 = 0; s2 < survivingEls.length; s2++) {
      var sEl = survivingEls[s2];
      var oldS = oldRects[sEl.getAttribute("data-col-key")];
      var rectS = sEl.getBoundingClientRect();
      var deltaXs = oldS.left - rectS.left;
      var scaleRatioS = oldS.width / rectS.width;
      if (Math.abs(deltaXs) > 0.5 || Math.abs(scaleRatioS - 1) > 0.01) {
        plan.push({
          column: sEl,
          colInner: sEl.querySelector(".col-inner"),
          fromCol: "translateX(" + deltaXs + "px) scaleX(" + scaleRatioS + ")",
          toCol: "translateX(0) scaleX(1)",
          fromInner: "scaleX(" + (1 / scaleRatioS) + ")",
          toInner: "scaleX(1)"
        });
      }
    }
    for (var c = 0; c < closingEls.length; c++) {
      var cEl = closingEls[c];
      var oldC = oldRects[cEl.getAttribute("data-col-key")];
      var rectC = cEl.getBoundingClientRect();
      var deltaXc = oldC.left - rectC.left;
      var exitOffset = appRight - rectC.left;
      cEl.style.pointerEvents = "none";
      plan.push({ column: cEl, colInner: null, fromCol: "translateX(" + deltaXc + "px)", toCol: "translateX(" + exitOffset + "px)" });
    }

    runFlip(el, plan, afterClose);
  }

  // The content-area's true final width, independent of how far the
  // sidebar-track's CSS transition has progressed at the moment this is
  // called (its `clientWidth` is ambiguous mid-transition). Callers must
  // toggle `.sidebar-collapsed` to its FINAL target state first.
  function contentAreaWidth() {
    var appWindow = document.getElementById("appWindow");
    var full = appWindow.clientWidth; // excludes the 1px border on each side
    return appWindow.classList.contains("sidebar-collapsed") ? full : full - 248;
  }

  function sizeColumns() {
    var el = document.getElementById("contentArea");
    var cols = el.querySelectorAll(".column");
    if (!cols.length) return;
    var available = contentAreaWidth();
    var perColumn = Math.max(240, available / Math.min(cols.length, 3));
    for (var i = 0; i < cols.length; i++) {
      cols[i].style.flex = "0 0 " + perColumn + "px";
    }
  }

  function renderSidebar() {
    var el = document.getElementById("sidebar");
    var html = "";
    html += '<div class="brand"><span class="brand-mark">' + svgLogo() + '</span><span class="brand-name">Unfold</span></div>';
    html += '<div class="nav-label">Übersicht</div>';
    html += inboxNavItem();
    html += navItem({ kind: "today", active: state.view === "today", label: "Heute", count: collectToday().length, icon: true });
    html += '<div class="nav-label">Listen</div>';

    // Der Eingang steht oben und taucht hier nicht noch einmal auf.
    var ungrouped = lists.filter(function (l) { return !l.groupId && l.id !== INBOX_ID; });
    for (var i = 0; i < ungrouped.length; i++) { html += listNavItem(ungrouped[i]); }

    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      var collapsed = !!state.collapsedGroups[g.id];
      var groupLists = lists.filter(function (l) { return l.groupId === g.id; });
      html += groupHeader(g, collapsed, groupLists.length);
      if (!collapsed) { for (var k = 0; k < groupLists.length; k++) { html += listNavItem(groupLists[k], true, k === groupLists.length - 1); } }
    }

    html += '<div class="sidebar-spacer"></div>';

    var pref = currentThemePref();
    // Reihenfolge: dunkel links, hell rechts.
    var segIdx = THEME_ORDER.indexOf(pref); if (segIdx < 0) segIdx = 0;
    html += '<div class="theme-segmented" role="radiogroup" aria-label="Darstellung"' +
            ' style="--seg-count: ' + THEME_ORDER.length + '">';
    // Startposition steht direkt im Markup: Ein frisch erzeugtes Element
    // hat keinen Vorher-Wert, auf dem ein Uebergang laufen koennte - der
    // Knopf sitzt beim Aufbau der Sidebar also sofort richtig und gleitet
    // erst bei einem echten Wechsel.
    html += '<span class="theme-seg-thumb" aria-hidden="true" style="transform: translateX(' + (segIdx * 100) + '%)"></span>';
    for (var ti = 0; ti < THEME_ORDER.length; ti++) {
      var tk = THEME_ORDER[ti];
      var on = pref === tk;
      html += '<button class="theme-seg-btn' + (on ? " active" : "") + '" type="button" role="radio"' +
              ' aria-checked="' + (on ? "true" : "false") + '" data-set-theme="' + tk + '">' +
              THEME_LABELS[tk] + "</button>";
    }
    html += "</div>";

    html += '<div class="sidebar-bottom-actions">';
    html += '<button class="icon-action-btn primary" id="newListBtn" type="button" title="Neue Liste" aria-label="Neue Liste">' + svgPlus() + "</button>";
    html += '<button class="icon-action-btn" id="newGroupBtn" type="button" title="Neue Gruppe" aria-label="Neue Gruppe">' + svgFolderPlus() + "</button>";
    html += "</div>";
    el.innerHTML = html;
    zaehlerRollen();
  }

  // Nur noch zwei Werte. Der Rueckfall auf "light" greift nur in dem
  // Wimpernschlag vor dem ersten Setzen von data-theme; bis dahin regelt
  // der @media-Block die Darstellung.
  function currentThemePref() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  // Aktualisiert den segmentierten Schalter an Ort und Stelle, statt die
  // Sidebar neu zu bauen. Notwendig, damit der Knopf gleitet: CSS-Uebergaenge
  // laufen nicht auf frisch erzeugten Elementen, ein Neuaufbau liesse ihn
  // also springen.
  function syncThemeSegmented() {
    var wrap = document.querySelector(".theme-segmented");
    if (!wrap) return;
    var pref = currentThemePref();
    var idx = THEME_ORDER.indexOf(pref); if (idx < 0) idx = 0;
    var thumb = wrap.querySelector(".theme-seg-thumb");
    if (thumb) thumb.style.transform = "translateX(" + (idx * 100) + "%)";
    var btns = wrap.querySelectorAll(".theme-seg-btn");
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute("data-set-theme") === pref;
      btns[i].classList.toggle("active", on);
      btns[i].setAttribute("aria-checked", on ? "true" : "false");
    }
  }

  function listNavItem(l, indented, isLast) {
    var c = countAll(l.tasks);
    var active = state.view === "list" && state.currentListId === l.id;
    // data-neu-schluessel haengt diese Zeile an die vorhandene
    // Einblend-Mechanik (einblendenNurNeu): Eine frisch angelegte Liste
    // blendet ein, eine bestehende nie - auch nicht, wenn die Sidebar aus
    // einem anderen Grund neu gebaut wird. Ohne das erschien die neue
    // Zeile schlagartig, waehrend das Anlegen sonst nichts zu sehen gab.
    return '<div class="nav-item-wrap' + (indented ? " in-group" : "") + (indented && isLast ? " last-in-group" : "") + '" data-neu-schluessel="liste:' + l.id + '">' +
      '<button class="nav-item' + (active ? " active" : "") + (indented ? " nav-item-indented" : "") + '" data-nav="list" data-list="' + l.id + '" data-drag-type="list" data-drag-id="' + l.id + '" type="button"><span class="nav-dot" style="background:' + l.color + '"></span><span class="nav-name">' + escapeHtml(l.name) + '</span><span class="nav-count">' + (c.total - c.done) + "</span></button>" +
      '<button class="nav-delete" data-delete-list="' + l.id + '" aria-label="Liste löschen" title="Liste löschen">' + svgTrash() + "</button>" +
      "</div>";
  }

  function groupHeader(g, collapsed, count) {
    return '<div class="group-row" data-drag-type="group" data-drag-id="' + g.id + '">' +
      '<button class="group-chevron' + (collapsed ? " collapsed" : "") + '" data-toggle-group="' + g.id + '" aria-label="Gruppe ein-/ausklappen">' + svgChevronDown() + "</button>" +
      '<input class="group-title" value="' + escapeHtml(g.name) + '" data-group-title-for="' + g.id + '" />' +
      '<span class="nav-count">' + count + "</span>" +
      '<span class="group-actions">' +
        '<button class="nav-delete" data-add-list-to="' + g.id + '" aria-label="Liste in dieser Gruppe anlegen" title="Liste in dieser Gruppe anlegen">' + svgPlus() + "</button>" +
        '<button class="nav-delete" data-delete-group="' + g.id + '" aria-label="Gruppe löschen" title="Gruppe löschen">' + svgTrash() + "</button>" +
      "</span>" +
      "</div>";
  }

  // Kein Farbpunkt (der Eingang hat kein Thema), kein Loeschknopf und
  // keine data-drag-* Attribute - er laesst sich nicht umsortieren. Das
  // data-list bleibt, damit er Ziel fuer hineingezogene Aufgaben ist.
  function inboxNavItem() {
    var l = findList(INBOX_ID);
    if (!l) return "";
    var c = countAll(l.tasks);
    var active = state.view === "list" && state.currentListId === INBOX_ID;
    return '<div class="nav-item-wrap">' +
      '<button class="nav-item' + (active ? " active" : "") + '" data-nav="list" data-list="' + INBOX_ID + '" type="button">' +
      svgInbox() + '<span class="nav-name">' + escapeHtml(l.name) + '</span>' +
      '<span class="nav-count">' + (c.total - c.done) + "</span></button></div>";
  }

  function navItem(opts) {
    var attrs = 'data-nav="today"';
    var iconOrDot = '<svg class="nav-icon" viewBox="0 0 15 15" fill="none"><path d="M7.5 1.2l1.7 3.7 4 .5-3 2.8.8 4-3.5-2-3.5 2 .8-4-3-2.8 4-.5z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg>';
    return '<button class="nav-item' + (opts.active ? " active" : "") + '" ' + attrs + ' type="button">' + iconOrDot + '<span class="nav-name">' + escapeHtml(opts.label) + '</span><span class="nav-count">' + opts.count + "</span></button>";
  }

  // Vergleicht die Zaehler der Sidebar mit dem Stand vor dem letzten Aufbau
  // und laesst geaenderte hereinrollen. Nach dem Aufbau statt im Auszeichnen,
  // weil renderSidebar() die Elemente jedes Mal neu erzeugt - der alte Wert
  // steht dann nirgends mehr im Dokument und muss hier gemerkt werden.
  var zaehlerAlt = {};
  function zaehlerRollen() {
    var els = document.querySelectorAll("#sidebar .nav-count");
    for (var i = 0; i < els.length; i++) {
      var e = els[i], p = e.parentElement;
      var schluessel = p.getAttribute("data-list") || p.getAttribute("data-drag-id") ||
                       p.getAttribute("data-nav") || ("pos" + i);
      var wert = e.textContent;
      var vorher = zaehlerAlt[schluessel];
      if (vorher !== undefined && vorher !== wert && !prefersReducedMotion()) {
        e.classList.add(Number(wert) < Number(vorher) ? "rollt-runter" : "rollt-hoch");
      }
      zaehlerAlt[schluessel] = wert;
    }
  }

  function renderAll() {
    renderSidebar();
    document.getElementById("appWindow").classList.toggle("sidebar-collapsed", state.panelStack.length >= 2);
    renderColumns();
  }

  // Closing a panel never changes any task/list data - it's a pure view
  // action. renderAll()/renderColumns() rebuild every visible column's
  // innerHTML from scratch (incl. the contenteditable page editors), which
  // is safe but tears down and recreates DOM the user never touched,
  // reading as an unwanted "refresh" flash right as the close animation
  // settles. Removing just the closed column nodes leaves untouched
  // survivor columns' DOM (and editor state/cursor) completely alone.
  function closeColumnsFrom(fromColIndex) {
    var el = document.getElementById("contentArea");
    var cols = el.querySelectorAll(".column[data-col-index]");
    for (var i = 0; i < cols.length; i++) {
      if (parseInt(cols[i].getAttribute("data-col-index"), 10) >= fromColIndex) cols[i].remove();
    }
    prevPanelStack = state.panelStack.slice();
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function animateRemove(el, cb) {
    if (!el || prefersReducedMotion()) { cb(); return; }
    var h = el.getBoundingClientRect().height;
    el.style.height = h + "px";
    void el.offsetHeight;
    el.classList.add("removing");
    requestAnimationFrame(function () { el.style.height = "0px"; });
    setTimeout(cb, 210);
  }

  document.addEventListener("click", function (e) {
    // --- Aufräum-Modus zuerst -------------------------------------------
    // Er steht ganz oben, weil weiter unten zwei Aufraeumer stehen ("Klick
    // irgendwo sonst schliesst Farbreihe/Kalender"), die renderColumns()
    // aufrufen. Die wuerden die Karte aus dem Dokument nehmen, bevor die
    // Wegflug-Bewegung sie ueberhaupt zu fassen bekommt.
    var el = e.target.closest("[data-tidy-liste]");
    if (el) { tidyInListe(el.getAttribute("data-tidy-liste")); return; }

    el = e.target.closest("[data-tidy-datum]");
    if (el) { tidyDatum(el.getAttribute("data-tidy-datum")); return; }

    if (state.tidy) {
      // Der Kalender des Aufraeum-Modus laeuft ueber eigenen Zustand
      // (state.tidy.kalender) statt ueber state.calendarFor - sonst griffe
      // der Aufraeumer weiter unten und schloesse ihn beim ersten Klick.
      el = e.target.closest("[data-cal-day]");
      if (el) { tidyDatum(el.getAttribute("data-cal-value")); return; }
      el = e.target.closest("[data-cal-step]");
      if (el) {
        state.calMonth = monatVerschieben(state.calMonth || TODAY_ISO.slice(0, 7),
                                          parseInt(el.getAttribute("data-cal-step"), 10));
        renderColumns();
        return;
      }
    }

    el = e.target.closest("[data-tidy]");
    if (el) {
      var was = el.getAttribute("data-tidy");
      if (was === "start") tidyStart();
      else if (was === "quit") tidyBeenden();
      else if (was === "zurueck") tidyZurueck();
      else if (was === "spaeter") tidySpaeter();
      else if (was === "erledigt") tidyErledigt();
      else if (was === "neue-liste" && state.tidy) {
        state.tidy.neueListe = true;
        state.tidy.kalender = false;
        renderColumns();
        var feld = document.querySelector("[data-tidy-neu-feld]");
        if (feld) feld.focus();
      } else if (was === "kalender" && state.tidy) {
        var offenerKnoten = tidyAktuell();
        state.tidy.kalender = !state.tidy.kalender;
        state.calMonth = ((offenerKnoten && offenerKnoten.due) || TODAY_ISO).slice(0, 7);
        renderColumns();
      }
      return;
    }

    el = e.target.closest("[data-nav]");
    if (el) {
      // Wer den Eingang verlaesst, verlaesst den Durchgang. Ihn im
      // Hintergrund weiterlaufen zu lassen hiesse, spaeter mit einer
      // veralteten Warteschlange zurueckzukehren.
      state.tidy = null;
      if (el.getAttribute("data-nav") === "today") { state.view = "today"; } else { state.view = "list"; state.currentListId = el.getAttribute("data-list"); }
      state.panelStack = [];
      renderAll();
      return;
    }

    el = e.target.closest("#newListBtn");
    if (el) {
      var n = lists.length + 1;
      var newList = makeList("list" + n, "Neue Liste", "var(--list-inbox)", []);
      lists.push(newList);
      state.view = "list"; state.currentListId = newList.id; state.panelStack = [];
      renderAll();
      return;
    }

    el = e.target.closest("[data-add-list-to]");
    if (el) {
      var toGroup = el.getAttribute("data-add-list-to");
      var addedList = makeList("list" + Date.now(), "Neue Liste", "var(--list-inbox)", []);
      addedList.groupId = toGroup;
      lists.push(addedList);
      // Eine eingeklappte Gruppe aufklappen, sonst landet die neue Liste
      // unsichtbar darin.
      state.collapsedGroups[toGroup] = false;
      state.view = "list"; state.currentListId = addedList.id; state.panelStack = [];
      renderAll();
      return;
    }

    el = e.target.closest("#newGroupBtn");
    if (el) {
      var gn = groups.length + 1;
      groups.push({ id: "grp" + Date.now(), name: "Neue Gruppe " + gn });
      renderSidebar();
      return;
    }

    el = e.target.closest("[data-toggle-group]");
    if (el) {
      var gid = el.getAttribute("data-toggle-group");
      state.collapsedGroups[gid] = !state.collapsedGroups[gid];
      renderSidebar();
      return;
    }

    el = e.target.closest("[data-delete-list]");
    if (el) {
      var delListId = el.getAttribute("data-delete-list");
      var wrap = el.closest(".nav-item-wrap");
      animateRemove(wrap, function () {
        var idx = lists.findIndex(function (l) { return l.id === delListId; });
        if (idx >= 0) lists.splice(idx, 1);
        closePanelsFrom(delListId);
        if (state.currentListId === delListId) {
          // Zurueck in den Eingang - den gibt es immer (spec.md 2.0).
          state.currentListId = INBOX_ID;
          state.view = "list";
          state.panelStack = [];
        }
        renderAll();
      });
      return;
    }

    el = e.target.closest("[data-delete-group]");
    if (el) {
      var delGroupId = el.getAttribute("data-delete-group");
      var groupRow = el.closest(".group-row");
      var drin = lists.filter(function (l) { return l.groupId === delGroupId; });
      var gObj = findGroup(delGroupId);

      // Eine geloeschte Gruppe nimmt ihre Listen mit (spec.md 4.3). Diese
      // Rueckfrage ist zwingend, SOLANGE ES KEINEN PAPIERKORB GIBT - bis
      // dahin waere es unwiderruflicher Datenverlust mit einem Klick.
      // Sie entfaellt, sobald sich Geloeschtes zurueckholen laesst.
      if (drin.length > 0) {

  // Standardmaessig verschmilzt Backspace am Zeilenanfang die Zeile mit dem

  // editierbar ist, loescht der Browser ihn stattdessen komplett. Eine
  // Aufgabe darf aber niemals nebenbei verschwinden, nur weil jemand eine
  // Leerzeile darunter wegnimmt. Loeschen laeuft ausschliesslich ueber den
  // dafuer vorgesehenen Knopf.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Backspace" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!e.target.closest) return;
    var editor = e.target.closest(".page-editor");
    if (!editor) return;
    var sel = window.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;   // Auswahl loeschen bleibt normal
    var range = sel.getRangeAt(0);
    if (!editor.contains(range.startContainer)) return;

    var host = range.startContainer;
    while (host && host.parentNode !== editor) host = host.parentNode;
    if (!host || isSolidBlock(host)) return;

    // Steht der Cursor wirklich ganz am Zeilenanfang?
    var probe = document.createRange();
    probe.selectNodeContents(host);
    probe.setEnd(range.startContainer, range.startOffset);
    if (probe.toString().length > 0) return;   // es steht noch Text davor

    var prev = host.previousSibling;
    if (!prev || !isSolidBlock(prev)) return;  // normaler Fall, Browser machen lassen

    e.preventDefault();

    // Naechste beschreibbare Zeile oberhalb des Blocks suchen - dorthin
    // wandert der Cursor.
    var target = prev.previousSibling;
    while (target && isSolidBlock(target)) target = target.previousSibling;

    if (!target) return;   // Block steht ganz oben: Zeile behalten, sonst
                           // gaebe es darueber keine Schreibposition mehr.

    // Die leere Zeile darf weg - der Block darueber niemals.
    if (host.textContent === "") host.remove();

    var r = document.createRange();
    r.selectNodeContents(target);
    r.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r);
  });

  // Enter is handled here rather than left to the browser: Chrome's default
  // splits the current block by wrapping everything that follows into the
  // new <div> it creates, which pulled the tasks below the caret inside a
  // paragraph and destroyed the block structure.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!e.target.closest) return;
    var editor = e.target.closest(".page-editor");
    if (!editor) return;
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (!editor.contains(range.startContainer)) return;
    e.preventDefault();

    var host = range.startContainer;
    while (host && host.parentNode !== editor) host = host.parentNode;
    if (!host) return;

    var line = makeLineNode("");
    if (isEmbed(host)) {
      // Caret sat on an embed: just open a fresh paragraph after it.
      editor.insertBefore(line, host.nextSibling);
    } else {
      // Move whatever follows the caret in this paragraph onto the new one.
      var tail = range.cloneRange();
      tail.setEnd(host, host.childNodes.length);
      var moved = tail.extractContents();
      line.innerHTML = "";
      line.appendChild(moved);

      // ergaebe eine doppelt hohe Zeile.
      if (line.textContent === "" && !line.querySelector("br")) line.appendChild(document.createElement("br"));
      if (host.textContent === "" && !host.querySelector("br")) host.appendChild(document.createElement("br"));
      editor.insertBefore(line, host.nextSibling);

    r.selectNodeContents(line);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  });

  document.addEventListener("keydown", function (e) {

      if (!val) return;
      var colIndex = parseInt(e.target.getAttribute("data-quick-add"), 10);
      var owner = ownerAt(colIndex);
      if (!owner) return;
      var t = task(val);
      childrenOf(owner).push(t);
      owner.blocks.push({ type: "task", id: t.id });
      if (owner.subtasks) { owner.done = false; recomputeAncestors(owner.id); }
      e.target.value = "";
      renderAll();
      var again = document.querySelector('[data-quick-add="' + colIndex + '"]');
      if (again) again.focus();

    // Aufgabe gleich hinein, Escape nimmt das Feld zurueck.
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-tidy-neu-feld")) {

    // nichts zu verlieren. Steht vor der Spaltenregel, weil im Durchgang
    // ohnehin keine Spalte offen ist.
    if (e.key === "Escape" && state.tidy) {
      if (state.tidy.kalender) { state.tidy.kalender = false; renderColumns(); }
      else tidyBeenden();
      return;
    }

  function moveList(draggedId, targetId, position) {

    lists.splice(draggedIdx, 1);

    if (targetIdx < 0) { lists.push(draggedList); return; }

  // mobile view), and its drag image cannot be styled. Pointer events give

        // oberes/unteres Drittel = daneben.
        //
        // "Hinein" gilt fuer jede sichtbare Aufgabenzeile, auch in einer
        // anderen Spalte - sonst waere eine Aufgabe, die auf der eigenen
        // Seite nicht steht, gar nicht erreichbar. "Daneben" gibt es dagegen
        // nur dort, wo ueberhaupt sortiert wird: auf der eigenen Seite. In
        // einer fremden Spalte zaehlt deshalb die GANZE Zeile als "hinein" -
        // ein Drittel, das nichts tut, saehe aus wie ein Fehler.
        if (marker.indexOf("task:") === 0) {
          var uz = document.elementFromPoint(x, y);
          var zeile = uz && uz.closest && uz.closest('.inline-embed[data-embed-marker^="task:"]');
          if (zeile && zeile !== el) {
            var zielId = zeile.getAttribute("data-embed-marker").slice(5);
            var eigeneSeite = zeile.closest(".page-editor") === container;
            var zr = zeile.getBoundingClientRect();
            var drittel = zr.height / 3;
            var hinein = !eigeneSeite || (y >= zr.top + drittel && y < zr.bottom - drittel);
            if (hinein) {
              // In den eigenen Unterbau wird NICHTS angeboten - keine
              // Markierung, kein Aufschlag. Loslassen tut dann nichts und
              // die Zeile springt zurueck.
              if (!darfHineinZiehen(marker.slice(5), zielId)) return null;
              return { target: zeile, pos: "into", inAufgabe: zielId };
            }
            if (eigeneSeite) {
              return { target: zeile, pos: y < zr.top + drittel ? "before" : "after" };
            }
            return null;
          }
        }

        var all = container.childNodes;
        var others = [];
        for (var i = 0; i < all.length; i++) {
          if (all[i] !== el && all[i].nodeType === 1 && all[i].getBoundingClientRect) others.push(all[i]);
        }
        if (!others.length) return null;
        for (var j = 0; j < others.length; j++) {
          var r = others[j].getBoundingClientRect();
          if (y < r.top + r.height / 2) return { target: others[j], pos: "before" };
        }
        return { target: others[others.length - 1], pos: "after" };
      },
      commit: function (el, spot) {
        if (spot.nachListe) {
          var eigner = el.closest(".page-editor").getAttribute("data-editor-for");
          var aufgabenId = (el.getAttribute("data-embed-marker") || "").slice(5);
          if (moveTaskToList(aufgabenId, eigner, spot.nachListe)) renderAll();
          return;
        }
        if (spot.inAufgabe) {
          var eignerSeite = el.closest(".page-editor").getAttribute("data-editor-for");
          var quellId = (el.getAttribute("data-embed-marker") || "").slice(5);
          if (moveTaskIntoTask(quellId, eignerSeite, spot.inAufgabe)) renderAll();
          return;
        }
        var editor = spot.target.closest(".page-editor");
        var ownerId = editor.getAttribute("data-editor-for");
        if (spot.pos === "before") { spot.target.parentNode.insertBefore(el, spot.target); }
        else { spot.target.parentNode.insertBefore(el, spot.target.nextSibling); }
        normalizeEditor(editor);
        serializeEditor(ownerId);
        renderAll();
      }
    }
  ];

  // Pressing these must never start a drag - they are their own controls.
  // Text fields are deliberately NOT in this list: a group row is mostly
  // taken up by its name field, so excluding it would leave almost nothing
  // to grab the group by. Instead a press on a field that is already focused
  // is left alone, so selecting and editing text still works normally.
  var SORT_PRESS_EXCLUDE = ".group-chevron, .nav-delete, .row-delete, .check-btn, .row-due-cal, .row-due-pill";

  // Zeigt waehrend der Geste, WAS gezogen wird, und folgt dem Zeiger.
  // Ohne dieses Etikett gibt es zwischen Editor und Sidebar - quer durchs
  // Fenster - keinerlei Rueckmeldung, und die Geste wirkt wirkungslos.
  var dragLabelEl = null;

  function showDragLabel(text, x, y) {
    if (!dragLabelEl) {
      dragLabelEl = document.createElement("div");
      dragLabelEl.className = "drag-label";
      document.body.appendChild(dragLabelEl);
    }
    dragLabelEl.innerHTML = svgGrip() + "<span>" + escapeHtml(text) + "</span>";
    moveDragLabel(x, y);
  }

  function moveDragLabel(x, y) {
    // Versetzt neben dem Zeiger, damit das Etikett nicht verdeckt, worauf
    // man zielt. Nur transform - kein Layout pro Bild.
    if (dragLabelEl) dragLabelEl.style.transform = "translate3d(" + (x + 14) + "px," + (y + 14) + "px,0)";
  }

  function hideDragLabel() {
    if (dragLabelEl && dragLabelEl.parentNode) dragLabelEl.parentNode.removeChild(dragLabelEl);
    dragLabelEl = null;
  }

  function clearSortIndicator() {
    if (sortDrag && sortDrag.spot) {
      sortDrag.spot.target.classList.remove("drop-before", "drop-after", "drop-into");
    }
  }

  function endSortDrag() {
    if (!sortDrag) return;
    clearSortIndicator();
    hideDragLabel();
    document.body.classList.remove("is-dragging");
    if (sidebarEl) sidebarEl.classList.remove("drop-armed");
    sortDrag.el.classList.remove("drag-ghost");
    if (sortDrag.container) sortDrag.container.classList.remove("is-sorting");
    if (sortDrag.captureEl && sortDrag.captureEl.releasePointerCapture) {
      try { sortDrag.captureEl.releasePointerCapture(sortDrag.pointerId); } catch (err) { /* already gone */ }
    }
    sortDrag = null;
  }

  document.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || sortDrag) return;
    if (!e.target.closest) return;
    if (e.target.closest(SORT_PRESS_EXCLUDE)) return;
    // Already editing this field? Then the press belongs to the text, not
    // to a drag.
    if (e.target === document.activeElement && e.target.closest("input, textarea")) return;

    for (var i = 0; i < SORT_CONFIGS.length; i++) {
      var cfg = SORT_CONFIGS[i];
      var pressEl = e.target;
      if (cfg.requiresGrip) {
        pressEl = e.target.closest(cfg.requiresGrip);
        if (!pressEl) continue;
      }
      var el = cfg.itemFrom(pressEl);
      if (!el) continue;
      var container = cfg.containerFrom(el);
      if (!container) continue;

      var captureEl = cfg.requiresGrip ? pressEl : el;
      sortDrag = {
        cfg: cfg, el: el, container: container, captureEl: captureEl,
        pointerId: e.pointerId, startY: e.clientY, active: false, spot: null
      };
      // Only suppress the browser's default for grip drags. On the sidebar
      // the press may still turn out to be a plain click, and preventing
      // the default here would break focus/click behaviour.
      if (cfg.requiresGrip) e.preventDefault();
      if (captureEl.setPointerCapture) {
        try { captureEl.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
      }
      return;
    }
  });

  document.addEventListener("pointermove", function (e) {
    if (!sortDrag || e.pointerId !== sortDrag.pointerId) return;
    if (!sortDrag.active) {
      if (Math.abs(e.clientY - sortDrag.startY) < 4) return; // still just a click
      sortDrag.active = true;
      // The press may have focused a text field inside the row (a group's
      // name). Once it turns into a drag, drop that focus so the gesture
      // doesn't smear a text selection across the field.
      if (document.activeElement && sortDrag.el.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      var sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
      sortDrag.el.classList.add("drag-ghost");
      sortDrag.container.classList.add("is-sorting");
      document.body.classList.add("is-dragging");
      showDragLabel(sortDrag.cfg.label ? sortDrag.cfg.label(sortDrag.el) : "", e.clientX, e.clientY);
      // Wird eine Aufgabe gezogen, zeigen die Listen in der Sidebar, dass
      // sie Ziele sind - sonst muss man raten, ob die Geste dort wirkt.
      if (sortDrag.cfg.armsSidebar && sortDrag.cfg.armsSidebar(sortDrag.el) && sidebarEl) {
        sidebarEl.classList.add("drop-armed");
      }
    }
    e.preventDefault();
    moveDragLabel(e.clientX, e.clientY);
    clearSortIndicator();
    var spot = sortDrag.cfg.resolveSpot(sortDrag.container, e.clientX, e.clientY, sortDrag.el);
    sortDrag.spot = spot;
    if (spot) {
      spot.target.classList.add(spot.pos === "into" ? "drop-into" : "drop-" + spot.pos);
    }
  });

  // A drag that ends over a clickable row would otherwise also fire a click
  // (e.g. navigating to the list you just moved). Swallow that one click.
  // Registered per drop and torn down on the next event-loop turn, so it can
  // never linger and eat an unrelated click later on - a stale suppressor
  // looks exactly like an app that has stopped responding.
  function swallowNextClick() {
    function onClick(ev) { ev.stopPropagation(); ev.preventDefault(); }
    document.addEventListener("click", onClick, true);
    setTimeout(function () { document.removeEventListener("click", onClick, true); }, 0);
  }

  document.addEventListener("pointerup", function (e) {
    if (!sortDrag || e.pointerId !== sortDrag.pointerId) return;
    var cfg = sortDrag.cfg, el = sortDrag.el, spot = sortDrag.spot, wasActive = sortDrag.active;
    endSortDrag();
    if (wasActive) {
      swallowNextClick();
      if (spot && spot.target !== el) cfg.commit(el, spot);
    }
  });

  document.addEventListener("pointercancel", function (e) {
    if (sortDrag && e.pointerId === sortDrag.pointerId) endSortDrag();
  });

  // Belt and braces: the browser must never start a drag of its own on a
  // sortable row or inside a page editor, whatever the gesture originates on.
  document.addEventListener("dragstart", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest(".page-editor") || e.target.closest("[data-drag-type]")) e.preventDefault();
  });

  document.addEventListener("click", function (e) {
    var themeChoice = e.target.closest("[data-set-theme]");
    if (themeChoice) {
      document.documentElement.setAttribute("data-theme", themeChoice.getAttribute("data-set-theme"));
      // Der Schalter wird an Ort und Stelle nachgezogen, nicht neu gebaut:
      // renderSidebar() wuerde den gleitenden Knopf als frisches Element
      // erzeugen, und CSS-Uebergaenge laufen darauf nicht - er wuerde
      // springen statt zu gleiten.
      syncThemeSegmented();
    }
  });

  // Dunkel ist der Standard (Festlegung des Nutzers, 2026-08-13). Bewusst
  // fest gesetzt und nicht der Systemeinstellung ueberlassen: Das Mockup
  // soll bei jedem gleich aussehen, sonst beurteilen zwei Leute
  // verschiedene Bilder. Die Rueckfallebene fuer "System dunkel" bleibt
  // trotzdem gepflegt - sie greift, sobald das Attribut fehlt.
  // ====================================================================
  // Datenschicht des Prototyps
  // ====================================================================
  //
  // Zweck: Das Mockup soll im Alltag benutzbar sein, damit echte Fehler und
  // Verbesserungen auffallen (Entscheidung 2026-08-13). Ohne Speichern ist
  // es das nicht - jedes Neuladen loescht alles.
  //
  // Die Regeln aus docs/conventions.md ("Die Datenschicht bauen") gelten
  // hier schon, obwohl das nur ein Prototyp ist. Der Grund: Die Daten
  // liegen NUR im Browser. Es gibt keinen Server, der sie im Zweifel noch
  // hat, und ein Fehler an dieser Stelle ist unwiederbringlich.
  //
  //   - offenes Format          -> JSON, lesbar, dokumentiert
  //   - Export                  -> jederzeit, als Datei
  //   - Schema-Version          -> steht in den Daten, mit Migrationspfad
  //   - atomares Schreiben      -> localStorage.setItem ist je Schluessel
  //                                atomar; zusaetzlich haelt SICHERUNG den
  //                                letzten guten Stand, falls ein Schreiben
  //                                unvollstaendige Daten hinterlaesst
  //
  // Bewusst NICHT gespeichert wird die reine Ansicht (offene Spalten,
  // Kalender, Aufraeum-Modus): Das ist kein Bestand, und ein halb offener
  // Aufraeum-Modus nach dem Neuladen waere verwirrend statt hilfreich.

  var SPEICHER_SCHLUESSEL = "unfold.daten";
  var SPEICHER_SICHERUNG = "unfold.daten.sicherung";
  var SPEICHER_HINWEIS = "unfold.hinweis-gesehen";
  var SCHEMA = 1;

  var speicherGesperrt = false;   // true, wenn der Browser nichts zulaesst
  var speicherFehler = null;

  function speicherVerfuegbar() {
    try {
      window.localStorage.setItem("unfold.probe", "1");
      window.localStorage.removeItem("unfold.probe");
      return true;
    } catch (e) {
      speicherFehler = e && e.name ? e.name : String(e);
      return false;
    }
  }

  // Was gespeichert wird. Bewusst flach und benannt, damit ein Export von
  // Hand lesbar ist und die spaetere Flutter-Datenschicht dieselbe Form
  // uebernehmen kann.
  function standErheben() {
    return {
      schema: SCHEMA,
      erzeugtVon: "unfold-mockup",
      gespeichertAm: new Date().toISOString(),
      naechsteId: uid,
      gruppen: groups,
      listen: lists,
      ansicht: {
        eingeklappteGruppen: state.collapsedGroups || {},
        darstellung: currentThemePref()
      }
    };
  }

  // Migrationen. Heute gibt es nur Schema 1 - der Pfad steht trotzdem
  // schon, weil er sonst genau dann fehlt, wenn er gebraucht wird.
  function migriere(daten) {
    if (!daten || typeof daten !== "object") return null;
    var v = daten.schema;
    if (typeof v !== "number") return null;
    if (v > SCHEMA) return { zuNeu: true };   // aus einer neueren Fassung
    // if (v === 1) { ... daten = nach2(daten); v = 2; }
    return daten;
  }

  // Nur so viel pruefen, dass kaputte Daten nicht den Bestand ersetzen.
  // Eine strengere Pruefung waere hier schaedlich: Sie wuerde bei einer
  // harmlosen Abweichung lieber alles verwerfen.
  function plausibel(daten) {
    return daten && Array.isArray(daten.listen) && Array.isArray(daten.gruppen) &&
           daten.listen.length > 0;
  }

  function speichernJetzt() {
    if (speicherGesperrt) return;
    try {
      var text = JSON.stringify(standErheben());
      // Erst den bisherigen guten Stand sichern, dann ueberschreiben. Bricht
      // das Schreiben mittendrin ab, ist die Sicherung noch vollstaendig.
      var alt = window.localStorage.getItem(SPEICHER_SCHLUESSEL);
      if (alt) window.localStorage.setItem(SPEICHER_SICHERUNG, alt);
      window.localStorage.setItem(SPEICHER_SCHLUESSEL, text);
    } catch (e) {
      speicherGesperrt = true;
      speicherFehler = e && e.name ? e.name : String(e);
      hinweisZeigen();
    }
  }

  var speicherUhr = null;
  function planeSpeichern() {
    if (speicherUhr) clearTimeout(speicherUhr);
    speicherUhr = setTimeout(function () { speicherUhr = null; speichernJetzt(); }, 400);
  }

  function uebernehmen(daten) {
    groups = daten.gruppen;
    lists = daten.listen;
    if (typeof daten.naechsteId === "number") uid = daten.naechsteId;
    if (daten.ansicht && daten.ansicht.eingeklappteGruppen) {
      state.collapsedGroups = daten.ansicht.eingeklappteGruppen;
    }
  }

  // Beim Start: gespeicherten Stand laden, sonst die Beispieldaten stehen
  // lassen. Was schiefgeht, wird gemeldet und nicht stillschweigend
  // verworfen - stille Datenverluste sind genau das, wovor conventions.md
  // warnt.
  var ladeMeldung = null;
  var ladeRohtext = null;   // der unlesbare Stand, damit er rettbar bleibt

  // WICHTIG - hier lag beim ersten Bauversuch der gefaehrlichste Fehler:
  // Konnte der gespeicherte Stand nicht gelesen werden, lief die App
  // trotzdem mit den Beispieldaten weiter UND speicherte munter weiter.
  // Der naechste Schreibvorgang (spaetestens beim Schliessen des Fensters)
  // hat den kaputten - aber vielleicht noch rettbaren - Stand ersatzlos
  // ueberschrieben. Genau der stille Datenverlust, vor dem
  // docs/conventions.md warnt.
  //
  // Deshalb gilt jetzt: Was nicht gelesen werden konnte, wird auch nicht
  // ueberschrieben. Die App laeuft, speichert aber nichts, bis der Nutzer
  // entschieden hat - er kann den kaputten Stand herunterladen oder neu
  // anfangen.
  function ladenBeimStart() {
    if (!speicherVerfuegbar()) {
      speicherGesperrt = true;
      ladeMeldung = "Dieser Browser laesst kein Speichern zu (" + speicherFehler +
                    "). Alles, was du eingibst, ist beim Neuladen weg.";
      return;
    }
    var roh = null;
    try { roh = window.localStorage.getItem(SPEICHER_SCHLUESSEL); } catch (e) {}
    if (!roh) return;                       // erster Start: Beispieldaten
    var daten = null;
    try { daten = JSON.parse(roh); } catch (e) {
      speicherGesperrt = true;
      ladeRohtext = roh;
      ladeMeldung = "Der gespeicherte Stand liess sich nicht lesen. Er wird " +
                    "NICHT ueberschrieben - es wird gerade gar nichts gespeichert.";
      return;
    }
    var m = migriere(daten);
    if (m && m.zuNeu) {
      speicherGesperrt = true;
      ladeRohtext = roh;
      ladeMeldung = "Der gespeicherte Stand stammt aus einer neueren Fassung " +
                    "(Schema " + daten.schema + "). Er wird nicht angetastet.";
      return;
    }
    if (!plausibel(m)) {
      speicherGesperrt = true;
      ladeRohtext = roh;
      ladeMeldung = "Der gespeicherte Stand sah unvollstaendig aus. Er wird " +
                    "NICHT ueberschrieben - es wird gerade gar nichts gespeichert.";
      return;
    }
    uebernehmen(m);
  }

  // --- Export ---------------------------------------------------------
  //
  // Zwei Wege, je nachdem wo die Seite laeuft: In der Artifact-Ansicht ist
  // ein gewoehnlicher <a download> wirkungslos, dort gibt es dafuer
  // window.claude.downloads. Bei einer lokalen Datei ist es umgekehrt.
  // Deshalb zur Laufzeit entscheiden statt eine Umgebung anzunehmen.
  function dateiname() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return "unfold-" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + ".json";
  }

  function exportieren() {
    var text = JSON.stringify(standErheben(), null, 2);
    var name = dateiname();
    if (window.claude && window.claude.downloads && window.claude.downloads.save) {
      window.claude.downloads.save({ filename: name, data: text })
        .catch(function (e) { fallbackDownload(name, text, e); });
      return;
    }
    fallbackDownload(name, text, null);
  }

  function fallbackDownload(name, text, vorherigerFehler) {
    try {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) {
      window.prompt("Der Download geht hier nicht" +
        (vorherigerFehler ? "" : "") + ". Text kopieren (Strg+C):", text);
    }
  }

  // --- Import ---------------------------------------------------------
  function importieren(datei) {
    var leser = new FileReader();
    leser.onload = function () {
      var daten = null;
      try { daten = JSON.parse(String(leser.result)); }
      catch (e) { window.alert("Das ist keine lesbare Unfold-Datei."); return; }
      var m = migriere(daten);
      if (m && m.zuNeu) { window.alert("Diese Datei stammt aus einer neueren Fassung."); return; }
      if (!plausibel(m)) { window.alert("In der Datei stehen keine brauchbaren Listen."); return; }
      var anzahl = m.listen.length;
      if (!window.confirm("Import ersetzt deinen jetzigen Stand durch " + anzahl +
                          " Liste(n) aus der Datei.\n\nVorher exportieren, wenn du " +
                          "den jetzigen Stand behalten willst.\n\nFortfahren?")) return;
      uebernehmen(m);
      state.panelStack = [];
      state.currentListId = lists[0] ? lists[0].id : INBOX_ID;
      speichernJetzt();
      renderAll();
    };
    leser.readAsText(datei);
  }

  // --- Prototyp-Leiste -------------------------------------------------
  //
  // Bewusst NICHT in die Sidebar oder die untere Leiste eingebaut: Deren
  // Gestaltung ist entschieden (docs/status.md, Abschnitt 3 - der Neuentwurf
  // des unteren Bereichs wurde abgelehnt). Export und Import sind Geruest
  // fuer den Prototyp, kein Teil des Entwurfs. Sie stehen deshalb sichtbar
  // abgesetzt, damit die spaetere Flutter-App diese Warze nicht erbt.
  function hinweisZeigen() {
    var alt = document.getElementById("protoLeiste");
    if (alt) alt.parentNode.removeChild(alt);
    var box = document.createElement("div");
    box.id = "protoLeiste";
    var warnung = speicherGesperrt || ladeMeldung;
    box.innerHTML =
      '<div class="proto-text">' +
        '<strong>Prototyp.</strong> ' +
        (ladeMeldung ? '<span class="proto-warn">' + ladeMeldung + '</span> ' :
          'Daten liegen nur in diesem Browser. <strong>Regelmaessig exportieren.</strong>') +
      '</div>' +
      '<div class="proto-knoepfe">' +
        (ladeRohtext ? '<button type="button" id="protoRetten">Kaputten Stand sichern</button>' +
                       '<button type="button" id="protoNeu">Neu anfangen</button>' : '') +
        '<button type="button" id="protoExport">Exportieren</button>' +
        '<button type="button" id="protoImport">Importieren</button>' +
        '<input type="file" id="protoDatei" accept="application/json,.json" hidden>' +
        (ladeRohtext ? '' : '<button type="button" id="protoZu" title="Ausblenden">&times;</button>') +
      '</div>';
    if (warnung) box.className = "warnt";
    document.body.appendChild(box);
    document.getElementById("protoExport").addEventListener("click", exportieren);

    // Rettungsweg aus einem unlesbaren Stand. Ohne ihn bliebe dem Nutzer nur,
    // die Browserdaten zu loeschen - also genau das zu tun, was er vermeiden
    // wollte.
    if (ladeRohtext) {
      document.getElementById("protoRetten").addEventListener("click", function () {
        fallbackDownload("unfold-kaputter-stand.txt", ladeRohtext, null);
      });
      document.getElementById("protoNeu").addEventListener("click", function () {
        if (!window.confirm("Der unlesbare Stand wird endgueltig ueberschrieben.\n\n" +
                            "Vorher «sichern» anklicken, wenn du ihn behalten willst.\n\nWirklich neu anfangen?")) return;
        try {
          window.localStorage.removeItem(SPEICHER_SCHLUESSEL);
          window.localStorage.removeItem(SPEICHER_SICHERUNG);
        } catch (e) {}
        location.reload();
      });
    }
    document.getElementById("protoImport").addEventListener("click", function () {
      document.getElementById("protoDatei").click();
    });
    document.getElementById("protoDatei").addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) importieren(e.target.files[0]);
      e.target.value = "";
    });
    // Bei einem kaputten Stand gibt es bewusst KEIN Ausblenden - die Warnung
    // soll stehen bleiben, bis der Nutzer entschieden hat. Der Knopf fehlt
    // dann im HTML, also darf hier nicht blind darauf zugegriffen werden.
    var zuKnopf = document.getElementById("protoZu");
    if (zuKnopf) {
      zuKnopf.addEventListener("click", function () {
        box.parentNode.removeChild(box);
        try { window.localStorage.setItem(SPEICHER_HINWEIS, "1"); } catch (e) {}
      });
    }
  }

  // --- Verdrahtung -----------------------------------------------------
  ladenBeimStart();

  // Gespeicherte Darstellung gewinnt, sonst bleibt Dunkel der Standard
  // (Festlegung 2026-08-13). Eine EIGENE Wahl des Nutzers zu behalten
  // widerspricht dem nicht - der Standard gilt beim ersten Start.
  (function () {
    var gespeichert = null;
    try {
      var roh = window.localStorage.getItem(SPEICHER_SCHLUESSEL);
      if (roh) { var d = JSON.parse(roh); gespeichert = d && d.ansicht && d.ansicht.darstellung; }
    } catch (e) {}
    document.documentElement.setAttribute("data-theme",
      gespeichert === "light" ? "light" : "dark");
  })();

  // Nach jeder sichtbaren Aenderung sichern. Die drei Render-Funktionen
  // decken alles ab, was Daten veraendert; Tippen im Editor aendert Text
  // ohne Neuaufbau, deshalb zusaetzlich auf "input" horchen.
  (function () {
    var origSidebar = renderSidebar, origColumns = renderColumns;
    renderSidebar = function () { origSidebar.apply(null, arguments); planeSpeichern(); };
    renderColumns = function () { origColumns.apply(null, arguments); planeSpeichern(); };
    document.addEventListener("input", planeSpeichern, true);
    document.addEventListener("click", function (e) {
      if (e.target.closest && e.target.closest("[data-set-theme]")) planeSpeichern();
    }, true);
    // Beim Verlassen nicht auf den Zeitgeber warten.
    window.addEventListener("beforeunload", speichernJetzt);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") speichernJetzt();
    });
  })();

  renderAll();

  var hinweisGesehen = false;
  try { hinweisGesehen = window.localStorage.getItem(SPEICHER_HINWEIS) === "1"; } catch (e) {}
  if (!hinweisGesehen || speicherGesperrt || ladeMeldung) hinweisZeigen();
})();
</script>
