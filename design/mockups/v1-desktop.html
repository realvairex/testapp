      html += "</div></div></div>";
    } else {
      var list = findList(state.currentListId);
      var c = countAll(list.tasks);
      html += '<div class="column" data-col-index="0" data-col-key="list:' + list.id + '"><div class="col-inner">';
      html += '<div class="col-header"><div class="col-header-top"><h2 class="col-title">' + escapeHtml(list.name) + '</h2></div>';
      html += '<div class="col-meta">' + (c.total - c.done) + " offen · " + c.done + " von " + c.total + " erledigt</div></div>";
      html += '<div class="blocks"><div data-editor-slot="' + list.id + '" data-editor-col="0"></div></div>';
      html += '<div class="editor-toolbar"><button class="insert-btn" data-insert-image-at="0">' + svgPlus() + " Bild</button></div>";
      html += '<div class="quick-add"><span style="display:flex">' + svgPlus() + '</span><input type="text" placeholder="Aufgabe hinzufügen …" data-quick-add="0" autocomplete="off" /></div>';
      html += "</div></div>";
    }

    // panel columns
    for (var p = 0; p < state.panelStack.length; p++) {
      var colIndex = p + 1;
      var node = findTaskGlobal(state.panelStack[p]);
      if (!node) continue;
      html += '<div class="column" data-col-index="' + colIndex + '" data-col-key="task:' + node.id + '"><div class="col-inner">';
      html += '<div class="col-header"><div class="col-header-top">';
      html += '<input class="col-title' + (node.done ? " done" : "") + '" value="' + escapeHtml(node.title) + '" data-title-for="' + node.id + '" />';
      html += '<button class="col-close" data-close-col="' + colIndex + '" aria-label="Seite schließen">' + svgClose() + "</button>";
      html += "</div>";
      html += '<div class="col-progress-row">' + dueControl(node) + "</div>";
      html += "</div>";
      html += '<div class="blocks"><div data-editor-slot="' + node.id + '" data-editor-col="' + colIndex + '"></div></div>';
      html += '<div class="editor-toolbar"><button class="insert-btn" data-insert-image-at="' + colIndex + '">' + svgPlus() + " Bild</button></div>";
      html += '<div class="quick-add"><span style="display:flex">' + svgPlus() + '</span><input type="text" placeholder="Unteraufgabe hinzufügen …" data-quick-add="' + colIndex + '" autocomplete="off" /></div>';
      html += "</div></div>";
    }

    el.innerHTML = html;
    mountEditors();
    sizeColumns();
    el.scrollLeft = Math.max(0, el.scrollWidth - contentAreaWidth());
    animateColumnChange(el, beforeRects, newlyOpened);
    prevPanelStack = state.panelStack.slice();
  }

  // Pure-transform FLIP animator: every entry gets an inverse "from" transform
  // applied instantly (no transition), then a forced reflow, then animates to
  // "to" on the next frame. Only `transform` ever animates - layout (flex-basis,
  // scrollLeft) is always committed to its final value up front, so there is
  // no per-frame reflow during the animation itself, only compositing.
  function runFlip(el, plan, callback) {
    if (!plan.length) { if (callback) callback(); return; }
    el.classList.add("anim-lock");
    for (var i = 0; i < plan.length; i++) {
      plan[i].column.style.transform = plan[i].fromCol;
      if (plan[i].colInner) plan[i].colInner.style.transform = plan[i].fromInner || "";
    }
    void el.offsetWidth;
    requestAnimationFrame(function () {
      for (var j = 0; j < plan.length; j++) {
        var item = plan[j];
        item.column.classList.add("col-animating");
        if (item.colInner) item.colInner.classList.add("col-animating");
        item.column.style.transform = item.toCol;
        if (item.colInner) item.colInner.style.transform = item.toInner || "";
      }
      setTimeout(function () {
        for (var k = 0; k < plan.length; k++) {
          plan[k].column.classList.remove("col-animating");
          plan[k].column.style.transform = "";
          plan[k].column.style.pointerEvents = "";
          if (plan[k].colInner) { plan[k].colInner.classList.remove("col-animating"); plan[k].colInner.style.transform = ""; }
        }
        el.classList.remove("anim-lock");
        if (callback) callback();
      }, 460);
    });
  }

  function animateColumnChange(el, beforeRects, newlyOpened) {
    var appRight = document.getElementById("appWindow").getBoundingClientRect().right;
    var newKeys = newlyOpened.map(function (id) { return "task:" + id; });
    var cols = el.querySelectorAll(".column[data-col-key]");
    var plan = [];

    for (var i = 0; i < cols.length; i++) {
      var colEl = cols[i];
      var key = colEl.getAttribute("data-col-key");
      var rect = colEl.getBoundingClientRect();

      if (newKeys.indexOf(key) !== -1) {
        var startOffset = appRight - rect.left;
        plan.push({ column: colEl, colInner: null, fromCol: "translateX(" + startOffset + "px)", toCol: "translateX(0)" });
      } else if (beforeRects[key]) {
        var old = beforeRects[key];
        var deltaX = old.left - rect.left;
        var scaleRatio = old.width / rect.width;
        if (Math.abs(deltaX) > 0.5 || Math.abs(scaleRatio - 1) > 0.01) {
          plan.push({
            column: colEl,
            colInner: colEl.querySelector(".col-inner"),
            fromCol: "translateX(" + deltaX + "px) scaleX(" + scaleRatio + ")",
            toCol: "translateX(0) scaleX(1)",
            fromInner: "scaleX(" + (1 / scaleRatio) + ")",
            toInner: "scaleX(1)"
          });
        }
      }
    }

    runFlip(el, plan);
  }

  function animatePanelsClosing(fromColIndex, afterClose) {
    var el = document.getElementById("contentArea");
    var appRight = document.getElementById("appWindow").getBoundingClientRect().right;
    var cols = el.querySelectorAll(".column[data-col-key]");
    var closingEls = [], survivingEls = [];
    for (var i = 0; i < cols.length; i++) {
      var idx = parseInt(cols[i].getAttribute("data-col-index"), 10);
      if (idx >= fromColIndex) { closingEls.push(cols[i]); } else { survivingEls.push(cols[i]); }
    }
    if (!closingEls.length) { afterClose(); return; }

    var oldRects = {};
    for (var a = 0; a < cols.length; a++) {
      var r = cols[a].getBoundingClientRect();
      oldRects[cols[a].getAttribute("data-col-key")] = { left: r.left, width: r.width };
    }

    var survivingCount = survivingEls.length || 1;
    var contentWidth = contentAreaWidth();
    var newSurvivorWidth = Math.max(240, contentWidth / Math.min(survivingCount, 3));

    // Commit the final layout instantly (temporary - afterClose() rebuilds
    // the real DOM from state shortly), then FLIP-compensate every column
    // back to how it looked a moment ago and animate to identity/exit.
    for (var s = 0; s < survivingEls.length; s++) { survivingEls[s].style.flex = "0 0 " + newSurvivorWidth + "px"; }
    var newScrollWidth = survivingCount * newSurvivorWidth;
    el.scrollLeft = Math.max(0, newScrollWidth - contentWidth);

    var plan = [];
    for (var s2 = 0; s2 < survivingEls.length; s2++) {
      var sEl = survivingEls[s2];
      var oldS = oldRects[sEl.getAttribute("data-col-key")];
      var rectS = sEl.getBoundingClientRect();
      var deltaXs = oldS.left - rectS.left;
      var scaleRatioS = oldS.width / rectS.width;
      if (Math.abs(deltaXs) > 0.5 || Math.abs(scaleRatioS - 1) > 0.01) {
        plan.push({
          column: sEl,
          colInner: sEl.querySelector(".col-inner"),
          fromCol: "translateX(" + deltaXs + "px) scaleX(" + scaleRatioS + ")",
          toCol: "translateX(0) scaleX(1)",
          fromInner: "scaleX(" + (1 / scaleRatioS) + ")",
          toInner: "scaleX(1)"
        });
      }
    }
    for (var c = 0; c < closingEls.length; c++) {
      var cEl = closingEls[c];
      var oldC = oldRects[cEl.getAttribute("data-col-key")];
      var rectC = cEl.getBoundingClientRect();
      var deltaXc = oldC.left - rectC.left;
      var exitOffset = appRight - rectC.left;
      cEl.style.pointerEvents = "none";
      plan.push({ column: cEl, colInner: null, fromCol: "translateX(" + deltaXc + "px)", toCol: "translateX(" + exitOffset + "px)" });
    }

    runFlip(el, plan, afterClose);
  }

  // The content-area's true final width, independent of how far the
  // sidebar-track's CSS transition has progressed at the moment this is
  // called (its `clientWidth` is ambiguous mid-transition). Callers must
  // toggle `.sidebar-collapsed` to its FINAL target state first.
  function contentAreaWidth() {
    var appWindow = document.getElementById("appWindow");
    var full = appWindow.clientWidth; // excludes the 1px border on each side
    return appWindow.classList.contains("sidebar-collapsed") ? full : full - 248;
  }

  function sizeColumns() {
    var el = document.getElementById("contentArea");
    var cols = el.querySelectorAll(".column");
    if (!cols.length) return;
    var available = contentAreaWidth();
    var perColumn = Math.max(240, available / Math.min(cols.length, 3));
    for (var i = 0; i < cols.length; i++) {
      cols[i].style.flex = "0 0 " + perColumn + "px";
    }
  }

  function renderSidebar() {
    var el = document.getElementById("sidebar");
    var html = "";
    html += '<div class="brand"><span class="brand-mark">' + svgPlus() + '</span><span class="brand-name">Unfold</span></div>';
    html += '<div class="nav-label">Übersicht</div>';
    html += navItem({ kind: "today", active: state.view === "today", label: "Heute", count: collectToday().length, icon: true });
    html += '<div class="nav-label">Listen</div>';

    var ungrouped = lists.filter(function (l) { return !l.groupId; });
    for (var i = 0; i < ungrouped.length; i++) { html += listNavItem(ungrouped[i]); }

    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      var collapsed = !!state.collapsedGroups[g.id];
      var groupLists = lists.filter(function (l) { return l.groupId === g.id; });
      html += groupHeader(g, collapsed, groupLists.length);
      if (!collapsed) { for (var k = 0; k < groupLists.length; k++) { html += listNavItem(groupLists[k], true); } }
    }

    html += '<div class="sidebar-spacer"></div>';

    var pref = currentThemePref();
    html += '<div class="options-wrap">';
    html += '<button class="nav-item" id="optionsBtn" type="button"><svg class="nav-icon" viewBox="0 0 15 15" fill="none">' + svgGearPath() + '</svg><span class="nav-name">Optionen</span></button>';
    html += '<div class="options-panel" id="optionsPanel"' + (state.optionsOpen ? "" : " hidden") + '>';
    html += '<div class="options-title">Darstellung</div>';
    html += '<div class="theme-segmented">';
    html += '<button class="theme-seg-btn' + (pref === "light" ? " active" : "") + '" data-set-theme="light">Hell</button>';
    html += '<button class="theme-seg-btn' + (pref === "dark" ? " active" : "") + '" data-set-theme="dark">Dunkel</button>';
    html += '<button class="theme-seg-btn' + (pref === "system" ? " active" : "") + '" data-set-theme="system">System</button>';
    html += "</div></div></div>";

    html += '<div class="sidebar-bottom-actions">';
    html += '<button class="icon-action-btn primary" id="newListBtn" type="button" title="Neue Liste" aria-label="Neue Liste">' + svgPlus() + "</button>";
    html += '<button class="icon-action-btn" id="newGroupBtn" type="button" title="Neue Gruppe" aria-label="Neue Gruppe">' + svgFolderPlus() + "</button>";
    html += "</div>";
    el.innerHTML = html;
  }

  function currentThemePref() {
    var attr = document.documentElement.getAttribute("data-theme");
    return attr === "dark" ? "dark" : attr === "light" ? "light" : "system";
  }

  function listNavItem(l, indented) {
    var c = countAll(l.tasks);
    var active = state.view === "list" && state.currentListId === l.id;
    return '<div class="nav-item-wrap">' +
      '<button class="nav-item' + (active ? " active" : "") + (indented ? " nav-item-indented" : "") + '" data-nav="list" data-list="' + l.id + '" data-drag-type="list" data-drag-id="' + l.id + '" type="button"><span class="nav-dot" style="background:' + l.color + '"></span><span class="nav-name">' + escapeHtml(l.name) + '</span><span class="nav-count">' + (c.total - c.done) + "</span></button>" +
      '<button class="nav-delete" data-delete-list="' + l.id + '" aria-label="Liste löschen" title="Liste löschen">' + svgTrash() + "</button>" +
      "</div>";
  }

  function groupHeader(g, collapsed, count) {
    return '<div class="group-row" data-drag-type="group" data-drag-id="' + g.id + '">' +
      '<button class="group-chevron' + (collapsed ? " collapsed" : "") + '" data-toggle-group="' + g.id + '" aria-label="Gruppe ein-/ausklappen">' + svgChevronDown() + "</button>" +
      '<input class="group-title" value="' + escapeHtml(g.name) + '" data-group-title-for="' + g.id + '" />' +
      '<span class="nav-count">' + count + "</span>" +
      '<button class="nav-delete" data-delete-group="' + g.id + '" aria-label="Gruppe löschen" title="Gruppe löschen">' + svgTrash() + "</button>" +
      "</div>";
  }

  function navItem(opts) {
    var attrs = 'data-nav="today"';
    var iconOrDot = '<svg class="nav-icon" viewBox="0 0 15 15" fill="none"><path d="M7.5 1.2l1.7 3.7 4 .5-3 2.8.8 4-3.5-2-3.5 2 .8-4-3-2.8 4-.5z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>';
    return '<button class="nav-item' + (opts.active ? " active" : "") + '" ' + attrs + ' type="button">' + iconOrDot + '<span class="nav-name">' + escapeHtml(opts.label) + '</span><span class="nav-count">' + opts.count + "</span></button>";
  }

  function renderAll() {
    renderSidebar();
    document.getElementById("appWindow").classList.toggle("sidebar-collapsed", state.panelStack.length >= 2);
    renderColumns();
  }

  // Closing a panel never changes any task/list data - it's a pure view
  // action. renderAll()/renderColumns() rebuild every visible column's
  // innerHTML from scratch (incl. the contenteditable page editors), which
  // is safe but tears down and recreates DOM the user never touched,
  // reading as an unwanted "refresh" flash right as the close animation
  // settles. Removing just the closed column nodes leaves untouched
  // survivor columns' DOM (and editor state/cursor) completely alone.
  function closeColumnsFrom(fromColIndex) {
    var el = document.getElementById("contentArea");
    var cols = el.querySelectorAll(".column[data-col-index]");
    for (var i = 0; i < cols.length; i++) {
      if (parseInt(cols[i].getAttribute("data-col-index"), 10) >= fromColIndex) cols[i].remove();
    }
    prevPanelStack = state.panelStack.slice();
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function animateRemove(el, cb) {
    if (!el || prefersReducedMotion()) { cb(); return; }
    var h = el.getBoundingClientRect().height;
    el.style.height = h + "px";
    void el.offsetHeight;
    el.classList.add("removing");
    requestAnimationFrame(function () { el.style.height = "0px"; });
    setTimeout(cb, 210);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-nav]");
    if (el) {
      if (el.getAttribute("data-nav") === "today") { state.view = "today"; } else { state.view = "list"; state.currentListId = el.getAttribute("data-list"); }
      state.panelStack = [];
      renderAll();
      return;
    }

    el = e.target.closest("#newListBtn");
    if (el) {
      var n = lists.length + 1;
      var newList = makeList("list" + n, "Neue Liste", "var(--list-inbox)", []);
      lists.push(newList);
      state.view = "list"; state.currentListId = newList.id; state.panelStack = [];
      renderAll();
      return;
    }

    el = e.target.closest("#newGroupBtn");
    if (el) {
      var gn = groups.length + 1;
      groups.push({ id: "grp" + Date.now(), name: "Neue Gruppe " + gn });
      renderSidebar();
      return;
    }

    el = e.target.closest("[data-toggle-group]");
    if (el) {
      var gid = el.getAttribute("data-toggle-group");
      state.collapsedGroups[gid] = !state.collapsedGroups[gid];
      renderSidebar();
      return;
    }

    el = e.target.closest("[data-delete-list]");
    if (el) {
      var delListId = el.getAttribute("data-delete-list");
      var wrap = el.closest(".nav-item-wrap");
      animateRemove(wrap, function () {
        var idx = lists.findIndex(function (l) { return l.id === delListId; });
        if (idx >= 0) lists.splice(idx, 1);
        if (state.currentListId === delListId) {
          state.currentListId = lists.length ? lists[0].id : null;
          state.view = lists.length ? "list" : "today";
          state.panelStack = [];
        }
        renderAll();
      });
      return;
    }

    el = e.target.closest("[data-delete-group]");
    if (el) {
      var delGroupId = el.getAttribute("data-delete-group");
      var groupRow = el.closest(".group-row");
      animateRemove(groupRow, function () {
        for (var gi2 = 0; gi2 < lists.length; gi2++) { if (lists[gi2].groupId === delGroupId) lists[gi2].groupId = null; }
        var gidx = groups.findIndex(function (g) { return g.id === delGroupId; });
        if (gidx >= 0) groups.splice(gidx, 1);
        delete state.collapsedGroups[delGroupId];
        renderAll();
      });
      return;
    }

    el = e.target.closest("[data-check]");
    if (el) {
      var node = findTaskGlobal(el.getAttribute("data-check"));
      if (node) {
        setDoneCascade(node, !node.done);
        recomputeAncestors(node.id);
        renderColumns();
        renderSidebar();
      }
      return;
    }

    el = e.target.closest("[data-delete-owner]");
    if (el) {
      var ownerId = el.getAttribute("data-delete-owner");
      var blockId = el.getAttribute("data-delete-block");
      var kind = el.getAttribute("data-delete-kind");
      var deleteOwner = findList(ownerId) || findTaskGlobal(ownerId);
      var embedEl = el.closest(".inline-embed");
      if (deleteOwner) {
        animateRemove(embedEl, function () {
          var bidx = deleteOwner.blocks.findIndex(function (b) { return b.id === blockId; });
          if (kind === "task" && bidx >= 0) {
            var kids = childrenOf(deleteOwner);
            var ki = kids.findIndex(function (k) { return k.id === blockId; });
            if (ki >= 0) kids.splice(ki, 1);
            var stackIdx = state.panelStack.indexOf(blockId);
            if (stackIdx >= 0) state.panelStack = state.panelStack.slice(0, stackIdx);
            if (deleteOwner.subtasks) {
              deleteOwner.done = deleteOwner.subtasks.length > 0 && deleteOwner.subtasks.every(function (s) { return s.done; });
              recomputeAncestors(deleteOwner.id);
            }
          }
          if (bidx >= 0) deleteOwner.blocks.splice(bidx, 1);
          renderAll();
        });
      }
      return;
    }

    // --- Fälligkeitsmenü ---
    el = e.target.closest("[data-due-menu]");
    if (el) {
      var dueFor = el.getAttribute("data-due-menu");
      state.dueMenuFor = state.dueMenuFor === dueFor ? null : dueFor;
      renderColumns();
      return;
    }

    el = e.target.closest("[data-set-due]");
    if (el) {
      var dNode = findTaskGlobal(el.getAttribute("data-set-due"));
      if (dNode) {
        var val = el.getAttribute("data-due-value");
        dNode.due = val || null;
      }
      state.dueMenuFor = null;
      renderAll();
      return;
    }

    // Klick irgendwo sonst schließt ein offenes Fälligkeitsmenü.
    if (state.dueMenuFor && !e.target.closest("[data-due-menu-panel]")) {
      state.dueMenuFor = null;
      renderColumns();
      // kein return: der Klick soll trotzdem noch wirken
    }

    el = e.target.closest("[data-open-task]");
    if (el) {
      var taskId = el.getAttribute("data-open-task");
      var j = parseInt(el.getAttribute("data-col-index"), 10);
      state.panelStack = state.panelStack.slice(0, j).concat([taskId]);
      renderAll();
      return;
    }

    el = e.target.closest("[data-close-col]");
    if (el) {
      var j2 = parseInt(el.getAttribute("data-close-col"), 10);
      document.getElementById("appWindow").classList.toggle("sidebar-collapsed", j2 - 1 >= 2);
      animatePanelsClosing(j2, function () {
        state.panelStack = state.panelStack.slice(0, j2 - 1);
        closeColumnsFrom(j2);
      });
      return;
    }


    el = e.target.closest("[data-insert-image-at]");
    if (el) {
      var colIndex2 = parseInt(el.getAttribute("data-insert-image-at"), 10);
      var owner2 = ownerAt(colIndex2);
      if (!owner2) return;
      var editorEl2 = document.querySelector('[data-editor-for="' + owner2.id + '"]');
      var imgBlock = { type: "image", id: "img" + Date.now(), caption: "Neues Bild" };
      if (editorEl2) {
        insertEmbedInEditor(editorEl2, makeInlineImageNode(imgBlock, owner2.id));
        serializeEditor(owner2.id);
      } else {
        owner2.blocks.push(imgBlock);
      }
      renderColumns();
      return;
    }
  });

  document.addEventListener("mousedown", function (e) {
    if (e.target.closest("[data-insert-task-at], [data-insert-image-at]")) { e.preventDefault(); }
  });

  // Clicking the empty space under a page's content should continue writing
  // at the end, which is what the blank area looks like it offers. Left to
  // the browser it lands on whatever editable node happens to be nearest -
  // from under a trailing task block, that is the very top of the page.
  document.addEventListener("mousedown", function (e) {
    if (!e.target.closest) return;
    var editor = e.target.closest(".page-editor");
    // e.target is the editor itself only when the click missed all content.
    if (!editor || e.target !== editor) return;
    if (e.clientY <= editorContentBottom(editor)) return;
    e.preventDefault();
    placeCaretAtEnd(editor);
  });

  // --- Backspace am Zeilenanfang -----------------------------------------
  // Standardmaessig verschmilzt Backspace am Zeilenanfang die Zeile mit dem
  // vorherigen Block - und weil ein Aufgaben-/Bild-/Trenner-Block nicht
  // editierbar ist, loescht der Browser ihn stattdessen komplett. Eine
  // Aufgabe darf aber niemals nebenbei verschwinden, nur weil jemand eine
  // Leerzeile darunter wegnimmt. Loeschen laeuft ausschliesslich ueber den
  // dafuer vorgesehenen Knopf.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Backspace" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!e.target.closest) return;
    var editor = e.target.closest(".page-editor");
    if (!editor) return;
    var sel = window.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;   // Auswahl loeschen bleibt normal
    var range = sel.getRangeAt(0);
    if (!editor.contains(range.startContainer)) return;

    var host = range.startContainer;
    while (host && host.parentNode !== editor) host = host.parentNode;
    if (!host || isSolidBlock(host)) return;

    // Steht der Cursor wirklich ganz am Zeilenanfang?
    var probe = document.createRange();
    probe.selectNodeContents(host);
    probe.setEnd(range.startContainer, range.startOffset);
    if (probe.toString().length > 0) return;   // es steht noch Text davor

    var prev = host.previousSibling;
    if (!prev || !isSolidBlock(prev)) return;  // normaler Fall, Browser machen lassen

    e.preventDefault();

    // Naechste beschreibbare Zeile oberhalb des Blocks suchen - dorthin
    // wandert der Cursor.
    var target = prev.previousSibling;
    while (target && isSolidBlock(target)) target = target.previousSibling;

    if (!target) return;   // Block steht ganz oben: Zeile behalten, sonst
                           // gaebe es darueber keine Schreibposition mehr.

    // Die leere Zeile darf weg - der Block darueber niemals.
    if (host.textContent === "") host.remove();

    var r = document.createRange();
    r.selectNodeContents(target);
    r.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r);
  });

  // Enter is handled here rather than left to the browser: Chrome's default
  // splits the current block by wrapping everything that follows into the
  // new <div> it creates, which pulled the tasks below the caret inside a
  // paragraph and destroyed the block structure.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!e.target.closest) return;
    var editor = e.target.closest(".page-editor");
    if (!editor) return;
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (!editor.contains(range.startContainer)) return;
    e.preventDefault();

    var host = range.startContainer;
    while (host && host.parentNode !== editor) host = host.parentNode;
    if (!host) return;

    var line = makeLineNode("");
    if (isEmbed(host)) {
      // Caret sat on an embed: just open a fresh paragraph after it.
      editor.insertBefore(line, host.nextSibling);
    } else {
      // Move whatever follows the caret in this paragraph onto the new one.
      var tail = range.cloneRange();
      tail.setEnd(host, host.childNodes.length);
      var moved = tail.extractContents();
      line.innerHTML = "";
      line.appendChild(moved);
      // Der verschobene Rest bringt oft schon ein <br> mit. Ein zweites
      // ergaebe eine doppelt hohe Zeile.
      if (line.textContent === "" && !line.querySelector("br")) line.appendChild(document.createElement("br"));
      if (host.textContent === "" && !host.querySelector("br")) host.appendChild(document.createElement("br"));
      editor.insertBefore(line, host.nextSibling);
    }
    var r = document.createRange();
    r.selectNodeContents(line);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.hasAttribute && e.target.hasAttribute("data-quick-add")) {
      e.preventDefault();
      var val = e.target.value.trim();
      if (!val) return;
      var colIndex = parseInt(e.target.getAttribute("data-quick-add"), 10);
      var owner = ownerAt(colIndex);
      if (!owner) return;
      var t = task(val);
      childrenOf(owner).push(t);
      owner.blocks.push({ type: "task", id: t.id });
      if (owner.subtasks) { owner.done = false; recomputeAncestors(owner.id); }
      e.target.value = "";
      renderAll();
      var again = document.querySelector('[data-quick-add="' + colIndex + '"]');
      if (again) again.focus();
      return;
    }
    if (e.key === "Escape" && state.panelStack.length) {
      document.getElementById("appWindow").classList.remove("sidebar-collapsed");
      animatePanelsClosing(1, function () { state.panelStack = []; closeColumnsFrom(1); });
    }
  });

  document.addEventListener("blur", function (e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-editor-for")) {
      serializeEditor(e.target.getAttribute("data-editor-for"));
    }
  }, true);

  document.addEventListener("dragover", function (e) {
    var editor = e.target.closest(".page-editor");
    if (!editor) return;
    e.preventDefault();
    editor.classList.add("drag-over");
  });

  document.addEventListener("dragleave", function (e) {
    var editor = e.target.closest(".page-editor");
    if (editor) editor.classList.remove("drag-over");
  });

  document.addEventListener("drop", function (e) {
    var editor = e.target.closest(".page-editor");
    if (!editor) return;
    e.preventDefault();
    editor.classList.remove("drag-over");
    var ownerId = editor.getAttribute("data-editor-for");
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    if (!owner) return;
    var imgBlock = { type: "image", id: "img" + Date.now(), caption: "Reingezogenes Bild" };
    var range = null;
    if (document.caretRangeFromPoint) { range = document.caretRangeFromPoint(e.clientX, e.clientY); }
    else if (document.caretPositionFromPoint) {
      var pos = document.caretPositionFromPoint(e.clientX, e.clientY);
      if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); range.collapse(true); }
    }
    var node = makeInlineImageNode(imgBlock, owner.id);
    if (range && editor.contains(range.startContainer)) {
      range.insertNode(node);
    } else {
      editor.appendChild(node);
    }
    serializeEditor(ownerId);
    renderColumns();
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-pick-due")) {
      var pNode = findTaskGlobal(e.target.getAttribute("data-pick-due"));
      if (pNode) pNode.due = e.target.value || null;
      state.dueMenuFor = null;
      renderAll();
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-title-for")) {
      var node = findTaskGlobal(e.target.getAttribute("data-title-for"));
      if (node) node.title = e.target.value;
    }
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-group-title-for")) {
      var group = findGroup(e.target.getAttribute("data-group-title-for"));
      if (group) group.name = e.target.value;
    }
  });

  function moveList(draggedId, targetId, position) {
    var draggedIdx = lists.findIndex(function (l) { return l.id === draggedId; });
    if (draggedIdx < 0) return;
    var draggedList = lists[draggedIdx];
    lists.splice(draggedIdx, 1);
    var targetIdx = lists.findIndex(function (l) { return l.id === targetId; });
    if (targetIdx < 0) { lists.push(draggedList); return; }
    var target = lists[targetIdx];
    draggedList.groupId = target.groupId;
    var insertAt = position === "before" ? targetIdx : targetIdx + 1;
    lists.splice(insertAt, 0, draggedList);
  }

  function moveListToGroupEnd(draggedId, groupId) {
    var idx = lists.findIndex(function (l) { return l.id === draggedId; });
    if (idx < 0) return;
    var draggedList = lists[idx];
    lists.splice(idx, 1);
    draggedList.groupId = groupId;
    lists.push(draggedList);
  }

  function moveGroup(draggedId, targetId, position) {
    var draggedIdx = groups.findIndex(function (g) { return g.id === draggedId; });
    if (draggedIdx < 0) return;
    var draggedGroup = groups[draggedIdx];
    groups.splice(draggedIdx, 1);
    var targetIdx = groups.findIndex(function (g) { return g.id === targetId; });
    if (targetIdx < 0) { groups.push(draggedGroup); return; }
    var insertAt = position === "before" ? targetIdx : targetIdx + 1;
    groups.splice(insertAt, 0, draggedGroup);
  }

  var sidebarEl = document.getElementById("sidebar");

  // --- Shared pointer-based sorting ------------------------------------
  // One mechanism for everything that can be reordered by dragging: sidebar
  // lists and groups, and tasks/images embedded in a page.
  //
  // The native HTML5 drag-and-drop API is deliberately not used anywhere as
  // a drag *source*. It froze the app in real browsers in both places, it
  // fights the browser's own built-in drag behaviour inside contenteditable,
  // it never fires from a touch gesture (so it could not survive the planned
  // mobile view), and its drag image cannot be styled. Pointer events give
  // us the whole gesture with no native path running alongside it.
  //
  // Each caller supplies a small config: how to find the dragged item from
  // the pressed element, where its container is, how to resolve the drop
  // spot under the pointer, and what to do on release.

  var sortDrag = null;      // active gesture, or null

  var SORT_CONFIGS = [
    {
      // Sidebar lists + groups. The row itself is the handle: a press that
      // never crosses the movement threshold stays an ordinary click, so
      // navigating by clicking a list still works.
      name: "sidebar",
      itemFrom: function (t) { return t.closest('[data-drag-type][data-drag-id]'); },
      containerFrom: function () { return sidebarEl; },
      resolveSpot: function (container, x, y, el) {
        var under = document.elementFromPoint(x, y);
        if (!under || !container.contains(under)) return null;
        var type = el.getAttribute("data-drag-type");
        var id = el.getAttribute("data-drag-id");
        var groupTarget = under.closest('.group-row[data-drag-type="group"]');
        var listTarget = under.closest('.nav-item[data-drag-type="list"]');
        if (type === "list" && groupTarget) return { target: groupTarget, pos: "into" };
        if (type === "list" && listTarget && listTarget.getAttribute("data-drag-id") !== id) {
          var r = listTarget.getBoundingClientRect();
          return { target: listTarget, pos: y < r.top + r.height / 2 ? "before" : "after" };
        }
        if (type === "group" && groupTarget && groupTarget.getAttribute("data-drag-id") !== id) {
          var gr = groupTarget.getBoundingClientRect();
          return { target: groupTarget, pos: y < gr.top + gr.height / 2 ? "before" : "after" };
        }
        return null;
      },
      commit: function (el, spot) {
        var type = el.getAttribute("data-drag-type");
        var id = el.getAttribute("data-drag-id");
        var targetId = spot.target.getAttribute("data-drag-id");
        if (type === "list" && spot.pos === "into") moveListToGroupEnd(id, targetId);
        else if (type === "list") moveList(id, targetId, spot.pos);
        else if (type === "group") moveGroup(id, targetId, spot.pos);
        renderSidebar();
      }
    },
    {
      // Embedded tasks/images. Dragged by an explicit grip, because the row
      // itself is clickable (opens the page) and sits inside editable text
      // where a press would otherwise start selecting.
      name: "embed",
      requiresGrip: "[data-embed-grip]",
      itemFrom: function (t) { return t.closest(".inline-embed[data-embed-marker]"); },
      containerFrom: function (el) { return el.closest(".page-editor"); },
      // Every top-level block is a drop anchor, not just other embeds, so a
      // task can be dropped between two lines of text as well as between
      // two tasks.
      resolveSpot: function (container, x, y, el) {
        var all = container.childNodes;
        var others = [];
        for (var i = 0; i < all.length; i++) {
          if (all[i] !== el && all[i].nodeType === 1 && all[i].getBoundingClientRect) others.push(all[i]);
        }
        if (!others.length) return null;
        for (var j = 0; j < others.length; j++) {
          var r = others[j].getBoundingClientRect();
          if (y < r.top + r.height / 2) return { target: others[j], pos: "before" };
        }
        return { target: others[others.length - 1], pos: "after" };
      },
      commit: function (el, spot) {
        var editor = spot.target.closest(".page-editor");
        var ownerId = editor.getAttribute("data-editor-for");
        if (spot.pos === "before") { spot.target.parentNode.insertBefore(el, spot.target); }
        else { spot.target.parentNode.insertBefore(el, spot.target.nextSibling); }
        normalizeEditor(editor);
        serializeEditor(ownerId);
        renderAll();
      }
    }
  ];

  // Pressing these must never start a drag - they are their own controls.
  // Text fields are deliberately NOT in this list: a group row is mostly
  // taken up by its name field, so excluding it would leave almost nothing
  // to grab the group by. Instead a press on a field that is already focused
  // is left alone, so selecting and editing text still works normally.
  var SORT_PRESS_EXCLUDE = ".group-chevron, .nav-delete, .row-delete, .check-btn";

  function clearSortIndicator() {
    if (sortDrag && sortDrag.spot) {
      sortDrag.spot.target.classList.remove("drop-before", "drop-after", "drop-into");
    }
  }

  function endSortDrag() {
    if (!sortDrag) return;
    clearSortIndicator();
    sortDrag.el.classList.remove("drag-ghost");
    if (sortDrag.container) sortDrag.container.classList.remove("is-sorting");
    if (sortDrag.captureEl && sortDrag.captureEl.releasePointerCapture) {
      try { sortDrag.captureEl.releasePointerCapture(sortDrag.pointerId); } catch (err) { /* already gone */ }
    }
    sortDrag = null;
  }

  document.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || sortDrag) return;
    if (!e.target.closest) return;
    if (e.target.closest(SORT_PRESS_EXCLUDE)) return;
    // Already editing this field? Then the press belongs to the text, not
    // to a drag.
    if (e.target === document.activeElement && e.target.closest("input, textarea")) return;

    for (var i = 0; i < SORT_CONFIGS.length; i++) {
      var cfg = SORT_CONFIGS[i];
      var pressEl = e.target;
      if (cfg.requiresGrip) {
        pressEl = e.target.closest(cfg.requiresGrip);
        if (!pressEl) continue;
      }
      var el = cfg.itemFrom(pressEl);
      if (!el) continue;
      var container = cfg.containerFrom(el);
      if (!container) continue;

      var captureEl = cfg.requiresGrip ? pressEl : el;
      sortDrag = {
        cfg: cfg, el: el, container: container, captureEl: captureEl,
        pointerId: e.pointerId, startY: e.clientY, active: false, spot: null
      };
      // Only suppress the browser's default for grip drags. On the sidebar
      // the press may still turn out to be a plain click, and preventing
      // the default here would break focus/click behaviour.
      if (cfg.requiresGrip) e.preventDefault();
      if (captureEl.setPointerCapture) {
        try { captureEl.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
      }
      return;
    }
  });

  document.addEventListener("pointermove", function (e) {
    if (!sortDrag || e.pointerId !== sortDrag.pointerId) return;
    if (!sortDrag.active) {
      if (Math.abs(e.clientY - sortDrag.startY) < 4) return; // still just a click
      sortDrag.active = true;
      // The press may have focused a text field inside the row (a group's
      // name). Once it turns into a drag, drop that focus so the gesture
      // doesn't smear a text selection across the field.
      if (document.activeElement && sortDrag.el.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      var sel = window.getSelection && window.getSelection();
      if (sel && sel.removeAllRanges) sel.removeAllRanges();
      sortDrag.el.classList.add("drag-ghost");
      sortDrag.container.classList.add("is-sorting");
    }
    e.preventDefault();
    clearSortIndicator();
    var spot = sortDrag.cfg.resolveSpot(sortDrag.container, e.clientX, e.clientY, sortDrag.el);
    sortDrag.spot = spot;
    if (spot) {
      spot.target.classList.add(spot.pos === "into" ? "drop-into" : "drop-" + spot.pos);
    }
  });

  // A drag that ends over a clickable row would otherwise also fire a click
  // (e.g. navigating to the list you just moved). Swallow that one click.
  // Registered per drop and torn down on the next event-loop turn, so it can
  // never linger and eat an unrelated click later on - a stale suppressor
  // looks exactly like an app that has stopped responding.
  function swallowNextClick() {
    function onClick(ev) { ev.stopPropagation(); ev.preventDefault(); }
    document.addEventListener("click", onClick, true);
    setTimeout(function () { document.removeEventListener("click", onClick, true); }, 0);
  }

  document.addEventListener("pointerup", function (e) {
    if (!sortDrag || e.pointerId !== sortDrag.pointerId) return;
    var cfg = sortDrag.cfg, el = sortDrag.el, spot = sortDrag.spot, wasActive = sortDrag.active;
    endSortDrag();
    if (wasActive) {
      swallowNextClick();
      if (spot && spot.target !== el) cfg.commit(el, spot);
    }
  });

  document.addEventListener("pointercancel", function (e) {
    if (sortDrag && e.pointerId === sortDrag.pointerId) endSortDrag();
  });

  // Belt and braces: the browser must never start a drag of its own on a
  // sortable row or inside a page editor, whatever the gesture originates on.
  document.addEventListener("dragstart", function (e) {
    if (!e.target.closest) return;
    if (e.target.closest(".page-editor") || e.target.closest("[data-drag-type]")) e.preventDefault();
  });

  document.addEventListener("click", function (e) {
    if (e.target.closest("#optionsBtn")) {
      state.optionsOpen = !state.optionsOpen;
      renderSidebar();
      return;
    }
    var themeChoice = e.target.closest("[data-set-theme]");
    if (themeChoice) {
      var choice = themeChoice.getAttribute("data-set-theme");
      if (choice === "system") { document.documentElement.removeAttribute("data-theme"); }
      else { document.documentElement.setAttribute("data-theme", choice); }
      state.optionsOpen = false;
      renderSidebar();
      return;
    }
    if (state.optionsOpen && !e.target.closest(".options-wrap")) {
      state.optionsOpen = false;
      renderSidebar();
    }
  });

  document.documentElement.setAttribute("data-theme", "light");
  renderAll();
})();
</script>
