      var pos = knotenAushaengen(INBOX_ID, node.id);
      if (!pos) return;
      var ziel = findList(listId);
      if (!ziel) { knotenEinhaengen(INBOX_ID, pos.node, pos.kidIndex, pos.blockIndex); return; }
      knotenEinhaengen(listId, pos.node, childrenOf(ziel).length, -1);
      t.verlauf.push({ art: "liste", id: node.id, ziel: listId, pos: pos, i: t.i });
      t.proListe[listId] = (t.proListe[listId] || 0) + 1;
      t.zielPuls = listId;
      t.i++;
    });
  }

  // WANN? rueckt NICHT weiter: Ein Datum allein laesst die Aufgabe im
  // Eingang liegen, und der Durchgang waere umsonst gewesen. Der gewaehlte
  // Wert wird markiert, die Karte bleibt stehen, erst die Listenwahl
  // schliesst sie ab.
  function tidyDatum(iso) {
    var node = tidyAktuell();
    var t = state.tidy;
    if (!node || !t || t.busy) return;
    haptik(8);
    t.verlauf.push({ art: "datum", id: node.id, vorher: node.due, i: t.i });
    node.due = node.due === iso ? null : iso;
    t.einflug = null;
    t.rollt = false;
    t.pop = node.due;
    t.kalender = false;
    renderAll();
  }

  // EIN Knopf, nicht zwei. "Erledigt" und "Loeschen" waren im Eingang
  // dasselbe mit zwei Namen: Der Unterschied - Erledigtes bleibt als Beleg
  // stehen - traegt nur INNERHALB einer Liste, wo es einen Fortschritt
  // fuellt und wiederzufinden ist. Im Eingang hat Erledigtes keinen Ort und
  // blieb als durchgestrichene Zeile liegen, obwohl der Eingang fuer
  // UNSORTIERTES da ist. Deshalb hakt "Erledigt" hier ab UND raeumt aus.
  // Wiederherstellbar ueber "Zurueck", danach ueber den Papierkorb
  // (spec.md 4.3, kommt mit der Datenschicht).
  function tidyErledigt() {
    var node = tidyAktuell();
    var t = state.tidy;
    if (!node || !t) return;
    tidySchritt("zusammen", "von-unten", [10, 30, 14], function () {
      setDoneCascade(node, true);
      var pos = knotenAushaengen(INBOX_ID, node.id);
      if (!pos) { setDoneCascade(node, false); return; }
      t.verlauf.push({ art: "erledigt", id: node.id, pos: pos, i: t.i });
      t.erledigt++;
      t.i++;
    });
  }

  // Passt keine der Listen, wird eine angelegt, ohne den Durchgang zu
  // verlassen: Das Feld klappt an der Stelle der Pille auf, im Fluss.
  function tidyNeueListe(name) {
    var node = tidyAktuell();
    var t = state.tidy;
    if (!node || !t) return;
    var sauber = (name || "").trim();
    if (!sauber) { t.neueListe = false; renderColumns(); return; }
    // Farbe reihum aus der kuratierten Reihe, damit keine sechste entsteht.
    var farbe = LIST_COLORS[lists.length % LIST_COLORS.length].token;
    var neu = makeList("list" + Date.now(), sauber, farbe, []);
    lists.push(neu);
    t.neueListe = false;
    tidyInListe(neu.id);
  }

  // Kein Tick: Aufschieben ist keine Leistung, und eine Rueckmeldung, die
  // alles quittiert, quittiert nichts. Es entsteht auch kein dauerhafter
  // Zustand - die Sperre gilt nur fuer diesen Durchgang, damit er sich nicht
  // im Kreis dreht.
  //
  // Die Bewegung ist DIESELBE wie beim Einsortieren - ausdrueckliche
  // Entscheidung des Nutzers (2026-08-11): "die Animation, wenn man Später
  // drückt, sollte so sein wie wenn man die Aufgabe einer Liste zuordnet".
  // Sie war vorher eine eigene (nach rechts, in Richtung des Knopfes) und
  // damit "ähnlich, aber nicht gleich" - genau das stoerte. Der Preis ist
  // benannt: Die Bewegung sagt nicht mehr, WAS geschehen ist; das traegt
  // jetzt allein der Zaehler, der beim Ueberspringen nicht weiterzaehlt.
  function tidySpaeter() {
    var node = tidyAktuell();
    var t = state.tidy;
    if (!node || !t) return;
    tidySchritt("nach-links", "von-unten", 0, function () {
      t.verlauf.push({ art: "spaeter", id: node.id, i: t.i });
      t.spaeter++;
      t.i++;
    });
  }

  // Die Karte kommt aus derselben Richtung zurueck, in die sie gegangen ist.
  var TIDY_RUECKWEG = { liste: "von-links", erledigt: "von-unten", spaeter: "von-links" };

  function tidyZurueck() {
    var t = state.tidy;
    if (!t || t.busy || !t.verlauf.length) return;
    var e = t.verlauf.pop();
    haptik(8);

    if (e.art === "liste") {
      var raus = knotenAushaengen(e.ziel, e.id);
      if (raus) knotenEinhaengen(INBOX_ID, raus.node, e.pos.kidIndex, e.pos.blockIndex);
      t.proListe[e.ziel] = (t.proListe[e.ziel] || 1) - 1;
      if (t.proListe[e.ziel] <= 0) delete t.proListe[e.ziel];
      t.i = e.i;
    } else if (e.art === "erledigt") {
      setDoneCascade(e.pos.node, false);
      knotenEinhaengen(INBOX_ID, e.pos.node, e.pos.kidIndex, e.pos.blockIndex);
      t.erledigt--;
      t.i = e.i;
    } else if (e.art === "spaeter") {
      t.spaeter--;
      t.i = e.i;
    } else if (e.art === "datum") {
      var dn = findTaskGlobal(e.id);
      if (dn) dn.due = e.vorher;
      t.i = e.i;
    }

    t.einflug = TIDY_RUECKWEG[e.art] || null;
    t.rollt = e.art !== "datum";
    t.kalender = false;
    renderAll();
  }

  function findTaskGlobal(id) {
    function search(nodes) {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].id === id) return nodes[i];
        var f = search(nodes[i].subtasks);
        if (f) return f;
      }
      return null;
    }
    for (var i = 0; i < lists.length; i++) { var f = search(lists[i].tasks); if (f) return f; }
    return null;
  }

  function findParentTask(id) {
    function search(nodes) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        for (var k = 0; k < n.subtasks.length; k++) { if (n.subtasks[k].id === id) return n; }
        var f = search(n.subtasks);
        if (f) return f;
      }
      return null;
    }
    for (var i = 0; i < lists.length; i++) { var f = search(lists[i].tasks); if (f) return f; }
    return null;
  }

  function setDoneCascade(node, value) {
    node.done = value;
    for (var i = 0; i < node.subtasks.length; i++) { setDoneCascade(node.subtasks[i], value); }
  }

  function recomputeAncestors(id) {
    var current = id;
    var seen = {};
    while (true) {
      // A malformed tree (a task reachable as its own ancestor) would make
      // this walk loop forever and freeze the whole app. Bail out instead.
      if (seen[current]) break;
      seen[current] = true;
      var parent = findParentTask(current);
      if (!parent) break;
      parent.done = parent.subtasks.length > 0 && parent.subtasks.every(function (s) { return s.done; });
      current = parent.id;
    }
  }

  function progress(node) {
    var kids = childrenOf(node);
    if (!kids.length) return null;
    var done = 0;
    for (var i = 0; i < kids.length; i++) { if (kids[i].done) done += 1; }
    return { done: done, total: kids.length };
  }

  function countAll(nodes) {
    var total = 0, done = 0;
    for (var i = 0; i < nodes.length; i++) {
      total += 1; if (nodes[i].done) done += 1;
      var c = countAll(nodes[i].subtasks);
      total += c.total; done += c.done;
    }
    return { total: total, done: done };
  }

  // --- Fälligkeitsdaten -------------------------------------------------
  // Ein Fälligkeitsdatum ist ein reines Kalenderdatum ("2026-08-14"), kein
  // Zeitstempel. Eine Aufgabe, die am 14. fällig ist, ist überall auf der
  // Welt am 14. fällig - dadurch entfällt die gesamte Zeitzonen-Fehlerklasse.
  // Verglichen wird deshalb per Zeichenkette, nicht über Date-Objekte.

  function isoPlusDays(iso, days) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function isOverdue(node) { return !!node.due && node.due < TODAY_ISO && !node.done; }
  function isDueToday(node) { return node.due === TODAY_ISO; }

  // Die Heute-Seite zeigt fällige *und* überfällige Aufgaben. Überfälliges
  // verschwindet bewusst nicht: eine Aufgabe stillschweigend fallenzulassen
  // ist bei einer Todo-App der schlimmere Fehler als eine volle Liste.
  // Erledigtes zählt nie als überfällig.
  function collectToday() {
    var out = [];
    function walk(nodes, list) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (isDueToday(n) || isOverdue(n)) out.push({ node: n, list: list, overdue: isOverdue(n) });
        walk(n.subtasks, list);
      }
    }
    for (var i = 0; i < lists.length; i++) { walk(lists[i].tasks, lists[i]); }
    // Überfälliges zuerst, ältestes oben - das Liegengebliebene soll auffallen.
    out.sort(function (a, b) {
      if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
      return a.node.due < b.node.due ? -1 : a.node.due > b.node.due ? 1 : 0;
    });
    return out;
  }

  // Immer Tag und Monat, nie "Heute"/"Morgen" - für Stellen, an denen das
  // Wort schon woanders steht (siehe Fälligkeits-Chip).
  function datumKurz(iso) {
    var d = new Date(iso + "T00:00:00");
    var months = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
    return d.getDate() + ". " + months[d.getMonth()];
  }

  function formatDue(iso) {
    if (iso === TODAY_ISO) return "Heute";
    if (iso === isoPlusDays(TODAY_ISO, 1)) return "Morgen";
    if (iso === isoPlusDays(TODAY_ISO, -1)) return "Gestern";
    var d = new Date(iso + "T00:00:00");
    var months = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
    var s = d.getDate() + ". " + months[d.getMonth()];
    // Jahr nur nennen, wenn es nicht das laufende ist - sonst nur Rauschen.
    if (iso.slice(0, 4) !== TODAY_ISO.slice(0, 4)) s += " " + d.getFullYear();
    return s;
  }

  // Klassen für die Fälligkeits-Pille an einer Aufgabe.
  function duePillClass(node) {
    if (isOverdue(node)) return " overdue";
    if (isDueToday(node)) return " today";
    return "";
  }

  // Unfold-Logo. Original als design/assets/logo.svg abgelegt; hier mit
  // currentColor statt der festen #ed6c4e, damit es im Dunkelmodus die
  // hellere Akzentvariante annimmt.
  // ⚠️ Wer das Logo wechselt, muss es an ZWEI Stellen tun: hier und in
  // design/assets/logo.svg. Die Anleitung dazu steht in
  // design/assets/README.md - dort liegen auch die alten Fassungen.
  // Aktiv: v2 (seit 2026-08-13).
  function svgLogo() {
    return '<svg class="brand-logo" viewBox="0 0 214.8 199.66" fill="currentColor" role="img" aria-label="Unfold">' +
      '<path d="M214.37,60.53l-38.99,131.36c-1.63,5.49-7.65,8.8-13.6,7.47-10.9-2.45-29.79-5.68-54.38-5.97-24.59.29-43.48,3.52-54.38,5.97-5.95,1.33-11.97-1.98-13.6-7.47L.43,60.53c-2.72-9.16,7.97-16.71,16.75-11.83,23.53,13.08,58.55,32.6,78.44,43.69,4.14,2.31,6.85,6.54,7.22,11.26l3.14,39.93c.14,1.74,2.69,1.74,2.83,0l3.14-39.93c.37-4.73,3.08-8.95,7.22-11.26,19.89-11.09,54.91-30.61,78.44-43.69,8.78-4.88,19.47,2.67,16.75,11.83Z"/>' +
      '<path d="M157.54,45.85c.35,4.01.22,7.95-.33,11.75-.51,3.52-2.63,6.6-5.74,8.32l-42.7,23.65c-.86.47-1.9.47-2.75,0l-43.13-24.07c-3.59-2-5.81-5.78-5.81-9.89v-5.29C57.07,22.16,80.21-.59,108.5.01c25.49.55,46.82,20.45,49.04,45.84Z"/>' +
      "</svg>";
  }

  function svgCheckboxOutline() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.34"><rect x="2.5" y="2.5" width="10" height="10" rx="3"/></svg>'; }
  function svgHeading() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.34" stroke-linecap="round"><path d="M3.5 3v9M11.5 3v9M3.5 7.5h8"/></svg>'; }
  function svgDividerIcon() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.34" stroke-linecap="round"><path d="M2 7.5h11"/></svg>'; }

  function svgCalendar() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.34" stroke-linecap="round"><rect x="2" y="3" width="11" height="10" rx="1.6"/><path d="M2 6.2h11M5 1.6v2.2M10 1.6v2.2"/></svg>'; }

  // Fälligkeits-Steuerung im Kopf einer Aufgabenseite. Dauerhaft sichtbar,
  // kein Aufklappen: Man sieht den Zustand ohne einen einzigen Klick und
  // setzt die beiden häufigsten Werte mit einem.
  function dueControl(node) {
    var tomorrow = isoPlusDays(TODAY_ISO, 1);
    var chipKlasse = node.due ? (duePillClass(node) || " set") : "";
    // Der Chip ergänzt die Schnellwahl, statt sie zu wiederholen: Deckt ein
    // Segment das Datum bereits ab ("Heute"/"Morgen"), zeigt er das
    // konkrete Datum. Sonst stünde zweimal dasselbe Wort nebeneinander.
    var vonSegmentGedeckt = node.due === TODAY_ISO || node.due === tomorrow;
    var beschriftung = node.due
      ? (isOverdue(node) ? "Überfällig · " : "") + (vonSegmentGedeckt ? datumKurz(node.due) : formatDue(node.due))
      : "Datum wählen";

    // Zeile und Kalender stehen in einem gemeinsamen Block, der senkrecht
    // stapelt. Ohne ihn landet der Kalender NEBEN der Zeile, weil
    // .col-progress-row ein waagerechter Flex-Container ist.
    var h = '<div class="due-block"><div class="due-row">';
    h += '<div class="due-seg" role="group" aria-label="Fälligkeit">';
    h += segButton(node, TODAY_ISO, "Heute");
    h += segButton(node, tomorrow, "Morgen");
    h += "</div>";

    h += '<div class="due-chip' + chipKlasse + '">';
    h += '<button type="button" class="due-chip-label" data-cal-for="' + node.id + '"' +
         ' aria-expanded="' + (state.calendarFor === node.id ? "true" : "false") + '"' +
         ' title="Datum wählen">' + svgCalendar() + "<span>" + beschriftung + "</span></button>";
    if (node.due) {
      h += '<button class="due-chip-x" data-set-due="' + node.id + '" data-due-value="" ' +
           'aria-label="Fälligkeit entfernen" title="Fälligkeit entfernen">' + svgClose() + "</button>";
    }
    h += "</div></div>";
    if (state.calendarFor === node.id) h += kalender(node);
    h += "</div>";
    return h;
  }

  // Eigener Kalender statt des nativen Datumsfeldes. Zwei Gründe:
  // Das Browser-Widget bringt seine eigene Gestaltung in eine sonst
  // durchgestaltete Oberfläche, und es öffnet als schwebendes Fenster.
  // Dieser hier klappt IM FLUSS unter der Zeile auf - wie die Farbreihe im
  // Spaltenkopf. Dadurch kann er nicht über den Fensterrand hinauslaufen,
  // ohne dass es dafür eine einzige Zeile Positionierungslogik braucht.
  var WOCHENTAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  var MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni",
                "Juli", "August", "September", "Oktober", "November", "Dezember"];

  function isoVon(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }

  function monatVerschieben(monatIso, delta) {
    var d = new Date(monatIso + "-01T00:00:00");
    d.setMonth(d.getMonth() + delta);
    return isoVon(d).slice(0, 7);
  }

  function monatsGitter(monatIso) {
    var d = new Date(monatIso + "-01T00:00:00");
    var jahr = d.getFullYear(), monat = d.getMonth();
    // Woche beginnt am Montag: getDay() liefert 0 für Sonntag.
    var versatz = (new Date(jahr, monat, 1).getDay() + 6) % 7;
    var tage = [];
    for (var i = 0; i < 42; i++) {
      var t = new Date(jahr, monat, 1 - versatz + i);
      tage.push({ iso: isoVon(t), tag: t.getDate(), imMonat: t.getMonth() === monat });
    }
    // Sechste Zeile nur zeigen, wenn sie Tage dieses Monats enthält - sonst
    // springt die Höhe des Kalenders von Monat zu Monat ohne Grund.
    var sechste = tage.slice(35);
    var braucht = false;
    for (var k = 0; k < sechste.length; k++) if (sechste[k].imMonat) braucht = true;
    return braucht ? tage : tage.slice(0, 35);
  }

  // Setzt den Kalender einer Zeile unter genau diese Zeile. Er haengt an
  // der Spalte statt an der Zeile, weil .inline-embed overflow: hidden hat
  // und ihn sonst abschneiden wuerde; die Lage wird deshalb gemessen.
  function placeRowCalendar() {
    var alt = document.querySelector(".due-cal.row-cal");
    if (alt && alt.parentNode) alt.parentNode.removeChild(alt);
    if (state.calAnchor !== "row" || !state.calendarFor) return;
    var node = findTaskGlobal(state.calendarFor);
    var embed = document.querySelector('.inline-embed[data-embed-marker="task:' + state.calendarFor + '"]');
    if (!node || !embed) return;
    var col = embed.closest(".column");
    if (!col) return;

    var huelle = document.createElement("div");
    huelle.innerHTML = kalender(node);
    var kal = huelle.firstChild;
    kal.classList.add("row-cal");
    col.appendChild(kal);

    var cb = col.getBoundingClientRect(), eb = embed.getBoundingClientRect();
    var links = eb.left - cb.left + 16;
    // Am rechten Spaltenrand nach innen ruecken, statt hinauszulaufen.
    links = Math.max(6, Math.min(links, cb.width - kal.offsetWidth - 6));
    kal.style.left = links + "px";
    kal.style.top = (eb.bottom - cb.top + 4) + "px";
  }

  function kalender(node) {
    var monat = state.calMonth || (node.due ? node.due.slice(0, 7) : TODAY_ISO.slice(0, 7));
    var d = new Date(monat + "-01T00:00:00");
    var tage = monatsGitter(monat);

    var h = '<div class="due-cal" data-neu-schluessel="cal:' + node.id + '" role="group" aria-label="Datum wählen">';
    h += '<div class="due-cal-top">';
    h += '<button class="due-cal-nav" data-cal-step="-1" aria-label="Vorheriger Monat">' + svgChevronLeft() + "</button>";
    h += '<span class="due-cal-month">' + MONATE[d.getMonth()] + " " + d.getFullYear() + "</span>";
    h += '<button class="due-cal-nav" data-cal-step="1" aria-label="Nächster Monat">' + svgChevronRight() + "</button>";
    h += "</div>";

    h += '<div class="due-cal-grid">';
    for (var w = 0; w < 7; w++) h += '<span class="due-cal-wd">' + WOCHENTAGE[w] + "</span>";
    for (var i = 0; i < tage.length; i++) {
      var t = tage[i];
      var kl = "due-cal-day";
      if (!t.imMonat) kl += " fremd";
      if (t.iso === TODAY_ISO) kl += " heute";
      if (node.due && t.iso === node.due) kl += " gewaehlt";
      h += '<button class="' + kl + '" data-cal-day="' + node.id + '" data-cal-value="' + t.iso + '">' + t.tag + "</button>";
    }
    h += "</div></div>";
    return h;
  }

  // --- Die Seite des Aufräum-Modus ---------------------------------------
  // Sie ersetzt den Inhalt der Eingang-Spalte, nicht das Fenster: Sidebar und
  // Spaltenrahmen bleiben stehen. Kein Overlay (concept.md, Design-Richtung)
  // - und die Sidebar MUSS hier sichtbar bleiben, weil sie das Ziel der
  // Wegflug-Bewegung ist.
  function svgInboxGross() {
    return '<svg viewBox="0 0 15 15" fill="none"><path d="M1.5 8.6h3.3l.9 1.7h3.6l.9-1.7h3.3" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.4 2.4h8.2l1.9 6.2v3.1c0 .6-.5 1.1-1.1 1.1H2.6c-.6 0-1.1-.5-1.1-1.1V8.6l1.9-6.2z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg>';
  }
  function svgBesen() {
    return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 1.9L6.2 5.3"/><path d="M4.6 5.1h4.2l1 3.1H3.6l1-3.1z"/><path d="M4 8.2l-.7 4.9M6.2 8.2v4.9M8.4 8.2l.7 4.9"/></svg>';
  }
  function svgHakenGross() {
    return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M3 8l3.2 3.2L12 4.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function svgUnterbau() {
    return '<svg width="12" height="12" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v6.5c0 1.1.9 2 2 2h5"/><path d="M9 8.5l2 2-2 2"/></svg>';
  }

  // Erster Textblock der Seite als leise Zeile unter dem Titel. Der Editor
  // legt dort Auszeichnung ab; die faellt hier weg, es geht nur um den Sinn.
  function ersterText(node) {
    for (var i = 0; i < node.blocks.length; i++) {
      if (node.blocks[i].type === "text" && node.blocks[i].text) {
        var roh = String(node.blocks[i].text).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
        if (roh) return roh;
      }
    }
    return "";
  }

  function tidyKnopf(attr, wert, text, klasse) {
    return '<button class="tidy-btn' + (klasse ? " " + klasse : "") + '" type="button" ' +
           attr + '="' + wert + '">' + text + "</button>";
  }

  function renderTidy() {
    var t = state.tidy;
    var node = tidyAktuell();
    var gesamt = t.queue.length;
    var anteil = gesamt ? t.i / gesamt : 1;

    var h = '<div class="tidy">';
    h += '<div class="tidy-head"><div class="tidy-head-top">';
    h += '<span class="tidy-title">Aufräumen</span>';
    // Am Ende traegt die Fusszeile den Abschluss - zweimal "Fertig" auf einem
    // Bild ist einmal zu viel, und abbrechen laesst sich nichts mehr.
    if (node) h += '<button class="tidy-quit" type="button" data-tidy="quit">Fertig</button>';
    h += "</div>";
    h += '<div class="tidy-meta' + (t.rollt ? " rollt" : "") + '">' +
         '<span class="tidy-zahl"><span>' + t.i + "</span></span> von " + gesamt +
         (node ? " · noch " + (gesamt - t.i) + " übrig" : " · fertig") + "</div>";
    // scaleX statt width: Layout-Eigenschaften werden nicht animiert. Die
    // Kurve darf hier als EINZIGER Stelle der App ueberschwingen.
    //
    // Der Balken wird mit dem ALTEN Wert aufgebaut und erst im naechsten
    // Bild auf den neuen gesetzt (tidyBalkenLauf). Ohne das lief die
    // Animation nie: renderTidy() baut die Seite bei jedem Schritt neu auf,
    // und ein frisch eingesetztes Element hat keinen Vorzustand, von dem aus
    // ein transition laufen koennte - es stand sofort auf dem Endwert.
    var vorher = typeof t.balkenAlt === "number" ? t.balkenAlt : anteil;
    var kerben = gesamt > 1 && gesamt <= 12;
    h += '<div class="tidy-bar"' + (kerben ? ' data-kerben style="--tidy-n:' + gesamt + '"' : "") + '>' +
         '<span data-balken-ziel="' + anteil.toFixed(4) + '" style="transform: scaleX(' + vorher.toFixed(4) + ')"></span></div>';
    h += "</div>";
    t.balkenAlt = anteil;

    if (node) {
      var einflug = t.einflug ? " tidy-karte-rein " + t.einflug : "";
      h += '<div class="tidy-body"><div class="tidy-card' + einflug + '">';
      // Der Titel steht als inline-Element in einer eigenen Zeile: Nur so
      // ist der Durchstreich-Strich so breit wie der Text und nicht so breit
      // wie die Spalte.
      h += '<div class="tidy-card-titelzeile"><span class="tidy-card-title">' +
           escapeHtml(node.title) + "</span></div>";
      var notiz = ersterText(node);
      if (notiz) h += '<div class="tidy-card-note">' + escapeHtml(notiz) + "</div>";
      // Unteraufgaben sind im Eingang erlaubt (spec.md 2.0) und wandern beim
      // Einsortieren mit. Wer das nicht sieht, verschiebt drei Aufgaben und
      // denkt, es sei eine gewesen.
      // Was die Aufgabe schon mitbringt, gehoert auf die Karte. Ein
      // gesetztes - erst recht ein ueberfaelliges - Datum ist genau die
      // Angabe, die "Wann?" beeinflusst; sie erst hinter den Knoepfen
      // erraten zu lassen, waere eine verschwiegene Entscheidungsgrundlage.
      if (node.due || node.subtasks.length) {
        h += '<div class="tidy-card-meta">';
        if (node.due) {
          h += '<span class="due-pill' + duePillClass(node) + '">' +
               (isOverdue(node) ? "Überfällig · " : "Fällig · ") + formatDue(node.due) + "</span>";
        }
        if (node.subtasks.length) {
          h += '<span class="tidy-card-sub">' + svgUnterbau() +
               "<span>" + node.subtasks.length +
               (node.subtasks.length === 1 ? " Unteraufgabe wandert mit" : " Unteraufgaben wandern mit") +
               "</span></span>";
        }
        h += "</div>";
      }
      h += '<div class="tidy-sep"></div>';

      h += '<div class="tidy-rubrik">In welche Liste?</div><div class="tidy-wahl">';
      for (var i = 0; i < lists.length; i++) {
        if (lists[i].id === INBOX_ID) continue;
        h += '<button class="tidy-btn" type="button" data-tidy-liste="' + lists[i].id + '">' +
             '<span class="list-dot" style="background:' + lists[i].color + '"></span>' +
             escapeHtml(lists[i].name) + "</button>";
      }
      // Passt keine, wird eine angelegt - an Ort und Stelle, im Fluss, ohne
      // den Durchgang zu verlassen.
      if (t.neueListe) {
        h += '<span class="tidy-btn neu-feld"><span class="list-dot" style="background:' +
             LIST_COLORS[lists.length % LIST_COLORS.length].token + '"></span>' +
             '<input type="text" data-tidy-neu-feld placeholder="Name der Liste …" ' +
             'aria-label="Name der neuen Liste" autocomplete="off" /></span>';
      } else {
        h += '<button class="tidy-btn leise" type="button" data-tidy="neue-liste">' +
             svgPlus() + "Neue Liste</button>";
      }
      h += "</div>";

      var morgen = isoPlusDays(TODAY_ISO, 1);
      h += '<div class="tidy-rubrik">Wann?</div><div class="tidy-wahl">';
      // Die Karte bleibt hier stehen, also braucht die Quittung einen anderen
      // Traeger: Der gewaehlte Knopf gibt einmal kurz nach und kommt zurueck.
      var pop = function (iso) { return t.pop === iso ? " gerade-gewaehlt" : ""; };
      h += tidyKnopf("data-tidy-datum", TODAY_ISO, "Heute", (node.due === TODAY_ISO ? "gewaehlt" : "") + pop(TODAY_ISO));
      h += tidyKnopf("data-tidy-datum", morgen, "Morgen", (node.due === morgen ? "gewaehlt" : "") + pop(morgen));
      var eigenes = node.due && node.due !== TODAY_ISO && node.due !== morgen;
      // pop() nur, wenn dieser Knopf den Wert auch traegt: Sonst quittierte
      // "Datum waehlen" die Wahl von "Heute" gleich mit.
      h += '<button class="tidy-btn' + (eigenes ? " gewaehlt" + pop(node.due) : " leise" + (node.due ? "" : pop(null))) + '" type="button" data-tidy="kalender">' +
           svgCalendar() + "<span>" + (eigenes ? formatDue(node.due) : "Datum wählen") + "</span></button>";
      h += "</div>";
      if (t.kalender) h += kalender(node).replace('class="due-cal"', 'class="due-cal tidy-cal"');

      h += "</div>";   // .tidy-card

      // "Erledigt" steht AUSSERHALB der Karte, aber INNERHALB des Bereichs:
      // unten am Rand statt als vierte Rubrik unter den Einordnungen. Es
      // fliegt deshalb auch nicht mit der Karte weg - es loest die Bewegung
      // aus, es ist nicht Teil von ihr.
      h += '<div class="tidy-abschluss">' +
           '<button class="tidy-erledigt" type="button" data-tidy="erledigt">' +
           svgHakenGross() + "Erledigt</button></div>";
      h += "</div>";   // .tidy-body

      h += '<div class="tidy-fuss">';
      h += '<button class="tidy-fuss-btn" type="button" data-tidy="zurueck"' +
           (t.verlauf.length ? "" : " disabled") + ">" + svgChevronLeft() + "Zurück</button>";
      h += '<button class="tidy-fuss-btn weiter" type="button" data-tidy="spaeter">Später' + svgChevronRight() + "</button>";
      h += "</div>";
    } else {
      h += '<div class="tidy-body">' + tidyAbschluss() + "</div>";
      h += '<div class="tidy-fuss">';
      h += '<button class="tidy-fuss-btn" type="button" data-tidy="zurueck"' +
           (t.verlauf.length ? "" : " disabled") + ">" + svgChevronLeft() + "Zurück</button>";
      h += '<button class="tidy-fuss-btn weiter" type="button" data-tidy="quit">Fertig' + svgChevronRight() + "</button>";
      h += "</div>";
    }

    h += "</div>";

    // Beide Kennzeichen sind Einmal-Zeichen: Sie loesen genau eine Bewegung
    // aus und duerfen den naechsten Aufbau nicht noch einmal anstossen.
    t.einflug = null;
    t.rollt = false;
    t.pop = undefined;
    return h;
  }

  // Kein Verschwinden, sondern ein eigener Zustand mit der Bilanz des
  // Durchgangs. Wer etwas liegen gelassen hat, sieht das auch - ohne Tadel,
  // als Zahl.
  function tidyAbschluss() {
    var t = state.tidy;
    var eingang = findList(INBOX_ID);
    var nochOffen = eingang.tasks.filter(function (x) { return !x.done; }).length;
    var entschieden = t.queue.length - t.spaeter;

    var h = '<div class="tidy-ende">';
    h += '<span class="tidy-ende-mark">' + svgInboxGross() + "</span>";
    h += '<div class="tidy-ende-titel">' + (nochOffen === 0 ? "Eingang leer" : "Durchgang beendet") + "</div>";
    h += '<div class="tidy-ende-zahl">' + entschieden + " von " + t.queue.length +
         (entschieden === 1 ? " Aufgabe" : " Aufgaben") + " entschieden</div>";

    h += '<div class="tidy-ende-bilanz">';
    for (var i = 0; i < lists.length; i++) {
      var n = t.proListe[lists[i].id];
      if (!n) continue;
      h += '<div class="tidy-ende-zeile"><span class="list-dot" style="background:' + lists[i].color + '"></span>' +
           "<b>" + n + "</b> in " + escapeHtml(lists[i].name) + "</div>";
    }
    if (t.erledigt) h += '<div class="tidy-ende-zeile"><b>' + t.erledigt + "</b> gleich erledigt</div>";
    if (t.spaeter) h += '<div class="tidy-ende-zeile"><b>' + t.spaeter + "</b> bleiben im Eingang</div>";
    if (!t.queue.length) h += '<div class="tidy-ende-zeile">Hier lag nichts an.</div>';
    h += "</div></div>";
    return h;
  }

  function segButton(node, iso, text) {
    var aktiv = node.due === iso;
    return '<button class="due-seg-btn' + (aktiv ? " active" : "") + '" type="button"' +
           ' aria-pressed="' + (aktiv ? "true" : "false") + '"' +
           ' data-set-due="' + node.id + '" data-due-value="' + iso + '">' + text + "</button>";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; });
  }

  function svgCheck() { return '<svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-5.5" stroke="currentColor" stroke-width="1.39" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgPlus() { return '<svg width="14" height="14" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.16" stroke-linecap="round"/></svg>'; }
  function svgFolderPlus() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M1.5 4.2c0-.55.45-1 1-1h2.7l1.1 1.3H12c.55 0 1 .45 1 1V11c0 .55-.45 1-1 1H2.5c-.55 0-1-.45-1-1V4.2z" stroke="currentColor" stroke-width="1.34" stroke-linejoin="round"/><path d="M7.5 7v3.2M5.9 8.6h3.2" stroke="currentColor" stroke-width="1.34" stroke-linecap="round"/></svg>'; }
  function svgImg() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.34"/><circle cx="5" cy="6" r="1" fill="currentColor"/><path d="M2 11l3.5-3.5L8 10l2-2 3 3" stroke="currentColor" stroke-width="1.34" stroke-linejoin="round"/></svg>'; }
  function svgClose() { return '<svg width="14" height="14" viewBox="0 0 13 13" fill="none"><path d="M1 1l11 11M12 1L1 12" stroke="currentColor" stroke-width="1.16" stroke-linecap="round"/></svg>'; }
  // Ablagekorb. Strichstaerke 1,25 bei viewBox 15 und 15px Anzeige.
  function svgInbox() { return '<svg class="nav-icon" viewBox="0 0 15 15" fill="none"><path d="M1.5 8.6h3.3l.9 1.7h3.6l.9-1.7h3.3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.4 2.4h8.2l1.9 6.2v3.1c0 .6-.5 1.1-1.1 1.1H2.6c-.6 0-1.1-.5-1.1-1.1V8.6l1.9-6.2z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg>'; }

  function svgChevronDown() { return '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 3.5l3.5 3 3.5-3" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  // Effektive Strichstärke 1,25px: 1.34 × (14 ÷ 15). Siehe docs/spec.md, Icons.
  function svgChevronLeft() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M9.2 3.5l-4 4 4 4" stroke="currentColor" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgChevronRight() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M5.8 3.5l4 4-4 4" stroke="currentColor" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

  // Every part is drawn symmetrically about x = 6.5 so the icon sits dead
  // centre in its button. The can body used to run 3.5 - 10.5, i.e. centred
  // on 7.0, while the lid ran 2.5 - 10.5 (centred on 6.5). The icon's
  // overall bounding box still measured as centred, because the lid sets
  // its extents - but the body carries the visual mass, so the icon read as
  // pushed to the right. The body keeps its width and is simply moved onto
  // the centre line.
  // viewBox y is offset by 0.25 because the drawing spans y 1 - 12.5, so its
  // vertical centre is 6.75 rather than the viewBox's own 6.5.
  // Neu gezeichnet mit ausgewogeneren Proportionen: das alte Motiv war
  // 8,6 x 12,4px, also Verhaeltnis 0,70 - im quadratischen Knopf wirkte es
  // schmal und hochkant. Jetzt rund 10 x 11,2 (0,89), alle Teile symmetrisch
  // um x = 7,5. Strichstaerke 1,34 ergibt bei 14px die einheitlichen 1,25px.
  function svgTrash() {
    return '<svg width="14" height="14" viewBox="0 -0.1 15 15" fill="none" stroke="currentColor" stroke-width="1.34" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M2.5 4h10"/>' +                                        // Deckel: 2,5 - 12,5
      '<path d="M5.8 4V2.8a1 1 0 011-1h1.4a1 1 0 011 1V4"/>' +        // Griff:  5,8 - 9,2
      '<path d="M3.6 4l.7 8a1.1 1.1 0 001.1 1h4.2a1.1 1.1 0 001.1-1l.7-8"/>' + // Korpus: 3,6 - 11,4
      "</svg>";
  }

  function renderTaskRow(node, colIndex, listBadge, deleteCtx) {
    var prog = progress(node);
    var html = '<div class="task-row' + (node.done ? " done" : "") + '" data-open-task="' + node.id + '" data-col-index="' + colIndex + '">';
    html += '<button class="check-btn' + (node.done ? " done" : "") + '" data-check="' + node.id + '" role="checkbox" aria-checked="' + node.done + '" aria-label="Als erledigt markieren">' + svgCheck() + "</button>";
    if (listBadge) html += '<span class="list-dot" style="background:' + listBadge.color + '" title="' + escapeHtml(listBadge.name) + '"></span>';
    html += '<span class="task-title">' + escapeHtml(node.title) + "</span>";
    if (prog) {
      // Derselbe Mechanismus wie beim Balken des Aufraeum-Modus: Der Balken
      // wird mit dem ALTEN Anteil aufgebaut und erst im naechsten Bild auf
      // den neuen gesetzt (miniBalkenLauf). Sonst laeuft nie eine Animation -
      // renderColumns() erzeugt die Zeile bei jeder Aenderung neu, und ein
      // frisches Element hat keinen Vorzustand, von dem aus ein transition
      // laufen koennte.
      var anteil = prog.done / prog.total;
      var vorher = typeof fortschrittAlt[node.id] === "number" ? fortschrittAlt[node.id] : anteil;
      fortschrittAlt[node.id] = anteil;
      html += '<span class="mini-progress" title="' + prog.done + " von " + prog.total + ' erledigt">' +
              '<span data-balken-ziel="' + anteil.toFixed(4) + '" style="transform: scaleX(' + vorher.toFixed(4) + ')"></span></span>';
    }
    if (node.due) {
      html += deleteCtx
        ? '<button class="due-pill' + duePillClass(node) + ' row-due-pill" data-cal-row="' + node.id + '" title="Datum ändern">' + formatDue(node.due) + "</button>"
        : '<span class="due-pill' + duePillClass(node) + '">' + formatDue(node.due) + "</span>";
    }
    // Ein Steuerelement statt dreier: Ohne Datum ein Kalendersymbol beim
    // Ueberfahren, mit Datum ist die Pille selbst der Knopf. Drei Knoepfe
    // neben einer Pille, die dasselbe Datum schon nennt, machen die Zeile
    // voll und doppeln die Information.
    if (deleteCtx && !node.due) {
      html += '<button class="row-due-cal" data-cal-row="' + node.id + '" aria-label="Datum wählen" title="Datum wählen">' + svgCalendar() + "</button>";
    }
    if (deleteCtx) html += '<button class="row-delete" data-delete-owner="' + deleteCtx.ownerId + '" data-delete-block="' + node.id + '" data-delete-kind="task" aria-label="Aufgabe löschen">' + svgTrash() + "</button>";
    html += "</div>";
    return html;
  }

  function ownerAt(colIndex) {
    if (colIndex === 0) return state.view === "list" ? findList(state.currentListId) : null;
    return findTaskGlobal(state.panelStack[colIndex - 1]);
  }

  // --- Free-form page editor: renders owner.blocks as a live contenteditable
  // document instead of a fixed block list, so text can be typed anywhere
  // and tasks/images inserted at the cursor.

  function svgGrip() { return '<svg width="8" height="13" viewBox="0 0 8 13" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2.5" r="1.1"/><circle cx="6" cy="2.5" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="6" cy="6.5" r="1.1"/><circle cx="2" cy="10.5" r="1.1"/><circle cx="6" cy="10.5" r="1.1"/></svg>'; }

  function embedGripNode() {
    var grip = document.createElement("span");
    grip.className = "embed-grip";
    grip.setAttribute("data-embed-grip", "");
    grip.setAttribute("aria-label", "Zum Verschieben ziehen");
    grip.setAttribute("title", "Zum Verschieben ziehen");
    grip.innerHTML = svgGrip();
    return grip;
  }

  function makeInlineTaskNode(node, colIndex, ownerId) {
    var tmp = document.createElement("div");
    tmp.innerHTML = renderTaskRow(node, colIndex, null, { ownerId: ownerId });
    var wrap = document.createElement("div");
    wrap.className = "inline-embed";
    wrap.contentEditable = "false";
    wrap.setAttribute("data-embed-marker", "task:" + node.id);
    wrap.appendChild(embedGripNode());
    wrap.appendChild(tmp.firstElementChild);
    return wrap;
  }

  // Die Zeile, die an der Stelle des Geloeschten stehen bleibt. Bewusst ein
  // Embed wie Aufgabe und Bild: Dann traegt sie die Blockliste an genau der
  // richtigen Position, ohne dass es dafuer eine zweite Mechanik braucht.
  // Keinen Ziehgriff - was gerade verschwindet, sortiert man nicht um.
  function makeUndoNode(block, ownerId) {
    var wrap = document.createElement("div");
    wrap.className = "inline-embed";
    wrap.contentEditable = "false";
    wrap.setAttribute("data-embed-marker", "undo:" + block.id);
    wrap.innerHTML = '<div class="undo-row">' +
      '<span class="undo-row-name">' + escapeHtml(block.label || "Aufgabe") + "</span>" +
      '<span class="undo-row-meta">· gelöscht</span>' +
      '<button class="undo-btn" data-undo="' + block.id + '" data-undo-owner="' + ownerId + '">Rückgängig</button>' +
      "</div>";
    return wrap;
  }

  function makeInlineImageNode(block, ownerId) {
    var wrap = document.createElement("div");
    wrap.className = "inline-embed";
    wrap.contentEditable = "false";
    wrap.setAttribute("data-embed-marker", "image:" + block.id);
    wrap.innerHTML = '<div class="block-image">' + svgImg() + "<span>" + escapeHtml(block.caption || "Bild") + ' · Platzhalter</span></div><button class="row-delete" data-delete-owner="' + ownerId + '" data-delete-block="' + block.id + '" data-delete-kind="image" aria-label="Bild löschen">' + svgTrash() + "</button>";
    wrap.insertBefore(embedGripNode(), wrap.firstChild);
    return wrap;
  }

  // --- Block model -----------------------------------------------------
  // A page is an ordered list of blocks, and a paragraph is a block in its
  // own right - not loose text sitting between blocks. Every top-level child
  // of the editor is therefore either an .inline-embed (task/image) or a
  // .pe-line (paragraph). This mirrors how Superlist's own editor models a
  // document (github.com/superlistapp/super_editor: an ordered list of
  // discrete nodes - paragraph, task, image - each with its own id).
  //
  // The previous model kept paragraphs as bare text nodes and read the page
  // back with innerText. That could not represent a caret position between
  // two adjacent tasks, an empty line, or a line break that survives a
  // re-render, and pressing Enter let the browser wrap following blocks into
  // the new <div> it created, swallowing tasks into a paragraph.

  function makeLineNode(text, kind) {
    var line = document.createElement("div");
    line.className = "pe-line" + (kind === "heading" ? " pe-h" : "");
    if (text) line.appendChild(document.createTextNode(text));
    else line.appendChild(document.createElement("br"));
    return line;
  }

  function makeDividerNode() {
    var d = document.createElement("div");
    d.className = "pe-divider";
    d.contentEditable = "false";
    d.setAttribute("data-divider", "");
    return d;
  }

  function isEmbed(n) { return n && n.nodeType === 1 && n.classList && n.classList.contains("inline-embed"); }
  function isDivider(n) { return n && n.nodeType === 1 && n.classList && n.classList.contains("pe-divider"); }
  // Alles, was keine Schreibposition bietet und deshalb einen Absatz daneben
  // braucht: Aufgaben, Bilder und Trenner.
  function isSolidBlock(n) { return isEmbed(n) || isDivider(n); }
  function isHeading(n) { return n && n.nodeType === 1 && n.classList && n.classList.contains("pe-h"); }

  function buildEditorDOM(owner, colIndex) {
    var el = document.createElement("div");
    el.className = "page-editor";
    el.contentEditable = "true";
    el.setAttribute("data-editor-for", owner.id);
    el.setAttribute("data-editor-col", colIndex);
    el.setAttribute("data-placeholder", "Schreib einfach los …");
    var kids = childrenOf(owner);
    for (var i = 0; i < owner.blocks.length; i++) {
      var b = owner.blocks[i];
      if (b.type === "text") {
        // Legacy blocks may still carry embedded newlines; each becomes a line.
        var linesOfText = String(b.text).split("\n");
        for (var li = 0; li < linesOfText.length; li++) el.appendChild(makeLineNode(linesOfText[li]));
      } else if (b.type === "heading") {
        el.appendChild(makeLineNode(b.text, "heading"));
      } else if (b.type === "divider") {
        el.appendChild(makeDividerNode());
      } else if (b.type === "task") {
        var child = null;
        for (var k = 0; k < kids.length; k++) { if (kids[k].id === b.id) { child = kids[k]; break; } }
        if (child) el.appendChild(makeInlineTaskNode(child, colIndex, owner.id));
      } else if (b.type === "image") {
        el.appendChild(makeInlineImageNode(b, owner.id));
      } else if (b.type === "undo") {
        el.appendChild(makeUndoNode(b, owner.id));
      }
    }
    normalizeEditor(el);
    return el;
  }

  // Restores the block model after the browser has had its way with the DOM,
  // and guarantees there is always somewhere to type: a paragraph before a
  // leading embed, between two adjacent embeds, and after a trailing one.
  // Without those, a contenteditable offers no caret position at all next to
  // a contenteditable="false" block.
  function normalizeEditor(el) {
    // 1. Flatten to a single top-level sequence of blocks, keeping document
    //    order: hoist embeds the browser nested inside a paragraph, and keep
    //    each block-level element as its own paragraph. Only inline content
    //    (text, <br>, <b>, ...) is gathered together into one paragraph -
    //    merging block elements here is what previously collapsed several
    //    typed lines into one.
    var flat = [];
    function isBlockEl(n) { return n.nodeType === 1 && (n.nodeName === "DIV" || n.nodeName === "P"); }
    function hasBlockChild(n) {
      for (var i = 0; i < n.childNodes.length; i++) { if (isBlockEl(n.childNodes[i])) return true; }
      return false;
    }
    function collect(node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      var carry = null;
      function flush() { if (carry) { flat.push(carry); carry = null; } }
      for (var i = 0; i < kids.length; i++) {
        var k = kids[i];
        if (isSolidBlock(k)) {
          flush();
          flat.push(k);
        } else if (isBlockEl(k) && ((k.querySelector && k.querySelector(".inline-embed")) || hasBlockChild(k))) {
          flush();
          collect(k);
        } else if (isBlockEl(k)) {
          flush();
          k.classList.add("pe-line");
          flat.push(k);
        } else {
          if (!carry) { carry = makeLineNode(""); carry.innerHTML = ""; }
          carry.appendChild(k);
        }
      }
      flush();
    }
    collect(el);
    el.innerHTML = "";
    for (var f = 0; f < flat.length; f++) el.appendChild(flat[f]);

    // 2. Make sure every non-embed child is a proper paragraph element.
    var kids2 = Array.prototype.slice.call(el.childNodes);
    for (var j = 0; j < kids2.length; j++) {
      var n = kids2[j];
      if (isSolidBlock(n)) continue;
      if (n.nodeType === 3) {
        var wrapped = makeLineNode(n.textContent);
        el.replaceChild(wrapped, n);
      } else if (n.nodeType === 1) {
        n.classList.add("pe-line");
        if (!n.textContent && !n.querySelector("br")) n.appendChild(document.createElement("br"));
      }
    }

    // 3. Guarantee a paragraph around every embed run.
    var kids3 = Array.prototype.slice.call(el.childNodes);
    if (!kids3.length || isSolidBlock(kids3[0])) el.insertBefore(makeLineNode(""), el.firstChild);
    var kids4 = Array.prototype.slice.call(el.childNodes);
    for (var m = 0; m < kids4.length - 1; m++) {
      if (isSolidBlock(kids4[m]) && isSolidBlock(kids4[m + 1])) el.insertBefore(makeLineNode(""), kids4[m + 1]);
    }
    if (isSolidBlock(el.lastChild)) el.appendChild(makeLineNode(""));

    // 4. Empty paragraphs that only exist to sit next to an embed collapse
    //    to a thin strip, so a run of tasks stays tight instead of being
    //    spaced out by a blank line each.
    var kids5 = Array.prototype.slice.call(el.childNodes);
    for (var q = 0; q < kids5.length; q++) {
      var line = kids5[q];
      if (isSolidBlock(line)) continue;
      var touchesEmbed = isSolidBlock(line.previousSibling) || isSolidBlock(line.nextSibling);
      var empty = line.textContent === "";
      line.classList.toggle("pe-gap", !!(empty && touchesEmbed));
      if (!empty) line.classList.remove("pe-open");
    }
  }

  // Open the collapsed gap the caret is currently in, and close the others.
  function syncGapForCaret() {
    var sel = window.getSelection();
    var active = null;
    if (sel && sel.rangeCount) {
      var n = sel.anchorNode;
      while (n && n !== document.body) {
        if (n.nodeType === 1 && n.classList && n.classList.contains("pe-gap")) { active = n; break; }
        n = n.parentNode;
      }
    }
    var gaps = document.querySelectorAll(".pe-gap.pe-open");
    for (var i = 0; i < gaps.length; i++) { if (gaps[i] !== active) gaps[i].classList.remove("pe-open"); }
    if (active) active.classList.add("pe-open");
  }

  document.addEventListener("selectionchange", syncGapForCaret);

  // Die Luecke bereits beim Druecken oeffnen, nicht erst wenn die Auswahl
  // gemeldet wird: sonst zeichnet der Browser den Cursor noch in der
  // zusammengeklappten Hoehe und er wirkt winzig gegenueber dem Text.
  // Eine zusammengeklappte Luecke ist 0px hoch - der Browser kann sie also
  // gar nicht treffen, und ein CSS-Klickstreifen wuerde vom overflow der
  // Nachbarbloecke abgeschnitten. Deshalb hier selbst pruefen, ob der Klick
  // dicht genug an einer Blockgrenze liegt.
  function gapNearPoint(editor, x, y) {
    var gaps = editor.querySelectorAll(".pe-gap:not(.pe-open)");
    for (var i = 0; i < gaps.length; i++) {
      var r = gaps[i].getBoundingClientRect();
      if (Math.abs(y - r.top) <= 5 && x >= r.left && x <= r.right) return gaps[i];
    }
    return null;
  }

  document.addEventListener("pointerdown", function (e) {
    if (!e.target.closest) return;
    var ed = e.target.closest(".page-editor");
    var gap = e.target.closest(".pe-gap") || (ed && gapNearPoint(ed, e.clientX, e.clientY));
    if (!gap) return;
    gap.classList.add("pe-open");
    // Die Zeile war bis eben 0px hoch; die Trefferpruefung des Browsers
    // wuerde den Cursor dort nicht zuverlaessig setzen. Also selbst setzen,
    // aber erst nachdem der Browser seine eigene Behandlung erledigt hat -
    // sonst ueberschreibt er die Auswahl gleich wieder.
    var editor = gap.closest(".page-editor");
    setTimeout(function () {
      if (editor) editor.focus();
      var r = document.createRange();
      r.selectNodeContents(gap);
      r.collapse(true);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }, 0);
  }, true);

  // --- Auswahl-Leiste ---------------------------------------------------
  // Erscheint nur, wenn wirklich Text markiert ist, und verschwindet sonst.
  // Bewusst keine dauerhafte Formatierungsleiste: Die kostet Platz und Ruhe,
  // auch wenn man sie nie braucht. Auf Mobile bringt super_editor eine
  // gleichwertige Popover-Leiste bereits mit.

  var selBarEl = null;

  function hideSelBar() {
    if (selBarEl) { selBarEl.remove(); selBarEl = null; }
  }

  function showSelBar(rect) {
    if (!selBarEl) {
      selBarEl = document.createElement("div");
      selBarEl.className = "sel-bar";
      selBarEl.setAttribute("data-sel-bar", "");
      selBarEl.innerHTML =
        '<button class="sel-btn b" data-fmt="bold" title="Fett (Strg+B)">B</button>' +
        '<button class="sel-btn i" data-fmt="italic" title="Kursiv (Strg+I)">I</button>' +
        '<button class="sel-btn s" data-fmt="strikeThrough" title="Durchgestrichen">S</button>' +
        '<span class="sel-sep"></span>' +
        '<button class="sel-btn" data-fmt="link" title="Link einfügen">Link</button>';
      document.body.appendChild(selBarEl);
    }
    var w = selBarEl.offsetWidth || 150;
    var left = Math.max(8, Math.min(window.innerWidth - w - 8, rect.left + rect.width / 2 - w / 2));
    var top = rect.top - (selBarEl.offsetHeight || 33) - 8;
    if (top < 8) top = rect.bottom + 8;   // kein Platz oben: darunter zeigen
    selBarEl.style.left = left + "px";
    selBarEl.style.top = top + "px";
  }

  function syncSelBar() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) { hideSelBar(); return; }
    var range = sel.getRangeAt(0);
    var editor = range.startContainer.parentElement && range.startContainer.parentElement.closest(".page-editor");
    if (!editor || !editor.contains(range.endContainer)) { hideSelBar(); return; }
    if (!sel.toString().trim()) { hideSelBar(); return; }
    showSelBar(range.getBoundingClientRect());
  }

  document.addEventListener("selectionchange", syncSelBar);
  window.addEventListener("scroll", hideSelBar, true);

  document.addEventListener("mousedown", function (e) {
    // Klick auf Leiste oder Menü darf den Editor nicht entfokussieren.
    if (e.target.closest && e.target.closest("[data-sel-bar], [data-slash-menu]")) e.preventDefault();
  });

  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("[data-fmt]");
    if (!btn) return;
    e.preventDefault();
    var sel = window.getSelection();
    var editor = sel.rangeCount && sel.getRangeAt(0).startContainer.parentElement &&
                 sel.getRangeAt(0).startContainer.parentElement.closest(".page-editor");
    var fmt = btn.getAttribute("data-fmt");
    if (fmt === "link") {
      var url = window.prompt("Adresse des Links:", "https://");
      if (url) document.execCommand("createLink", false, url);
    } else {
      document.execCommand(fmt, false, null);
    }
    if (editor) serializeEditor(editor.getAttribute("data-editor-for"));
    syncSelBar();
  });

  // --- "/"-Blockmenü ----------------------------------------------------
  // Wird ausgelöst, sobald eine Zeile nur aus "/" besteht. Unsichtbar, bis
  // man es braucht - der Gegenentwurf zu einer Leiste voller Knöpfe.

  var slashMenuEl = null, slashLine = null, slashCol = 0;

  var SLASH_ITEMS = [
    { key: "task",    label: "Aufgabe",    hint: "- ",  icon: function () { return svgCheckboxOutline(); } },
    { key: "heading", label: "Überschrift", hint: "# ",  icon: function () { return svgHeading(); } },
    { key: "divider", label: "Trenner",     hint: "---", icon: function () { return svgDividerIcon(); } },
    { key: "image",   label: "Bild",        hint: "",    icon: function () { return svgImg(); } }
  ];

  function hideSlashMenu() {
    if (slashMenuEl) { slashMenuEl.remove(); slashMenuEl = null; }
    slashLine = null;
  }

  function showSlashMenu(line, colIndex) {
    hideSlashMenu();
    slashLine = line;
    slashCol = colIndex;
    slashMenuEl = document.createElement("div");
    slashMenuEl.className = "slash-menu";
    slashMenuEl.setAttribute("data-slash-menu", "");
    var html = "";
    for (var i = 0; i < SLASH_ITEMS.length; i++) {
      var it = SLASH_ITEMS[i];
      html += '<button class="slash-opt' + (i === 0 ? " active" : "") + '" data-slash="' + it.key + '">' +
              it.icon() + "<span>" + it.label + "</span>" +
              (it.hint ? '<span class="slash-hint">' + escapeHtml(it.hint) + "</span>" : "") +
              "</button>";
    }
    slashMenuEl.innerHTML = html;
    document.body.appendChild(slashMenuEl);
    var r = line.getBoundingClientRect();
    var top = r.bottom + 6;
    if (top + slashMenuEl.offsetHeight > window.innerHeight - 8) top = r.top - slashMenuEl.offsetHeight - 6;
    slashMenuEl.style.left = Math.min(r.left, window.innerWidth - slashMenuEl.offsetWidth - 8) + "px";
    slashMenuEl.style.top = top + "px";
  }

  // Entfernt das ausloesende "/" bzw. Kuerzel aus der Zeile.
  function clearTriggerLine(line) {
    if (!line) return;
    line.innerHTML = "";
    line.appendChild(document.createElement("br"));
  }

  function runSlashAction(key) {
    var line = slashLine, colIndex = slashCol;
    var editor = line && line.closest(".page-editor");
    hideSlashMenu();
    if (!editor) return;
    clearTriggerLine(line);
    // Cursor zurueck in die geleerte Zeile, damit der Block dort landet.
    editor.focus();
    var sel = window.getSelection();
    var r = document.createRange();
    r.selectNodeContents(line);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);

    if (key === "task") { insertTaskAt(colIndex); return; }
    if (key === "divider") { insertDividerAt(colIndex); return; }
    if (key === "heading") { setLineKindAtCaret(editor, "heading"); renderColumnsKeepingFocus(editor); return; }
    if (key === "image") {
      var owner = ownerAt(colIndex);
      if (!owner) return;
      insertEmbedInEditor(editor, makeInlineImageNode({ type: "image", id: "img" + Date.now(), caption: "Bild" }, owner.id));
      serializeEditor(owner.id);
      renderColumns();
    }
  }

  // Nach einer reinen Umformatierung nicht neu rendern - das wuerde den
  // Cursor verlieren. Nur die Sidebar-Zaehler koennen sich geaendert haben.
  function renderColumnsKeepingFocus() { renderSidebar(); }

  document.addEventListener("click", function (e) {
    var opt = e.target.closest && e.target.closest("[data-slash]");
    if (opt) { e.preventDefault(); runSlashAction(opt.getAttribute("data-slash")); return; }
    if (slashMenuEl && !e.target.closest("[data-slash-menu]")) hideSlashMenu();
  });


  // --- Auslöser beim Tippen ---------------------------------------------
  // "/" auf einer leeren Zeile öffnet das Blockmenü; die Markdown-Kürzel
  // wandeln direkt um. Beides ist unsichtbar, bis man es benutzt - der
  // Gegenentwurf zu einer dauerhaften Werkzeugleiste.

  document.addEventListener("input", function (e) {
    var editor = e.target.closest && e.target.closest(".page-editor");
    if (!editor) return;
    var sel = window.getSelection();
    if (!sel.rangeCount) { hideSlashMenu(); return; }
    var line = sel.getRangeAt(0).startContainer;
    while (line && line.parentNode !== editor) line = line.parentNode;
    if (!line || isSolidBlock(line)) { hideSlashMenu(); return; }

    var colIndex = parseInt(editor.getAttribute("data-editor-col"), 10);
    var text = line.textContent;

    // Markdown-Kürzel
    if (text === "# ") {
      clearTriggerLine(line);
      var r0 = document.createRange(); r0.selectNodeContents(line); r0.collapse(true);
      sel.removeAllRanges(); sel.addRange(r0);
      setLineKindAtCaret(editor, "heading");
      hideSlashMenu();
      return;
    }
    if (text === "- " || text === "[] ") {
      slashLine = line; slashCol = colIndex;
      runSlashAction("task");
      return;
    }
    if (text === "---") {
      slashLine = line; slashCol = colIndex;
      runSlashAction("divider");
      return;
    }

    // "/"-Menü
    if (text === "/") { showSlashMenu(line, colIndex); return; }
    hideSlashMenu();
  });

  // Once a gap has been typed into it is an ordinary paragraph - drop the
  // collapsing, or it would fold back up (hiding the text) as soon as the
  // caret moved away.
  document.addEventListener("input", function (e) {
    var editor = e.target.closest && e.target.closest(".page-editor");
    if (!editor) return;
    var gaps = editor.querySelectorAll(".pe-gap");
    for (var i = 0; i < gaps.length; i++) {
      if (gaps[i].textContent !== "") gaps[i].classList.remove("pe-gap", "pe-open");
    }
  });

  function placeCaretAtEnd(el) {
    normalizeEditor(el);
    el.focus();
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // Bottom edge of the editor's actual content, ignoring the empty area the
  // editor stretches over (it is min-height: 100% of the column).
  function editorContentBottom(el) {
    var bottom = -Infinity;
    for (var i = 0; i < el.childNodes.length; i++) {
      var n = el.childNodes[i], r = null;
      if (n.nodeType === 3) {
        var rg = document.createRange();
        rg.selectNode(n);
        r = rg.getBoundingClientRect();
      } else if (n.getBoundingClientRect) {
        r = n.getBoundingClientRect();
      }
      if (r && r.height && r.bottom > bottom) bottom = r.bottom;
    }
    return bottom;
  }

  function mountEditors() {
    var slots = document.querySelectorAll("[data-editor-slot]");
    for (var i = 0; i < slots.length; i++) {
      var slot = slots[i];
      var ownerId = slot.getAttribute("data-editor-slot");
      var colIndex = parseInt(slot.getAttribute("data-editor-col"), 10);
      var owner = findList(ownerId) || findTaskGlobal(ownerId);
      if (!owner) continue;
      slot.appendChild(buildEditorDOM(owner, colIndex));
    }
  }

  function serializeEditor(ownerId) {
    var editorEl = document.querySelector('[data-editor-for="' + ownerId + '"]');
    if (!editorEl) return;
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    if (!owner) return;

    // Read the blocks straight off the DOM structure. The old approach
    // flattened the page to innerText and split it on marker characters,
    // which lost every line break and could not represent an empty line.
    normalizeEditor(editorEl);

    var newBlocks = [];
    for (var i = 0; i < editorEl.childNodes.length; i++) {
      var n = editorEl.childNodes[i];
      if (isEmbed(n)) {
        var marker = n.getAttribute("data-embed-marker") || "";
        var sep = marker.indexOf(":");
        var kind = marker.slice(0, sep);
        var mid = marker.slice(sep + 1);
        if (kind === "task") {
          newBlocks.push({ type: "task", id: mid });
        } else if (kind === "image") {
          var oldImg = owner.blocks.filter(function (b) { return b.type === "image" && b.id === mid; })[0];
          newBlocks.push({ type: "image", id: mid, caption: oldImg ? oldImg.caption : "Bild" });
        } else if (kind === "undo") {
          // Aus dem DOM allein laesst sich der gemerkte Knoten nicht
          // wiederherstellen - der alte Block wird deshalb unveraendert
          // uebernommen, wie beim Bild die Bildunterschrift.
          var oldUndo = owner.blocks.filter(function (b) { return b.type === "undo" && b.id === mid; })[0];
          if (oldUndo) newBlocks.push(oldUndo);
        }
      } else if (isDivider(n)) {
        newBlocks.push({ type: "divider" });
      } else if (isHeading(n)) {
        newBlocks.push({ type: "heading", text: n.textContent.replace(/\n/g, "") });
      } else {
        // A paragraph. Empty ones are kept - a blank line is real content.
        newBlocks.push({ type: "text", text: n.textContent.replace(/\n/g, "") });
      }
    }
    // Trailing blank paragraphs are structural padding added by
    // normalizeEditor, not content - drop them so they cannot pile up.
    while (newBlocks.length) {
      var lastB = newBlocks[newBlocks.length - 1];
      if (lastB.type === "text" && lastB.text === "") newBlocks.pop(); else break;
    }

    var oldTaskIds = owner.blocks.filter(function (b) { return b.type === "task"; }).map(function (b) { return b.id; });
    var newTaskIds = newBlocks.filter(function (b) { return b.type === "task"; }).map(function (b) { return b.id; });
    var removedAncestorUpdateNeeded = owner.subtasks ? true : false;
    for (var t = 0; t < oldTaskIds.length; t++) {
      if (newTaskIds.indexOf(oldTaskIds[t]) === -1) {
        var kids2 = childrenOf(owner);
        var ki = kids2.findIndex(function (k) { return k.id === oldTaskIds[t]; });
        if (ki >= 0) kids2.splice(ki, 1);
        var stackIdx = state.panelStack.indexOf(oldTaskIds[t]);
        if (stackIdx >= 0) state.panelStack = state.panelStack.slice(0, stackIdx);
      }
    }

    owner.blocks = newBlocks;
    if (removedAncestorUpdateNeeded) {
      owner.done = owner.subtasks.length > 0 && owner.subtasks.every(function (s) { return s.done; });
      recomputeAncestors(owner.id);
    }
  }

  function insertEmbedInEditor(editorEl, node) {
    var sel = window.getSelection();
    var hasCursorHere = sel && sel.rangeCount > 0 && editorEl.contains(sel.anchorNode);
    var range;
    if (hasCursorHere) {
      range = sel.getRangeAt(0);
    } else {
      // not focused/positioned in this page: insert at the very top instead of the end
      range = document.createRange();
      range.selectNodeContents(editorEl);
      range.collapse(true);
    }
    range.deleteContents();
    // An embed is a top-level block: lift it out of whatever paragraph the
    // caret happened to be in, splitting that paragraph around it.
    var host = range.startContainer;
    while (host && host.parentNode !== editorEl) host = host.parentNode;
    if (host && host !== editorEl) {
      var tail = range.cloneRange();
      tail.setEndAfter(host);
      var after = tail.extractContents();
      editorEl.insertBefore(node, host.nextSibling);
      if (after && after.textContent !== "") editorEl.insertBefore(after, node.nextSibling);
    } else {
      range.insertNode(node);
    }
    normalizeEditor(editorEl);

    // Put the caret on the paragraph right after the new block.
    var next = node.nextSibling;
    if (next) {
      var r2 = document.createRange();
      r2.selectNodeContents(next);
      r2.collapse(true);
      editorEl.focus();
      sel.removeAllRanges();
      sel.addRange(r2);
    }
  }

  // --- Blöcke an der Cursorposition einfügen -----------------------------
  // Gemeinsamer Weg für das "/"-Menü und die Markdown-Kürzel.

  function insertTaskAt(colIndex, opts) {
    var owner = ownerAt(colIndex);
    if (!owner) return null;
    var editorEl = document.querySelector('[data-editor-for="' + owner.id + '"]');
    var t = task((opts && opts.title) || "Neue Aufgabe");
    childrenOf(owner).push(t);
    if (owner.subtasks) { owner.done = false; recomputeAncestors(owner.id); }
    if (editorEl) {
      insertEmbedInEditor(editorEl, makeInlineTaskNode(t, colIndex, owner.id));
      serializeEditor(owner.id);
    } else {
      owner.blocks.push({ type: "task", id: t.id });
    }
    // Eine neue Aufgabe öffnet ihre Seite gleich mit - sie ist ja selbst eine.
    if (!opts || opts.open !== false) state.panelStack = state.panelStack.slice(0, colIndex).concat([t.id]);
    renderAll();
    return t;
  }

  function insertDividerAt(colIndex) {
    var owner = ownerAt(colIndex);
    var editorEl = owner && document.querySelector('[data-editor-for="' + owner.id + '"]');
    if (!editorEl) return;
    insertEmbedInEditor(editorEl, makeDividerNode());
    serializeEditor(owner.id);
    renderColumns();
  }

  // Wandelt den Absatz, in dem der Cursor steht, in eine Überschrift um
  // (oder zurück). Der Text bleibt erhalten.
  function setLineKindAtCaret(editorEl, kind) {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var host = sel.getRangeAt(0).startContainer;
    while (host && host.parentNode !== editorEl) host = host.parentNode;
    if (!host || isSolidBlock(host)) return;
    host.classList.toggle("pe-h", kind === "heading");
    // Erst speichern, dann den Cursor setzen: serializeEditor ruft
    // normalizeEditor, das den Editor-Inhalt neu zusammensetzt und dabei
    // jede bestehende Auswahl verwirft. Die Knoten selbst überleben, also
    // lässt sich der Cursor danach wieder auf dieselbe Zeile setzen.
    serializeEditor(editorEl.getAttribute("data-editor-for"));
    editorEl.focus();
    var r = document.createRange();
    r.selectNodeContents(host);
    r.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r);
  }

  var prevPanelStack = [];

  // --- Was ein Neuaufbau NICHT kosten darf: Scrollstand und Fokus ---------
  //
  // renderColumns() ersetzt den Inhaltsbereich in einem Stueck. Damit gehen
  // zwei Dinge verloren, die der Nutzer selbst eingestellt hat: wie weit er
  // gescrollt hat und wo sein Cursor steht. Beim Abhaken einer Aufgabe in
  // einer langen Liste sprang die Ansicht deshalb nach ganz oben - genau
  // das, was sich wie ein "Refresh" anfuehlt (gemeldet 2026-08-12).
  //
  // Beides wird vor dem Aufbau gemerkt und danach zurueckgesetzt. Der
  // Schluessel ist der data-col-key der Spalte bzw. das eindeutige
  // data-Attribut des Eingabefelds - eine Positionsnummer wuerde beim
  // Oeffnen oder Schliessen einer Spalte auf die falsche zeigen.
  function zustandMerken(el) {
    var stand = { scroll: {}, fokus: null };
    var cols = el.querySelectorAll(".column[data-col-key]");
    for (var i = 0; i < cols.length; i++) {
      var b = cols[i].querySelector(".blocks");
      if (b && b.scrollTop) stand.scroll[cols[i].getAttribute("data-col-key")] = b.scrollTop;
    }
    var a = document.activeElement;
    if (a && a.tagName === "INPUT" && el.contains(a)) {
      var attr = ["data-list-title-for", "data-title-for", "data-quick-add"];
      for (var k = 0; k < attr.length; k++) {
        if (a.hasAttribute(attr[k])) {
          stand.fokus = {
            wahl: "[" + attr[k] + '="' + a.getAttribute(attr[k]) + '"]',
            von: a.selectionStart, bis: a.selectionEnd
          };
          break;
        }
      }
    }
    return stand;
  }

  function zustandZurueck(el, stand) {
    for (var key in stand.scroll) {
      var col = el.querySelector('.column[data-col-key="' + key + '"]');
      var b = col && col.querySelector(".blocks");
      if (b) b.scrollTop = stand.scroll[key];
    }
    if (stand.fokus) {
      var feld = el.querySelector(stand.fokus.wahl);
      if (feld) {
        feld.focus();
        // Die Einfuegemarke muss mit: Ein Feld, das den Fokus behaelt, aber
        // den Cursor ans Ende springen laesst, ist beim Tippen schlimmer als
        // gar kein Fokus.
        try { feld.setSelectionRange(stand.fokus.von, stand.fokus.bis); } catch (e) {}
      }
    }
  }

  function renderColumns() {
    var el = document.getElementById("contentArea");
    var html = "";
    var newlyOpened = state.panelStack.filter(function (id) { return prevPanelStack.indexOf(id) === -1; });
    var oldScrollLeft = el.scrollLeft;

    var standVorher = zustandMerken(el);
    var beforeRects = {};
    var prevCols = el.querySelectorAll(".column[data-col-key]");
    for (var bi = 0; bi < prevCols.length; bi++) {
      var pr = prevCols[bi].getBoundingClientRect();
      beforeRects[prevCols[bi].getAttribute("data-col-key")] = { left: pr.left, width: pr.width };
    }

    if (state.view === "today") {
      var d = new Date(TODAY_ISO + "T00:00:00");
      var weekdays = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
      var months = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
      html += '<div class="column" data-col-index="0" data-col-key="today"><div class="col-inner">';
      html += '<div class="col-header"><div class="col-header-top"><h2 class="col-title">Heute</h2></div>';
      html += '<div class="col-meta">' + weekdays[d.getDay()] + ", " + d.getDate() + ". " + months[d.getMonth()] + "</div></div>";
      html += '<div class="blocks">';
      var items = collectToday();
      if (!items.length) {
        html += '<div class="empty-state"><span class="empty-mark">' + svgLogo() + "</span>" +
               "<span>Nichts für heute.</span>" +
               '<span class="empty-sub">Und nichts liegengeblieben.</span></div>';
      } else {
        // Überfälliges bekommt einen eigenen Abschnitt ganz oben. Es geht ja
        // gerade darum, dass Liegengebliebenes auffällt statt sich unter den
        // Listen zu verteilen. Die Herkunftsliste steht als Punkt an der Zeile.
        var overdue = items.filter(function (it) { return it.overdue; });
        var todayItems = items.filter(function (it) { return !it.overdue; });

        if (overdue.length) {
          html += '<div class="group-heading overdue-heading">Überfällig · ' + overdue.length + "</div>";
          for (var o = 0; o < overdue.length; o++) {
            html += '<div class="block">' + renderTaskRow(overdue[o].node, 0, overdue[o].list) + "</div>";
          }
        }

        var byList = {}, order = [];
        for (var i = 0; i < todayItems.length; i++) {
          var it = todayItems[i];
          if (!byList[it.list.id]) { byList[it.list.id] = []; order.push(it.list); }
          byList[it.list.id].push(it);
        }
        if (order.length && overdue.length) html += '<div class="group-heading">Heute fällig</div>';
        for (var j = 0; j < order.length; j++) {
          var l = order[j];
          html += '<div class="group-heading"><span class="nav-dot" style="background:' + l.color + '"></span>' + escapeHtml(l.name) + "</div>";
          var group = byList[l.id];
          for (var k = 0; k < group.length; k++) { html += '<div class="block">' + renderTaskRow(group[k].node, 0, null) + "</div>"; }
        }
      }
      html += "</div></div></div>";
    } else {
      var list = findList(state.currentListId);
      var c = countAll(list.tasks);
      html += '<div class="column" data-col-index="0" data-col-key="list:' + list.id + '"><div class="col-inner">';

      // Der Aufraeum-Modus tauscht den INHALT der Spalte aus, nicht das
      // Fenster. Spaltenrahmen, Sidebar und Fensterrahmen bleiben stehen
      // (docs/spec.md 2.8).
      if (state.tidy && list.id === INBOX_ID) {
        html += renderTidy() + "</div></div>";
        el.innerHTML = html;
        zustandZurueck(el, standVorher);
        einblendenNurNeu();
        balkenLaufen();
        sizeColumns();
        el.scrollLeft = 0;
        prevPanelStack = state.panelStack.slice();
        return;
      }
      // Kein Aufklappmenü am Titel: Umbenennen geschieht durch Hineinklicken
      // und Tippen, die Farbe über den Punkt links daneben. Verschieben und
      // Löschen gibt es bereits in der Sidebar (Ziehen bzw. Papierkorb) und
      // bekommen deshalb keinen zweiten Weg.
      //
      // Der Eingang ist davon ausgenommen: Er hat keine Farbe zu waehlen und
      // keinen Namen zu aendern - er ist ein Ort, keine Liste des Nutzers.
      var istEingang = list.id === INBOX_ID;
      html += '<div class="col-header"><div class="col-header-top">';
      if (istEingang) {
        html += '<h2 class="col-title">' + escapeHtml(list.name) + "</h2>";
        // Der Einstieg in den Aufraeum-Modus steht dort, wo aufgeraeumt wird,
        // und nur dann, wenn es etwas aufzuraeumen gibt. Ein Knopf, der auf
        // einen leeren Eingang zeigt, waere eine Aufforderung ins Leere.
        var zuTun = list.tasks.filter(function (x) { return !x.done; }).length;
        if (zuTun) {
          html += '<button class="tidy-start" type="button" data-tidy="start" title="Eingang durchgehen">' +
                  svgBesen() + "Aufräumen</button>";
        }
      } else {
        html += '<button class="col-dot" data-color-for="' + list.id + '" style="background:' + list.color + '"' +
                ' aria-label="Farbe der Liste ändern" title="Farbe ändern"></button>';
        html += '<input class="col-title" value="' + escapeHtml(list.name) + '" data-list-title-for="' + list.id + '" aria-label="Listenname" />';
      }
      html += "</div>";
      if (!istEingang && state.colorPickFor === list.id) {
        html += '<div class="color-strip" data-neu-schluessel="farbe:' + list.id + '" role="group" aria-label="Listenfarbe">';
        for (var ci = 0; ci < LIST_COLORS.length; ci++) {
          var lc = LIST_COLORS[ci];
          html += '<button class="color-swatch' + (list.color === lc.token ? " active" : "") + '"' +
                  ' style="background:' + lc.token + '" data-set-color="' + list.id + '"' +
                  ' data-color-value="' + lc.token + '" title="' + lc.name + '" aria-label="' + lc.name + '"></button>';
        }
        html += "</div>";
      }
      html += '<div class="col-meta">' + (c.total - c.done) + " offen · " + c.done + " von " + c.total + " erledigt</div></div>";
      html += '<div class="blocks"><div data-editor-slot="' + list.id + '" data-editor-col="0"></div></div>';
      // Im Eingang keine Bild-Leiste: Er dient dem schnellen Erfassen, nicht
      // dem Gestalten einer Seite. Das Erfassungsfeld bleibt unten.
      if (!istEingang) {
        html += '<div class="editor-toolbar"><button class="insert-btn" data-insert-image-at="0">' + svgPlus() + " Bild</button></div>";
      }
      html += '<div class="quick-add"><span style="display:flex">' + svgPlus() + '</span><input type="text" placeholder="' + (istEingang ? "Was ist zu tun?" : "Aufgabe hinzufügen …") + '" data-quick-add="0" autocomplete="off" /></div>';
      html += "</div></div>";
    }

    // panel columns
    for (var p = 0; p < state.panelStack.length; p++) {
      var colIndex = p + 1;
      var node = findTaskGlobal(state.panelStack[p]);
      if (!node) continue;
      html += '<div class="column" data-col-index="' + colIndex + '" data-col-key="task:' + node.id + '"><div class="col-inner">';
      html += '<div class="col-header"><div class="col-header-top">';
      html += '<input class="col-title' + (node.done ? " done" : "") + '" value="' + escapeHtml(node.title) + '" data-title-for="' + node.id + '" />';
      html += '<button class="col-close" data-close-col="' + colIndex + '" aria-label="Seite schließen">' + svgClose() + "</button>";
      html += "</div>";
      html += '<div class="col-progress-row">' + dueControl(node) + "</div>";
      html += "</div>";
      html += '<div class="blocks"><div data-editor-slot="' + node.id + '" data-editor-col="' + colIndex + '"></div></div>';
      html += '<div class="editor-toolbar"><button class="insert-btn" data-insert-image-at="' + colIndex + '">' + svgPlus() + " Bild</button></div>";
      html += '<div class="quick-add"><span style="display:flex">' + svgPlus() + '</span><input type="text" placeholder="Unteraufgabe hinzufügen …" data-quick-add="' + colIndex + '" autocomplete="off" /></div>';
      html += "</div></div>";
    }

    el.innerHTML = html;
    mountEditors();
    zustandZurueck(el, standVorher);
    einblendenNurNeu();
    balkenLaufen();
    sizeColumns();
    // Erst nach mountEditors: Vorher gibt es die Zeile noch nicht, an der
    // der Kalender ausgerichtet wird.
    placeRowCalendar();
    el.scrollLeft = Math.max(0, el.scrollWidth - contentAreaWidth());
    animateColumnChange(el, beforeRects, newlyOpened);
    prevPanelStack = state.panelStack.slice();
  }

  // Pure-transform FLIP animator: every entry gets an inverse "from" transform
  // applied instantly (no transition), then a forced reflow, then animates to
  // "to" on the next frame. Only `transform` ever animates - layout (flex-basis,
  // scrollLeft) is always committed to its final value up front, so there is
  // no per-frame reflow during the animation itself, only compositing.
  function runFlip(el, plan, callback) {
    if (!plan.length) { if (callback) callback(); return; }
    el.classList.add("anim-lock");
    for (var i = 0; i < plan.length; i++) {
      plan[i].column.style.transform = plan[i].fromCol;
      if (plan[i].colInner) plan[i].colInner.style.transform = plan[i].fromInner || "";
    }
    void el.offsetWidth;
    requestAnimationFrame(function () {
      for (var j = 0; j < plan.length; j++) {
        var item = plan[j];
        item.column.classList.add("col-animating");
        if (item.colInner) item.colInner.classList.add("col-animating");
        item.column.style.transform = item.toCol;
        if (item.colInner) item.colInner.style.transform = item.toInner || "";
      }
      setTimeout(function () {
        for (var k = 0; k < plan.length; k++) {
          plan[k].column.classList.remove("col-animating");
          plan[k].column.style.transform = "";
          plan[k].column.style.pointerEvents = "";
          if (plan[k].colInner) { plan[k].colInner.classList.remove("col-animating"); plan[k].colInner.style.transform = ""; }
        }
        el.classList.remove("anim-lock");
        if (callback) callback();
      }, 460);
    });
  }

  function animateColumnChange(el, beforeRects, newlyOpened) {
    var appRight = document.getElementById("appWindow").getBoundingClientRect().right;
    var newKeys = newlyOpened.map(function (id) { return "task:" + id; });
    var cols = el.querySelectorAll(".column[data-col-key]");
    var plan = [];

    for (var i = 0; i < cols.length; i++) {
      var colEl = cols[i];
      var key = colEl.getAttribute("data-col-key");
      var rect = colEl.getBoundingClientRect();

      if (newKeys.indexOf(key) !== -1) {
        var startOffset = appRight - rect.left;
        plan.push({ column: colEl, colInner: null, fromCol: "translateX(" + startOffset + "px)", toCol: "translateX(0)" });
      } else if (beforeRects[key]) {
        var old = beforeRects[key];
        var deltaX = old.left - rect.left;
        var scaleRatio = old.width / rect.width;
        if (Math.abs(deltaX) > 0.5 || Math.abs(scaleRatio - 1) > 0.01) {
          plan.push({
            column: colEl,
            colInner: colEl.querySelector(".col-inner"),
            fromCol: "translateX(" + deltaX + "px) scaleX(" + scaleRatio + ")",
            toCol: "translateX(0) scaleX(1)",
            fromInner: "scaleX(" + (1 / scaleRatio) + ")",
            toInner: "scaleX(1)"
          });
        }
      }
    }

    runFlip(el, plan);
  }

  function animatePanelsClosing(fromColIndex, afterClose) {
    var el = document.getElementById("contentArea");
    var appRight = document.getElementById("appWindow").getBoundingClientRect().right;
    var cols = el.querySelectorAll(".column[data-col-key]");
    var closingEls = [], survivingEls = [];
    for (var i = 0; i < cols.length; i++) {
      var idx = parseInt(cols[i].getAttribute("data-col-index"), 10);
      if (idx >= fromColIndex) { closingEls.push(cols[i]); } else { survivingEls.push(cols[i]); }
    }
    if (!closingEls.length) { afterClose(); return; }

    var oldRects = {};
    for (var a = 0; a < cols.length; a++) {
      var r = cols[a].getBoundingClientRect();
      oldRects[cols[a].getAttribute("data-col-key")] = { left: r.left, width: r.width };
    }
