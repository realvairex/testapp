<title>Unfold — Konzept-Mockup (Desktop)</title>
<style>
  :root {
    --paper: #faf7f1;
    --surface: #ffffff;
    --surface-sunken: #eae0cc;
    --line: #ddd0af;
    --line-soft: #ece3cc;
    --ink: #293241;
    --ink-soft: #464d5b;
    --ink-faint: #5c626b;
    --accent: #ee6c4d;
    /* Akzent fuer TEXT. --accent selbst ist als Textfarbe zu hell (2,3-3,0:1);
       es bleibt Fuell-/Dekorfarbe, wo die 3:1-Schwelle fuer Nicht-Text gilt. */
    --accent-strong: #b32f10;
    --accent-ink: #ffffff;
    --accent-soft: #fce7e0;
    --accent-line: #f5bda9;
    --urgent: #b83c36;
    --urgent-soft: #fbeae8;
    --green: #3f8f62;
    --list-inbox: #a39c8c;
    --list-personal: #4fa6a0;
    --list-work: #ee6c4d;
    --list-groceries: #6e7fd1;
    --shadow-window: 0 30px 70px -25px rgba(41, 50, 65, 0.35), 0 2px 8px rgba(41, 50, 65, 0.06);
    --radius-window: 18px;
    --col-w: 276px;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --paper: #1f242e;
    --surface: #293241;
    --surface-sunken: #191d25;
    --line: #3c4454;
    --line-soft: #333a48;
    --ink: #f2ede0;
    --ink-soft: #b6aea0;
    --ink-faint: #aca492;
    --accent: #f38a6e;
    --accent-strong: #f38a6e;  /* im Dunkelmodus bereits kontraststark genug */
    --accent-ink: #1f242e;
    --accent-soft: #3a281f;
    --accent-line: #5c3d2e;
    --urgent: #e1746b;
    --urgent-soft: #3a2321;
    --green: #67b78c;
    --list-inbox: #8f8a78;
    --list-personal: #5cbdb6;
    --list-work: #f38a6e;
    --list-groceries: #8b98e8;
    --shadow-window: 0 30px 70px -25px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17161c;
      --surface: #1e1d24;
      --surface-sunken: #1a191f;
      --line: #322f3a;
      --line-soft: #29272f;
      --ink: #f2ede0;
      --ink-soft: #b6aea0;
      --ink-faint: #aca492;
      --accent: #f38a6e;
      --accent-strong: #f38a6e;
      --accent-ink: #1f242e;
      --accent-soft: #3a281f;
      --accent-line: #5c3d2e;
      --urgent: #e1746b;
      --urgent-soft: #3a2321;
      --green: #67b78c;
      --list-inbox: #8f8a78;
      --list-personal: #5cbdb6;
      --list-work: #f38a6e;
      --list-groceries: #8b98e8;
      --shadow-window: 0 30px 70px -25px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }

  .page { max-width: 1180px; margin: 0 auto; padding: 40px 24px; min-height: 100vh; display: flex; align-items: center; }

  .window-frame { display: flex; justify-content: center; width: 100%; }

  .app-window {
    width: 100%;
    max-width: 1040px;
    height: 640px;
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-window);
    box-shadow: var(--shadow-window);
    overflow: hidden;
    position: relative;
  }

  /* --- Sidebar ---
     The sidebar itself is always position:absolute and only ever animates
     `transform` (compositor-only, no reflow). A separate invisible
     `.sidebar-track` flex item reserves/releases its 248px of space so the
     content-area resizes via a plain, natively-interpolated CSS transition
     on flex-basis instead of an instant grid-template-columns snap. Both
     run concurrently with the JS column FLIP animation, started in the
     same tick, so nothing has to "wait" for the sidebar and there's no
     freeze-frame between the two. */
  .sidebar-track {
    flex: 0 0 248px;
    transition: flex-basis 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .app-window.sidebar-collapsed .sidebar-track { flex-basis: 0; }
  @media (prefers-reduced-motion: reduce) { .sidebar-track { transition: none; } }

  .sidebar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 248px; z-index: 30;
    background: var(--surface-sunken); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 18px 12px; overflow-y: auto;
    transform: translateX(0);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }

  .app-window.sidebar-collapsed .sidebar {
    transform: translateX(-100%);
    box-shadow: 14px 0 28px -14px rgba(0, 0, 0, 0.3);
  }
  .sidebar-hover-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; z-index: 25; }
  .app-window:not(.sidebar-collapsed) .sidebar-hover-zone { display: none; }
  .app-window.sidebar-collapsed:has(.sidebar-hover-zone:hover) .sidebar,
  .app-window.sidebar-collapsed .sidebar:hover {
    transform: translateX(0);
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 20px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-faint); padding: 14px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: none; background: transparent; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink); cursor: pointer; text-align: left; font-family: inherit; transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease; }
  .nav-item:hover { background: var(--line-soft); }
  .nav-item:active { transform: scale(0.97); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .nav-icon { width: 15px; height: 15px; flex-shrink: 0; color: var(--ink-soft); }
  .nav-item.active .nav-icon { color: var(--accent-strong); }
  .nav-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Centred, not right-aligned: the delete button swaps in for this number
     on hover, so the digit itself - not the box around it - has to sit on
     the button's centre line. Right-aligned text put the glyph ~4px to the
     right of that centre, which read as the two being right-edge aligned. */
  .nav-count { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-faint); min-width: 16px; text-align: center; }
  .nav-item.active .nav-count { color: var(--accent-strong); }
  .nav-item-indented { padding-left: 26px; }
  .nav-item[data-drag-type], .group-row[data-drag-type] { cursor: grab; }
  .sidebar.is-sorting .nav-item[data-drag-type], .sidebar.is-sorting .group-row[data-drag-type] { cursor: grabbing; }
  .nav-item.drag-ghost { opacity: 0.35; }

  .nav-item-wrap { position: relative; }
  .nav-item-wrap:hover .nav-count { opacity: 0; }
  /* The delete button replaces the count on hover, so the two must sit on
     exactly the same centre line - otherwise the icon appears to jump as
     the number fades out. The "Heute" row's count is the reference every
     other row is aligned to: its right edge is 23px from the sidebar edge
     and it is 16px wide, so its centre is 31px in. right: 7px puts this
     22px button on that same centre. */
  .nav-delete {
    opacity: 0; position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0; border: none; background: transparent; color: var(--ink-faint);
    cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 6px;
    transition: opacity 0.12s ease, color 0.12s ease, background-color 0.12s ease;
  }
  .nav-delete svg { flex-shrink: 0; }
  .nav-item-wrap:hover .nav-delete, .group-row:hover .nav-delete { opacity: 1; }
  .nav-delete:hover { color: var(--urgent); background: var(--urgent-soft); }

  /* padding-right matches .nav-item's, so a group's count lands on the same
     line as every other row's count (see .nav-delete above). */
  .group-row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 10px 7px 6px; border-radius: 8px; margin-top: 2px; position: relative; }
  .group-row.drag-ghost { opacity: 0.35; }
  .group-row:hover .nav-count { opacity: 0; }
  .group-chevron { width: 16px; height: 16px; flex-shrink: 0; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .group-chevron svg { transition: transform 0.15s ease; }
  .group-chevron.collapsed svg { transform: rotate(-90deg); }
  .group-title { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 12.5px; font-weight: 650; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-soft); padding: 2px; border-radius: 4px; }
  .group-title:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 1px var(--line); text-transform: none; }

  .drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .drop-after { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .drop-into { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-soft); }

  .sidebar-spacer { flex: 1; }
  .sidebar-bottom-actions { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 2px; flex-shrink: 0; }
  .icon-action-btn { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease; }
  .icon-action-btn:hover { background: var(--line-soft); color: var(--ink); border-color: var(--ink-faint); }
  .icon-action-btn:active { transform: scale(0.92); }
  .icon-action-btn.primary { width: 42px; height: 42px; border-radius: 13px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .icon-action-btn.primary svg { width: 15px; height: 15px; }
  .icon-action-btn.primary:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* --- Content: horizontal column stack --- */
  .content-area {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    height: 100%;
    background: var(--surface);
  }
  .content-area::-webkit-scrollbar { height: 8px; }
  .content-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  /* Transformed elements (the FLIP translateX/scaleX below) count toward
     their scrolling ancestor's scrollable-overflow area even though they
     don't affect real layout - during the animation a column can briefly
     report as "off to the right" and flash a scrollbar that has nothing
     real to scroll to. The final scroll position is already committed
     synchronously before the animation starts, so it's safe to just hide
     the scrollbar chrome for the animation's duration. */
  .content-area.anim-lock { overflow-x: hidden; }

  .column {
    flex: 1 1 0%;
    min-width: 240px;
    height: 100%;
    border-right: 1px solid var(--line-soft);
    scroll-snap-align: start;
    transform-origin: left center;
  }
  .col-inner {
    height: 100%;
    display: flex;
    flex-direction: column;
    transform-origin: left center;
  }
  .column.col-animating, .col-inner.col-animating {
    transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
    will-change: transform;
  }

  .col-header { padding: 18px 18px 4px; flex-shrink: 0; }
  .col-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .col-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 0; border: none; background: transparent; color: var(--ink); font-family: inherit; padding: 0; width: 100%; }
  .col-title.done { color: var(--ink-faint); text-decoration: line-through; }
  .col-title:focus { outline: none; }
  .col-meta { font-size: 12px; color: var(--ink-faint); margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* padding: 0 matters on every icon button here - a <button> carries the
     browser's default 1px 6px padding, which was squeezing these 12px-wide
     icons down to 6-10px and making them look undersized next to the
     15px nav icons. */
  .col-close { width: 22px; height: 22px; padding: 0; border-radius: 6px; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease; }
  .col-close svg { flex-shrink: 0; }
  .col-close:hover { background: var(--line-soft); color: var(--ink); }
  .col-close:active { transform: scale(0.9); }

  .col-progress-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }

  .quick-add { margin: 8px 18px 12px; display: flex; align-items: center; gap: 8px; padding: 8px 11px; background: var(--surface-sunken); border: 1px solid var(--line); border-radius: 10px; flex-shrink: 0; }
  .quick-add svg { color: var(--accent); flex-shrink: 0; }
  .quick-add input { border: none; background: transparent; outline: none; font: inherit; font-size: 13px; color: var(--ink); flex: 1; min-width: 0; }
  .quick-add input::placeholder { color: var(--ink-faint); }

  .editor-toolbar { display: flex; gap: 6px; margin: 0 18px; padding-top: 10px; border-top: 1px solid var(--line-soft); flex-shrink: 0; }
  .insert-btn { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--ink-faint); background: transparent; border: 1px dashed var(--line); border-radius: 100px; padding: 4px 10px 4px 8px; cursor: pointer; font-family: inherit; transition: color 0.15s ease, border-color 0.15s ease, transform 0.1s ease; }
  .insert-btn:hover { color: var(--ink-soft); border-color: var(--ink-faint); }
  .insert-btn:active { transform: scale(0.95); }

  .blocks { flex: 1; overflow-y: auto; padding: 4px 6px 24px; }

  .page-editor {
    min-height: 100%;
    padding: 10px 12px;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
    outline: none;
    cursor: text;
  }
  .page-editor:empty::before { content: attr(data-placeholder); color: var(--ink-faint); pointer-events: none; }
  /* A paragraph block. Every top-level child of the editor is either one of
     these or an .inline-embed - see the block model note in the JS. */
  .pe-line { min-height: 1.65em; }
  /* An empty paragraph sitting next to a task/image exists only so there is
     a caret position there - tasks would otherwise be unreachable to type
     between. Left at full line height it puts a blank line between every
     task and the list reads as loose, so it collapses to a thin strip and
     only opens up once the caret is actually in it. */
  /* Die Luecke nimmt gar keinen Platz ein, damit Aufgaben genauso dicht
     stehen wie zwei Textzeilen (die haben 0px Abstand). Getroffen wird sie
     trotzdem: ein unsichtbarer Streifen ueber der Blockgrenze faengt den
     Klick ab, und beim Druecken klappt die Zeile auf volle Hoehe auf -
     dadurch ist auch der Cursor nie kleiner als der Text. */
  .pe-line.pe-gap { min-height: 0; height: 0; overflow: hidden; }
  .pe-line.pe-gap.pe-open { height: auto; min-height: 1.65em; overflow: visible; }

  .inline-embed { position: relative; margin: 0; padding-left: 15px; animation: block-in 0.18s ease; overflow: hidden; }
  .inline-embed.drag-ghost { opacity: 0.4; }
  .inline-embed.drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .inline-embed.drop-after { box-shadow: inset 0 -2px 0 0 var(--accent); }

  /* Explicit drag handle. Dragging embeds is driven by pointer events, not
     the native HTML5 drag API: these blocks live inside a contenteditable,
     where the browser runs its own built-in drag/move behaviour for editable
     content and a long-press starts a native text-selection drag - both
     hijack the same gesture and fight any custom handler. A dedicated grip
     also keeps dragging from competing with clicking the row to open it. */
  .embed-grip {
    position: absolute; left: 0; top: 0; bottom: 0; width: 15px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); opacity: 0; cursor: grab;
    transition: opacity 0.12s ease, color 0.12s ease;
    touch-action: none; user-select: none;
  }
  .inline-embed:hover .embed-grip { opacity: 0.55; }
  .embed-grip:hover { opacity: 1 !important; color: var(--ink-soft); }
  .embed-grip:active { cursor: grabbing; }
  .page-editor.embed-dragging { cursor: grabbing; }
  .page-editor.embed-dragging .inline-embed { cursor: grabbing; }
  @keyframes block-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  .inline-embed.removing { animation: none; transition: height 0.2s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.18s ease, margin 0.2s ease; opacity: 0 !important; margin: 0 !important; }
  @media (prefers-reduced-motion: reduce) { .inline-embed { animation: none; } .inline-embed.removing { transition: opacity 0.15s ease; } }
  .removing { transition: height 0.2s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.18s ease, margin 0.2s ease; opacity: 0 !important; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .removing { transition: opacity 0.15s ease; } }

  .inline-embed .task-row { padding-right: 26px; }

  .block-image { display: flex; align-items: center; gap: 8px; padding: 14px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-faint); font-size: 12px; margin-right: 26px; }
  .block-image svg { flex-shrink: 0; }

  .row-delete { opacity: 0; width: 22px; height: 22px; padding: 0; flex-shrink: 0; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: opacity 0.12s ease, color 0.12s ease, background-color 0.12s ease, transform 0.1s ease; position: absolute; right: 2px; top: 50%; transform: translateY(-50%); }
  .row-delete svg { flex-shrink: 0; }
  .inline-embed:hover .row-delete { opacity: 1; }
  .row-delete:hover { color: var(--urgent); background: var(--urgent-soft); }
  .row-delete:active { transform: translateY(-50%) scale(0.88); }

  .page-editor.drag-over { background: var(--accent-soft); }

  .task-row { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 8px; cursor: pointer; transition: background-color 0.15s ease, transform 0.1s ease; }
  .task-row:hover { background: var(--line-soft); }
  .task-row:active { transform: scale(0.985); }

  .check-btn { width: 17px; height: 17px; flex-shrink: 0; border-radius: 6px; border: 1.5px solid var(--ink-faint); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .check-btn.done { background: var(--green); border-color: var(--green); color: #fff; }
  .check-btn:active { transform: scale(0.85); }
  .check-btn svg { opacity: 0; transform: scale(0.4); transition: opacity 0.15s ease, transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .check-btn.done svg { opacity: 1; transform: scale(1); }

  .task-title { font-size: 13.3px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.2s ease; }
  .task-row.done .task-title { color: var(--ink-faint); text-decoration: line-through; }

  .list-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .mini-progress { width: 34px; height: 5px; border-radius: 100px; background: var(--line); flex-shrink: 0; overflow: hidden; }
  .mini-progress > span { display: block; height: 100%; background: var(--accent); border-radius: 100px; transition: width 0.3s cubic-bezier(0.32, 0.72, 0, 1); }

  .due-pill { font-size: 10.5px; font-weight: 600; padding: 3px 7px; border-radius: 100px; background: var(--line-soft); color: var(--ink-soft); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .due-pill.today { background: var(--urgent-soft); color: var(--urgent); }
  /* Überfällig traegt zusaetzlich einen Rahmen: Farbe allein darf nie der
     einzige Traeger einer Information sein (Farbfehlsichtigkeit). */
  .due-pill.overdue { background: var(--urgent-soft); color: var(--urgent); box-shadow: inset 0 0 0 1px var(--urgent); }
  .group-heading.overdue-heading { color: var(--urgent); }

  /* --- Fälligkeits-Steuerung --- */
  .due-wrap { position: relative; display: inline-flex; }
  .due-trigger { border: none; font-family: inherit; cursor: pointer; }
  button.due-pill { border: none; font-family: inherit; cursor: pointer; }
  .due-add {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; color: var(--ink-faint);
    background: transparent; border: 1px dashed var(--line); border-radius: 100px;
    padding: 3px 10px 3px 8px; transition: color 0.15s ease, border-color 0.15s ease;
  }
  .due-add:hover { color: var(--ink-soft); border-color: var(--ink-faint); }
  .due-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 236px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 18px 38px -14px rgba(41, 50, 65, 0.32); padding: 5px;
    display: flex; flex-direction: column; gap: 1px;
    animation: due-menu-in 0.16s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes due-menu-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .due-opt {

  /* --- Auswahl-Leiste (erscheint über markiertem Text) --- */

  .sel-btn {

  /* --- "/"-Blockmenü --- */
  .slash-menu {

  }

  .theme-segmented { display: flex; background: var(--surface-sunken); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
  .theme-seg-btn { flex: 1; border: none; background: transparent; color: var(--ink-soft); font: inherit; font-size: 12px; font-weight: 600; padding: 6px 4px; border-radius: 7px; cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease; }
  .theme-seg-btn.active { background: var(--accent); color: var(--accent-ink); }

<div class="page">
  <div class="window-frame">
    <div class="app-window" id="appWindow">
      <div class="sidebar-track" aria-hidden="true"></div>
      <aside class="sidebar" id="sidebar"></aside>
      <div class="sidebar-hover-zone" id="sidebarHoverZone"></div>
      <div class="content-area" id="contentArea"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TODAY_ISO = "2026-08-05";
  var uid = 100;
  function nextId() { uid += 1; return "t" + uid; }

  function task(title, opts) {
    opts = opts || {};
    var t = {
      id: nextId(),
      title: title,
      done: !!opts.done,
      due: opts.due || null,
      subtasks: opts.subtasks || [],
      blocks: []
    };
    if (opts.text) t.blocks.push({ type: "text", text: opts.text });
    if (opts.image) t.blocks.push({ type: "image", id: nextId(), caption: opts.image });
    for (var i = 0; i < t.subtasks.length; i++) { t.blocks.push({ type: "task", id: t.subtasks[i].id }); }
    return t;
  }

  function makeList(id, name, color, items, intro, groupId) {
    var l = { id: id, name: name, color: color, tasks: items, blocks: [], groupId: groupId || null };
    if (intro) l.blocks.push({ type: "text", text: intro });
    for (var i = 0; i < items.length; i++) { l.blocks.push({ type: "task", id: items[i].id }); }
    return l;
  }

  var groups = [
    { id: "g1", name: "Privat" },
    { id: "g2", name: "Arbeit" }
  ];

  var lists = [
    makeList("inbox", "Inbox", "var(--list-inbox)", [
      task("Zahnarzttermin verschieben", { due: "2026-08-05" }),
      task("Rauchmelder in der Wohnung prüfen", { due: "2026-08-01" }),
      task("Podcast-Folge zu Fokusarbeit hören", { done: true })
    ]),
    makeList("personal", "Persönlich", "var(--list-personal)", [
      task("Urlaub planen", {
        text: "Zwei Wochen im September, Ziel noch offen.",
        image: "Reiseziel-Moodboard",
        subtasks: [
          task("Flüge vergleichen", {
            due: "2026-08-05",
            subtasks: [
              task("Preise auf Skyscanner checken"),
              task("Mit Anna Termine abgleichen", { done: true })
            ]
          }),
          task("Unterkunft aussuchen"),
          task("Reiseversicherung abschließen", { done: true })
        ]
      }),
      task("Laufschuhe neu kaufen", { due: "2026-08-14" })
    ], "Fokus für diese Woche: Urlaub startklar machen.", "g1"),
    makeList("work", "Redesign-Launch", "var(--list-work)", [
      task("Onboarding-Flow überarbeiten", {
        subtasks: [
          task("Wireframes im Team reviewen", { due: "2026-08-05" }),
          task("Copy für Empty-States schreiben", { due: "2026-08-03" }),
          task("Mit Design-Team abstimmen", { done: true })
        ]
      }),
      task("Launch-Checkliste finalisieren", { due: "2026-08-20" })
    ], null, "g2"),
    makeList("groceries", "Einkaufen", "var(--list-groceries)", [
      task("Hafermilch"), task("Kaffeebohnen"), task("Spülmaschinentabs", { done: true })
    ], null, "g1")
  ];

  var state = { view: "list", currentListId: "inbox", panelStack: [], collapsedGroups: {}, optionsOpen: false, dueMenuFor: null };

  function findList(id) { for (var i = 0; i < lists.length; i++) { if (lists[i].id === id) return lists[i]; } return null; }
  function findGroup(id) { for (var i = 0; i < groups.length; i++) { if (groups[i].id === id) return groups[i]; } return null; }
  function childrenOf(owner) { return owner.tasks ? owner.tasks : owner.subtasks; }

  function findTaskGlobal(id) {
    function search(nodes) {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].id === id) return nodes[i];
        var f = search(nodes[i].subtasks);
        if (f) return f;
      }
      return null;
    }
    for (var i = 0; i < lists.length; i++) { var f = search(lists[i].tasks); if (f) return f; }
    return null;
  }

  function findParentTask(id) {
    function search(nodes) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        for (var k = 0; k < n.subtasks.length; k++) { if (n.subtasks[k].id === id) return n; }
        var f = search(n.subtasks);
        if (f) return f;
      }
      return null;
    }
    for (var i = 0; i < lists.length; i++) { var f = search(lists[i].tasks); if (f) return f; }
    return null;
  }

  function setDoneCascade(node, value) {
    node.done = value;
    for (var i = 0; i < node.subtasks.length; i++) { setDoneCascade(node.subtasks[i], value); }
  }

  function recomputeAncestors(id) {
    var current = id;
    var seen = {};
    while (true) {
      // A malformed tree (a task reachable as its own ancestor) would make
      // this walk loop forever and freeze the whole app. Bail out instead.
      if (seen[current]) break;
      seen[current] = true;
      var parent = findParentTask(current);
      if (!parent) break;
      parent.done = parent.subtasks.length > 0 && parent.subtasks.every(function (s) { return s.done; });
      current = parent.id;
    }
  }

  function progress(node) {
    var kids = childrenOf(node);
    if (!kids.length) return null;
    var done = 0;
    for (var i = 0; i < kids.length; i++) { if (kids[i].done) done += 1; }
    return { done: done, total: kids.length };
  }

  function countAll(nodes) {
    var total = 0, done = 0;
    for (var i = 0; i < nodes.length; i++) {
      total += 1; if (nodes[i].done) done += 1;
      var c = countAll(nodes[i].subtasks);
      total += c.total; done += c.done;
    }
    return { total: total, done: done };
  }

  // --- Fälligkeitsdaten -------------------------------------------------
  // Ein Fälligkeitsdatum ist ein reines Kalenderdatum ("2026-08-14"), kein
  // Zeitstempel. Eine Aufgabe, die am 14. fällig ist, ist überall auf der
  // Welt am 14. fällig - dadurch entfällt die gesamte Zeitzonen-Fehlerklasse.
  // Verglichen wird deshalb per Zeichenkette, nicht über Date-Objekte.

  function isoPlusDays(iso, days) {
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function isOverdue(node) { return !!node.due && node.due < TODAY_ISO && !node.done; }
  function isDueToday(node) { return node.due === TODAY_ISO; }

  // Die Heute-Seite zeigt fällige *und* überfällige Aufgaben. Überfälliges
  // verschwindet bewusst nicht: eine Aufgabe stillschweigend fallenzulassen
  // ist bei einer Todo-App der schlimmere Fehler als eine volle Liste.
  // Erledigtes zählt nie als überfällig.
  function collectToday() {
    var out = [];
    function walk(nodes, list) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (isDueToday(n) || isOverdue(n)) out.push({ node: n, list: list, overdue: isOverdue(n) });
        walk(n.subtasks, list);
      }
    }
    for (var i = 0; i < lists.length; i++) { walk(lists[i].tasks, lists[i]); }
    // Überfälliges zuerst, ältestes oben - das Liegengebliebene soll auffallen.
    out.sort(function (a, b) {
      if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
      return a.node.due < b.node.due ? -1 : a.node.due > b.node.due ? 1 : 0;
    });
    return out;
  }

  function formatDue(iso) {
    if (iso === TODAY_ISO) return "Heute";
    if (iso === isoPlusDays(TODAY_ISO, 1)) return "Morgen";
    if (iso === isoPlusDays(TODAY_ISO, -1)) return "Gestern";
    var d = new Date(iso + "T00:00:00");
    var months = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
    var s = d.getDate() + ". " + months[d.getMonth()];
    // Jahr nur nennen, wenn es nicht das laufende ist - sonst nur Rauschen.
    if (iso.slice(0, 4) !== TODAY_ISO.slice(0, 4)) s += " " + d.getFullYear();
    return s;
  }

  // Klassen für die Fälligkeits-Pille an einer Aufgabe.
  function duePillClass(node) {
    if (isOverdue(node)) return " overdue";
    if (isDueToday(node)) return " today";
    return "";
  }

  function svgCheckboxOutline() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="2.5" width="10" height="10" rx="3"/></svg>'; }
  function svgHeading() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3.5 3v9M11.5 3v9M3.5 7.5h8"/></svg>'; }
  function svgDividerIcon() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 7.5h11"/></svg>'; }

  function svgCalendar() { return '<svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><rect x="2" y="3" width="11" height="10" rx="1.6"/><path d="M2 6.2h11M5 1.6v2.2M10 1.6v2.2"/></svg>'; }

  // Fälligkeits-Steuerung im Kopf einer Aufgabenseite: zeigt das Datum,
  // oder lädt ein, eines zu setzen. Beides öffnet dasselbe Menü.
  function dueControl(node) {
    var h = '<div class="due-wrap">';
    if (node.due) {
      h += '<button class="due-pill' + duePillClass(node) + ' due-trigger" data-due-menu="' + node.id + '" title="Fälligkeit ändern">' +
           (isOverdue(node) ? "Überfällig · " : "") + formatDue(node.due) + "</button>";
    } else {
      h += '<button class="due-add due-trigger" data-due-menu="' + node.id + '">' + svgCalendar() + " Fällig am …</button>";
    }
    if (state.dueMenuFor === node.id) {
      var tomorrow = isoPlusDays(TODAY_ISO, 1);
      var nextWeek = isoPlusDays(TODAY_ISO, 7);
      h += '<div class="due-menu" data-due-menu-panel>';
      h += '<button class="due-opt" data-set-due="' + node.id + '" data-due-value="' + TODAY_ISO + '">Heute</button>';
      h += '<button class="due-opt" data-set-due="' + node.id + '" data-due-value="' + tomorrow + '">Morgen</button>';
      h += '<button class="due-opt" data-set-due="' + node.id + '" data-due-value="' + nextWeek + '">Nächste Woche</button>';
      h += '<label class="due-opt due-pick">Datum wählen<input type="date" data-pick-due="' + node.id + '" value="' + (node.due || "") + '" /></label>';
      if (node.due) h += '<button class="due-opt due-clear" data-set-due="' + node.id + '" data-due-value="">Fälligkeit entfernen</button>';
      h += "</div>";
    }
    h += "</div>";
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; });
  }

  function svgCheck() { return '<svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M1.5 5l2.5 2.5 4.5-5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgPlus() { return '<svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'; }
  function svgFolderPlus() { return '<svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M1.5 4.2c0-.55.45-1 1-1h2.7l1.1 1.3H12c.55 0 1 .45 1 1V11c0 .55-.45 1-1 1H2.5c-.55 0-1-.45-1-1V4.2z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M7.5 7v3.2M5.9 8.6h3.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'; }
  function svgImg() { return '<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/><circle cx="5" cy="6" r="1" fill="currentColor"/><path d="M2 11l3.5-3.5L8 10l2-2 3 3" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>'; }
  function svgClose() { return '<svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M1 1l11 11M12 1L1 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'; }
  function svgChevronDown() { return '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 3.5l3.5 3 3.5-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  function svgGearPath() { return '<path d="M7.5 5.3a2.2 2.2 0 100 4.4 2.2 2.2 0 000-4.4z" stroke="currentColor" stroke-width="1.1"/><path d="M7.5 1.5v1.3M7.5 12.2v1.3M13.5 7.5h-1.3M2.8 7.5H1.5M11.6 3.4l-.9.9M4.3 10.7l-.9.9M11.6 11.6l-.9-.9M4.3 4.3l-.9-.9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>'; }

  // Every part is drawn symmetrically about x = 6.5 so the icon sits dead
  // centre in its button. The can body used to run 3.5 - 10.5, i.e. centred
  // on 7.0, while the lid ran 2.5 - 10.5 (centred on 6.5). The icon's
  // overall bounding box still measured as centred, because the lid sets
  // its extents - but the body carries the visual mass, so the icon read as
  // pushed to the right. The body keeps its width and is simply moved onto
  // the centre line.
  // viewBox y is offset by 0.25 because the drawing spans y 1 - 12.5, so its
  // vertical centre is 6.75 rather than the viewBox's own 6.5.
  function svgTrash() {
    return '<svg width="14" height="14" viewBox="0 0.25 13 13" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M2.5 3.5h8"/>' +                             // lid:    2.5 - 10.5
      '<path d="M5 3.5V2a1 1 0 011-1h1a1 1 0 011 1v1.5"/>' + // handle: 5   - 8
      '<path d="M3 3.5l.5 8a1 1 0 001 1h4a1 1 0 001-1l.5-8"/>' + // body: 3 - 10
      "</svg>";
  }

  function renderTaskRow(node, colIndex, listBadge, deleteCtx) {
    var prog = progress(node);
    var html = '<div class="task-row' + (node.done ? " done" : "") + '" data-open-task="' + node.id + '" data-col-index="' + colIndex + '">';
    html += '<button class="check-btn' + (node.done ? " done" : "") + '" data-check="' + node.id + '" role="checkbox" aria-checked="' + node.done + '" aria-label="Als erledigt markieren">' + svgCheck() + "</button>";
    if (listBadge) html += '<span class="list-dot" style="background:' + listBadge.color + '" title="' + escapeHtml(listBadge.name) + '"></span>';
    html += '<span class="task-title">' + escapeHtml(node.title) + "</span>";
    if (prog) {
      var pct = Math.round((prog.done / prog.total) * 100);
      html += '<span class="mini-progress" title="' + prog.done + " von " + prog.total + ' erledigt"><span style="width:' + pct + '%"></span></span>';
    }
    if (node.due) html += '<span class="due-pill' + duePillClass(node) + '">' + formatDue(node.due) + "</span>";
    if (deleteCtx) html += '<button class="row-delete" data-delete-owner="' + deleteCtx.ownerId + '" data-delete-block="' + node.id + '" data-delete-kind="task" aria-label="Aufgabe löschen">' + svgTrash() + "</button>";
    html += "</div>";
    return html;
  }

  function ownerAt(colIndex) {
    if (colIndex === 0) return state.view === "list" ? findList(state.currentListId) : null;
    return findTaskGlobal(state.panelStack[colIndex - 1]);
  }

  // --- Free-form page editor: renders owner.blocks as a live contenteditable
  // document instead of a fixed block list, so text can be typed anywhere
  // and tasks/images inserted at the cursor.

  function svgGrip() { return '<svg width="8" height="13" viewBox="0 0 8 13" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2.5" r="1.1"/><circle cx="6" cy="2.5" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="6" cy="6.5" r="1.1"/><circle cx="2" cy="10.5" r="1.1"/><circle cx="6" cy="10.5" r="1.1"/></svg>'; }

  function embedGripNode() {
    var grip = document.createElement("span");
    grip.className = "embed-grip";
    grip.setAttribute("data-embed-grip", "");
    grip.setAttribute("aria-label", "Zum Verschieben ziehen");
    grip.setAttribute("title", "Zum Verschieben ziehen");
    grip.innerHTML = svgGrip();
    return grip;
  }

  function makeInlineTaskNode(node, colIndex, ownerId) {
    var tmp = document.createElement("div");
    tmp.innerHTML = renderTaskRow(node, colIndex, null, { ownerId: ownerId });
    var wrap = document.createElement("div");
    wrap.className = "inline-embed";
    wrap.contentEditable = "false";
    wrap.setAttribute("data-embed-marker", "task:" + node.id);
    wrap.appendChild(embedGripNode());
    wrap.appendChild(tmp.firstElementChild);
    return wrap;
  }

  function makeInlineImageNode(block, ownerId) {
    var wrap = document.createElement("div");
    wrap.className = "inline-embed";
    wrap.contentEditable = "false";
    wrap.setAttribute("data-embed-marker", "image:" + block.id);
    wrap.innerHTML = '<div class="block-image">' + svgImg() + "<span>" + escapeHtml(block.caption || "Bild") + ' · Platzhalter</span></div><button class="row-delete" data-delete-owner="' + ownerId + '" data-delete-block="' + block.id + '" data-delete-kind="image" aria-label="Bild löschen">' + svgTrash() + "</button>";
    wrap.insertBefore(embedGripNode(), wrap.firstChild);
    return wrap;
  }

  // --- Block model -----------------------------------------------------
  // A page is an ordered list of blocks, and a paragraph is a block in its
  // own right - not loose text sitting between blocks. Every top-level child
  // of the editor is therefore either an .inline-embed (task/image) or a
  // .pe-line (paragraph). This mirrors how Superlist's own editor models a
  // document (github.com/superlistapp/super_editor: an ordered list of
  // discrete nodes - paragraph, task, image - each with its own id).
  //
  // The previous model kept paragraphs as bare text nodes and read the page
  // back with innerText. That could not represent a caret position between
  // two adjacent tasks, an empty line, or a line break that survives a
  // re-render, and pressing Enter let the browser wrap following blocks into
  // the new <div> it created, swallowing tasks into a paragraph.

  function makeLineNode(text, kind) {
    var line = document.createElement("div");
    line.className = "pe-line" + (kind === "heading" ? " pe-h" : "");
    if (text) line.appendChild(document.createTextNode(text));
    else line.appendChild(document.createElement("br"));
    return line;
  }

  function makeDividerNode() {
    var d = document.createElement("div");
    d.className = "pe-divider";
    d.contentEditable = "false";
    d.setAttribute("data-divider", "");
    return d;
  }

  function isEmbed(n) { return n && n.nodeType === 1 && n.classList && n.classList.contains("inline-embed"); }
  function isDivider(n) { return n && n.nodeType === 1 && n.classList && n.classList.contains("pe-divider"); }
  // Alles, was keine Schreibposition bietet und deshalb einen Absatz daneben
  // braucht: Aufgaben, Bilder und Trenner.
  function isSolidBlock(n) { return isEmbed(n) || isDivider(n); }
  function isHeading(n) { return n && n.nodeType === 1 && n.classList && n.classList.contains("pe-h"); }

  function buildEditorDOM(owner, colIndex) {
    var el = document.createElement("div");
    el.className = "page-editor";
    el.contentEditable = "true";
    el.setAttribute("data-editor-for", owner.id);
    el.setAttribute("data-editor-col", colIndex);
    el.setAttribute("data-placeholder", "Schreib einfach los …");
    var kids = childrenOf(owner);
    for (var i = 0; i < owner.blocks.length; i++) {
      var b = owner.blocks[i];
      if (b.type === "text") {
        // Legacy blocks may still carry embedded newlines; each becomes a line.
        var linesOfText = String(b.text).split("\n");
        for (var li = 0; li < linesOfText.length; li++) el.appendChild(makeLineNode(linesOfText[li]));
      } else if (b.type === "heading") {
        el.appendChild(makeLineNode(b.text, "heading"));
      } else if (b.type === "divider") {
        el.appendChild(makeDividerNode());
      } else if (b.type === "task") {
        var child = null;
        for (var k = 0; k < kids.length; k++) { if (kids[k].id === b.id) { child = kids[k]; break; } }
        if (child) el.appendChild(makeInlineTaskNode(child, colIndex, owner.id));
      } else if (b.type === "image") {
        el.appendChild(makeInlineImageNode(b, owner.id));
      }
    }
    normalizeEditor(el);
    return el;
  }

  // Restores the block model after the browser has had its way with the DOM,
  // and guarantees there is always somewhere to type: a paragraph before a
  // leading embed, between two adjacent embeds, and after a trailing one.
  // Without those, a contenteditable offers no caret position at all next to
  // a contenteditable="false" block.
  function normalizeEditor(el) {
    // 1. Flatten to a single top-level sequence of blocks, keeping document
    //    order: hoist embeds the browser nested inside a paragraph, and keep
    //    each block-level element as its own paragraph. Only inline content
    //    (text, <br>, <b>, ...) is gathered together into one paragraph -
    //    merging block elements here is what previously collapsed several
    //    typed lines into one.
    var flat = [];
    function isBlockEl(n) { return n.nodeType === 1 && (n.nodeName === "DIV" || n.nodeName === "P"); }
    function hasBlockChild(n) {
      for (var i = 0; i < n.childNodes.length; i++) { if (isBlockEl(n.childNodes[i])) return true; }
      return false;
    }
    function collect(node) {
      var kids = Array.prototype.slice.call(node.childNodes);
      var carry = null;
      function flush() { if (carry) { flat.push(carry); carry = null; } }
      for (var i = 0; i < kids.length; i++) {
        var k = kids[i];
        if (isSolidBlock(k)) {
          flush();
          flat.push(k);
        } else if (isBlockEl(k) && ((k.querySelector && k.querySelector(".inline-embed")) || hasBlockChild(k))) {
          flush();
          collect(k);
        } else if (isBlockEl(k)) {
          flush();
          k.classList.add("pe-line");
          flat.push(k);
        } else {
          if (!carry) { carry = makeLineNode(""); carry.innerHTML = ""; }
          carry.appendChild(k);
        }
      }
      flush();
    }
    collect(el);
    el.innerHTML = "";
    for (var f = 0; f < flat.length; f++) el.appendChild(flat[f]);

    // 2. Make sure every non-embed child is a proper paragraph element.
    var kids2 = Array.prototype.slice.call(el.childNodes);
    for (var j = 0; j < kids2.length; j++) {
      var n = kids2[j];
      if (isSolidBlock(n)) continue;
      if (n.nodeType === 3) {
        var wrapped = makeLineNode(n.textContent);
        el.replaceChild(wrapped, n);
      } else if (n.nodeType === 1) {
        n.classList.add("pe-line");
        if (!n.textContent && !n.querySelector("br")) n.appendChild(document.createElement("br"));
      }
    }

    // 3. Guarantee a paragraph around every embed run.
    var kids3 = Array.prototype.slice.call(el.childNodes);
    if (!kids3.length || isSolidBlock(kids3[0])) el.insertBefore(makeLineNode(""), el.firstChild);
    var kids4 = Array.prototype.slice.call(el.childNodes);
    for (var m = 0; m < kids4.length - 1; m++) {
      if (isSolidBlock(kids4[m]) && isSolidBlock(kids4[m + 1])) el.insertBefore(makeLineNode(""), kids4[m + 1]);
    }
    if (isSolidBlock(el.lastChild)) el.appendChild(makeLineNode(""));

    // 4. Empty paragraphs that only exist to sit next to an embed collapse
    //    to a thin strip, so a run of tasks stays tight instead of being
    //    spaced out by a blank line each.
    var kids5 = Array.prototype.slice.call(el.childNodes);
    for (var q = 0; q < kids5.length; q++) {
      var line = kids5[q];
      if (isSolidBlock(line)) continue;
      var touchesEmbed = isSolidBlock(line.previousSibling) || isSolidBlock(line.nextSibling);
      var empty = line.textContent === "";
      line.classList.toggle("pe-gap", !!(empty && touchesEmbed));
      if (!empty) line.classList.remove("pe-open");
    }
  }

  // Open the collapsed gap the caret is currently in, and close the others.
  function syncGapForCaret() {
    var sel = window.getSelection();
    var active = null;
    if (sel && sel.rangeCount) {
      var n = sel.anchorNode;
      while (n && n !== document.body) {
        if (n.nodeType === 1 && n.classList && n.classList.contains("pe-gap")) { active = n; break; }
        n = n.parentNode;
      }
    }
    var gaps = document.querySelectorAll(".pe-gap.pe-open");
    for (var i = 0; i < gaps.length; i++) { if (gaps[i] !== active) gaps[i].classList.remove("pe-open"); }
    if (active) active.classList.add("pe-open");
  }

  document.addEventListener("selectionchange", syncGapForCaret);

  // Die Luecke bereits beim Druecken oeffnen, nicht erst wenn die Auswahl
  // gemeldet wird: sonst zeichnet der Browser den Cursor noch in der
  // zusammengeklappten Hoehe und er wirkt winzig gegenueber dem Text.
  // Eine zusammengeklappte Luecke ist 0px hoch - der Browser kann sie also
  // gar nicht treffen, und ein CSS-Klickstreifen wuerde vom overflow der
  // Nachbarbloecke abgeschnitten. Deshalb hier selbst pruefen, ob der Klick
  // dicht genug an einer Blockgrenze liegt.
  function gapNearPoint(editor, x, y) {
    var gaps = editor.querySelectorAll(".pe-gap:not(.pe-open)");
    for (var i = 0; i < gaps.length; i++) {
      var r = gaps[i].getBoundingClientRect();
      if (Math.abs(y - r.top) <= 5 && x >= r.left && x <= r.right) return gaps[i];
    }
    return null;
  }

  document.addEventListener("pointerdown", function (e) {
    if (!e.target.closest) return;
    var ed = e.target.closest(".page-editor");
    var gap = e.target.closest(".pe-gap") || (ed && gapNearPoint(ed, e.clientX, e.clientY));
    if (!gap) return;
    gap.classList.add("pe-open");
    // Die Zeile war bis eben 0px hoch; die Trefferpruefung des Browsers
    // wuerde den Cursor dort nicht zuverlaessig setzen. Also selbst setzen,
    // aber erst nachdem der Browser seine eigene Behandlung erledigt hat -
    // sonst ueberschreibt er die Auswahl gleich wieder.
    var editor = gap.closest(".page-editor");
    setTimeout(function () {
      if (editor) editor.focus();
      var r = document.createRange();
      r.selectNodeContents(gap);
      r.collapse(true);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }, 0);
  }, true);

  // --- Auswahl-Leiste ---------------------------------------------------
  // Erscheint nur, wenn wirklich Text markiert ist, und verschwindet sonst.
  // Bewusst keine dauerhafte Formatierungsleiste: Die kostet Platz und Ruhe,
  // auch wenn man sie nie braucht. Auf Mobile bringt super_editor eine
  // gleichwertige Popover-Leiste bereits mit.

  var selBarEl = null;

  function hideSelBar() {
    if (selBarEl) { selBarEl.remove(); selBarEl = null; }
  }

  function showSelBar(rect) {
    if (!selBarEl) {
      selBarEl = document.createElement("div");
      selBarEl.className = "sel-bar";
      selBarEl.setAttribute("data-sel-bar", "");
      selBarEl.innerHTML =
        '<button class="sel-btn b" data-fmt="bold" title="Fett (Strg+B)">B</button>' +
        '<button class="sel-btn i" data-fmt="italic" title="Kursiv (Strg+I)">I</button>' +
        '<button class="sel-btn s" data-fmt="strikeThrough" title="Durchgestrichen">S</button>' +
        '<span class="sel-sep"></span>' +
        '<button class="sel-btn" data-fmt="link" title="Link einfügen">Link</button>';
      document.body.appendChild(selBarEl);
    }
    var w = selBarEl.offsetWidth || 150;
    var left = Math.max(8, Math.min(window.innerWidth - w - 8, rect.left + rect.width / 2 - w / 2));
    var top = rect.top - (selBarEl.offsetHeight || 33) - 8;
    if (top < 8) top = rect.bottom + 8;   // kein Platz oben: darunter zeigen
    selBarEl.style.left = left + "px";
    selBarEl.style.top = top + "px";
  }

  function syncSelBar() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) { hideSelBar(); return; }
    var range = sel.getRangeAt(0);
    var editor = range.startContainer.parentElement && range.startContainer.parentElement.closest(".page-editor");
    if (!editor || !editor.contains(range.endContainer)) { hideSelBar(); return; }
    if (!sel.toString().trim()) { hideSelBar(); return; }
    showSelBar(range.getBoundingClientRect());
  }

  document.addEventListener("selectionchange", syncSelBar);
  window.addEventListener("scroll", hideSelBar, true);

  document.addEventListener("mousedown", function (e) {
    // Klick auf Leiste oder Menü darf den Editor nicht entfokussieren.
    if (e.target.closest && e.target.closest("[data-sel-bar], [data-slash-menu]")) e.preventDefault();
  });

  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("[data-fmt]");
    if (!btn) return;
    e.preventDefault();
    var sel = window.getSelection();
    var editor = sel.rangeCount && sel.getRangeAt(0).startContainer.parentElement &&
                 sel.getRangeAt(0).startContainer.parentElement.closest(".page-editor");
    var fmt = btn.getAttribute("data-fmt");
    if (fmt === "link") {
      var url = window.prompt("Adresse des Links:", "https://");
      if (url) document.execCommand("createLink", false, url);
    } else {
      document.execCommand(fmt, false, null);
    }
    if (editor) serializeEditor(editor.getAttribute("data-editor-for"));
    syncSelBar();
  });

  // --- "/"-Blockmenü ----------------------------------------------------
  // Wird ausgelöst, sobald eine Zeile nur aus "/" besteht. Unsichtbar, bis
  // man es braucht - der Gegenentwurf zu einer Leiste voller Knöpfe.

  var slashMenuEl = null, slashLine = null, slashCol = 0;

  var SLASH_ITEMS = [
    { key: "task",    label: "Aufgabe",    hint: "- ",  icon: function () { return svgCheckboxOutline(); } },
    { key: "heading", label: "Überschrift", hint: "# ",  icon: function () { return svgHeading(); } },
    { key: "divider", label: "Trenner",     hint: "---", icon: function () { return svgDividerIcon(); } },
    { key: "image",   label: "Bild",        hint: "",    icon: function () { return svgImg(); } }
  ];

  function hideSlashMenu() {
    if (slashMenuEl) { slashMenuEl.remove(); slashMenuEl = null; }
    slashLine = null;
  }

  function showSlashMenu(line, colIndex) {
    hideSlashMenu();
    slashLine = line;
    slashCol = colIndex;
    slashMenuEl = document.createElement("div");
    slashMenuEl.className = "slash-menu";
    slashMenuEl.setAttribute("data-slash-menu", "");
    var html = "";
    for (var i = 0; i < SLASH_ITEMS.length; i++) {
      var it = SLASH_ITEMS[i];
      html += '<button class="slash-opt' + (i === 0 ? " active" : "") + '" data-slash="' + it.key + '">' +
              it.icon() + "<span>" + it.label + "</span>" +
              (it.hint ? '<span class="slash-hint">' + escapeHtml(it.hint) + "</span>" : "") +
              "</button>";
    }
    slashMenuEl.innerHTML = html;
    document.body.appendChild(slashMenuEl);
    var r = line.getBoundingClientRect();
    var top = r.bottom + 6;
    if (top + slashMenuEl.offsetHeight > window.innerHeight - 8) top = r.top - slashMenuEl.offsetHeight - 6;
    slashMenuEl.style.left = Math.min(r.left, window.innerWidth - slashMenuEl.offsetWidth - 8) + "px";
    slashMenuEl.style.top = top + "px";
  }

  // Entfernt das ausloesende "/" bzw. Kuerzel aus der Zeile.
  function clearTriggerLine(line) {
    if (!line) return;
    line.innerHTML = "";
    line.appendChild(document.createElement("br"));
  }

  function runSlashAction(key) {
    var line = slashLine, colIndex = slashCol;
    var editor = line && line.closest(".page-editor");
    hideSlashMenu();
    if (!editor) return;
    clearTriggerLine(line);
    // Cursor zurueck in die geleerte Zeile, damit der Block dort landet.
    editor.focus();
    var sel = window.getSelection();
    var r = document.createRange();
    r.selectNodeContents(line);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);

    if (key === "task") { insertTaskAt(colIndex); return; }
    if (key === "divider") { insertDividerAt(colIndex); return; }
    if (key === "heading") { setLineKindAtCaret(editor, "heading"); renderColumnsKeepingFocus(editor); return; }
    if (key === "image") {
      var owner = ownerAt(colIndex);
      if (!owner) return;
      insertEmbedInEditor(editor, makeInlineImageNode({ type: "image", id: "img" + Date.now(), caption: "Bild" }, owner.id));
      serializeEditor(owner.id);
      renderColumns();
    }
  }

  // Nach einer reinen Umformatierung nicht neu rendern - das wuerde den
  // Cursor verlieren. Nur die Sidebar-Zaehler koennen sich geaendert haben.
  function renderColumnsKeepingFocus() { renderSidebar(); }

  document.addEventListener("click", function (e) {
    var opt = e.target.closest && e.target.closest("[data-slash]");
    if (opt) { e.preventDefault(); runSlashAction(opt.getAttribute("data-slash")); return; }
    if (slashMenuEl && !e.target.closest("[data-slash-menu]")) hideSlashMenu();
  });


  // --- Auslöser beim Tippen ---------------------------------------------
  // "/" auf einer leeren Zeile öffnet das Blockmenü; die Markdown-Kürzel
  // wandeln direkt um. Beides ist unsichtbar, bis man es benutzt - der
  // Gegenentwurf zu einer dauerhaften Werkzeugleiste.

  document.addEventListener("input", function (e) {
    var editor = e.target.closest && e.target.closest(".page-editor");
    if (!editor) return;
    var sel = window.getSelection();
    if (!sel.rangeCount) { hideSlashMenu(); return; }
    var line = sel.getRangeAt(0).startContainer;
    while (line && line.parentNode !== editor) line = line.parentNode;
    if (!line || isSolidBlock(line)) { hideSlashMenu(); return; }

    var colIndex = parseInt(editor.getAttribute("data-editor-col"), 10);
    var text = line.textContent;

    // Markdown-Kürzel
    if (text === "# ") {
      clearTriggerLine(line);
      var r0 = document.createRange(); r0.selectNodeContents(line); r0.collapse(true);
      sel.removeAllRanges(); sel.addRange(r0);
      setLineKindAtCaret(editor, "heading");
      hideSlashMenu();
      return;
    }
    if (text === "- " || text === "[] ") {
      slashLine = line; slashCol = colIndex;
      runSlashAction("task");
      return;
    }
    if (text === "---") {
      slashLine = line; slashCol = colIndex;
      runSlashAction("divider");
      return;
    }

    // "/"-Menü
    if (text === "/") { showSlashMenu(line, colIndex); return; }
    hideSlashMenu();
  });

  // Once a gap has been typed into it is an ordinary paragraph - drop the
  // collapsing, or it would fold back up (hiding the text) as soon as the
  // caret moved away.
  document.addEventListener("input", function (e) {
    var editor = e.target.closest && e.target.closest(".page-editor");
    if (!editor) return;
    var gaps = editor.querySelectorAll(".pe-gap");
    for (var i = 0; i < gaps.length; i++) {
      if (gaps[i].textContent !== "") gaps[i].classList.remove("pe-gap", "pe-open");
    }
  });

  function placeCaretAtEnd(el) {
    normalizeEditor(el);
    el.focus();
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // Bottom edge of the editor's actual content, ignoring the empty area the
  // editor stretches over (it is min-height: 100% of the column).
  function editorContentBottom(el) {
    var bottom = -Infinity;
    for (var i = 0; i < el.childNodes.length; i++) {
      var n = el.childNodes[i], r = null;
      if (n.nodeType === 3) {
        var rg = document.createRange();
        rg.selectNode(n);
        r = rg.getBoundingClientRect();
      } else if (n.getBoundingClientRect) {
        r = n.getBoundingClientRect();
      }
      if (r && r.height && r.bottom > bottom) bottom = r.bottom;
    }
    return bottom;
  }

  function mountEditors() {
    var slots = document.querySelectorAll("[data-editor-slot]");
    for (var i = 0; i < slots.length; i++) {
      var slot = slots[i];
      var ownerId = slot.getAttribute("data-editor-slot");
      var colIndex = parseInt(slot.getAttribute("data-editor-col"), 10);
      var owner = findList(ownerId) || findTaskGlobal(ownerId);
      if (!owner) continue;
      slot.appendChild(buildEditorDOM(owner, colIndex));
    }
  }

  function serializeEditor(ownerId) {
    var editorEl = document.querySelector('[data-editor-for="' + ownerId + '"]');
    if (!editorEl) return;
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    if (!owner) return;

    // Read the blocks straight off the DOM structure. The old approach
    // flattened the page to innerText and split it on marker characters,
    // which lost every line break and could not represent an empty line.
    normalizeEditor(editorEl);

    var newBlocks = [];
    for (var i = 0; i < editorEl.childNodes.length; i++) {
      var n = editorEl.childNodes[i];
      if (isEmbed(n)) {
        var marker = n.getAttribute("data-embed-marker") || "";
        var sep = marker.indexOf(":");
        var kind = marker.slice(0, sep);
        var mid = marker.slice(sep + 1);
        if (kind === "task") {
          newBlocks.push({ type: "task", id: mid });
        } else if (kind === "image") {
          var oldImg = owner.blocks.filter(function (b) { return b.type === "image" && b.id === mid; })[0];
          newBlocks.push({ type: "image", id: mid, caption: oldImg ? oldImg.caption : "Bild" });
        }
      } else if (isDivider(n)) {
        newBlocks.push({ type: "divider" });
      } else if (isHeading(n)) {
        newBlocks.push({ type: "heading", text: n.textContent.replace(/\n/g, "") });
      } else {
        // A paragraph. Empty ones are kept - a blank line is real content.
        newBlocks.push({ type: "text", text: n.textContent.replace(/\n/g, "") });
      }
    }
    // Trailing blank paragraphs are structural padding added by
    // normalizeEditor, not content - drop them so they cannot pile up.
    while (newBlocks.length) {
      var lastB = newBlocks[newBlocks.length - 1];
      if (lastB.type === "text" && lastB.text === "") newBlocks.pop(); else break;
    }

    var oldTaskIds = owner.blocks.filter(function (b) { return b.type === "task"; }).map(function (b) { return b.id; });
    var newTaskIds = newBlocks.filter(function (b) { return b.type === "task"; }).map(function (b) { return b.id; });
    var removedAncestorUpdateNeeded = owner.subtasks ? true : false;
    for (var t = 0; t < oldTaskIds.length; t++) {
      if (newTaskIds.indexOf(oldTaskIds[t]) === -1) {
        var kids2 = childrenOf(owner);
        var ki = kids2.findIndex(function (k) { return k.id === oldTaskIds[t]; });
        if (ki >= 0) kids2.splice(ki, 1);
        var stackIdx = state.panelStack.indexOf(oldTaskIds[t]);
        if (stackIdx >= 0) state.panelStack = state.panelStack.slice(0, stackIdx);
      }
    }

    owner.blocks = newBlocks;
    if (removedAncestorUpdateNeeded) {
      owner.done = owner.subtasks.length > 0 && owner.subtasks.every(function (s) { return s.done; });
      recomputeAncestors(owner.id);
    }
  }

  function insertEmbedInEditor(editorEl, node) {
    var sel = window.getSelection();
    var hasCursorHere = sel && sel.rangeCount > 0 && editorEl.contains(sel.anchorNode);
    var range;
    if (hasCursorHere) {
      range = sel.getRangeAt(0);
    } else {
      // not focused/positioned in this page: insert at the very top instead of the end
      range = document.createRange();
      range.selectNodeContents(editorEl);
      range.collapse(true);
    }
    range.deleteContents();
    // An embed is a top-level block: lift it out of whatever paragraph the
    // caret happened to be in, splitting that paragraph around it.
    var host = range.startContainer;
    while (host && host.parentNode !== editorEl) host = host.parentNode;
    if (host && host !== editorEl) {
      var tail = range.cloneRange();
      tail.setEndAfter(host);
      var after = tail.extractContents();
      editorEl.insertBefore(node, host.nextSibling);
      if (after && after.textContent !== "") editorEl.insertBefore(after, node.nextSibling);
    } else {
      range.insertNode(node);
    }
    normalizeEditor(editorEl);

    // Put the caret on the paragraph right after the new block.
    var next = node.nextSibling;
    if (next) {
      var r2 = document.createRange();
      r2.selectNodeContents(next);
      r2.collapse(true);
      editorEl.focus();
      sel.removeAllRanges();
      sel.addRange(r2);
    }
  }

  // --- Blöcke an der Cursorposition einfügen -----------------------------
  // Gemeinsamer Weg für das "/"-Menü und die Markdown-Kürzel.

  function insertTaskAt(colIndex, opts) {
    var owner = ownerAt(colIndex);
    if (!owner) return null;
    var editorEl = document.querySelector('[data-editor-for="' + owner.id + '"]');
    var t = task((opts && opts.title) || "Neue Aufgabe");
    childrenOf(owner).push(t);
    if (owner.subtasks) { owner.done = false; recomputeAncestors(owner.id); }
    if (editorEl) {
      insertEmbedInEditor(editorEl, makeInlineTaskNode(t, colIndex, owner.id));
      serializeEditor(owner.id);
    } else {
      owner.blocks.push({ type: "task", id: t.id });
    }
    // Eine neue Aufgabe öffnet ihre Seite gleich mit - sie ist ja selbst eine.
    if (!opts || opts.open !== false) state.panelStack = state.panelStack.slice(0, colIndex).concat([t.id]);
    renderAll();
    return t;
  }

  function insertDividerAt(colIndex) {
    var owner = ownerAt(colIndex);
    var editorEl = owner && document.querySelector('[data-editor-for="' + owner.id + '"]');
    if (!editorEl) return;
    insertEmbedInEditor(editorEl, makeDividerNode());
    serializeEditor(owner.id);
    renderColumns();
  }

  // Wandelt den Absatz, in dem der Cursor steht, in eine Überschrift um
  // (oder zurück). Der Text bleibt erhalten.
  function setLineKindAtCaret(editorEl, kind) {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var host = sel.getRangeAt(0).startContainer;
    while (host && host.parentNode !== editorEl) host = host.parentNode;
    if (!host || isSolidBlock(host)) return;
    host.classList.toggle("pe-h", kind === "heading");
    // Erst speichern, dann den Cursor setzen: serializeEditor ruft
    // normalizeEditor, das den Editor-Inhalt neu zusammensetzt und dabei
    // jede bestehende Auswahl verwirft. Die Knoten selbst überleben, also
    // lässt sich der Cursor danach wieder auf dieselbe Zeile setzen.
    serializeEditor(editorEl.getAttribute("data-editor-for"));
    editorEl.focus();
    var r = document.createRange();
    r.selectNodeContents(host);
    r.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r);
  }

  var prevPanelStack = [];

  function renderColumns() {
    var el = document.getElementById("contentArea");
    var html = "";
    var newlyOpened = state.panelStack.filter(function (id) { return prevPanelStack.indexOf(id) === -1; });
    var oldScrollLeft = el.scrollLeft;

    var beforeRects = {};
    var prevCols = el.querySelectorAll(".column[data-col-key]");
    for (var bi = 0; bi < prevCols.length; bi++) {
      var pr = prevCols[bi].getBoundingClientRect();

    }

    if (state.view === "today") {

      html += '<div class="blocks">';

      if (!items.length) {
        html += '<div class="empty-state">Nichts für heute. Und nichts liegengeblieben.</div>';
      } else {
        // Überfälliges bekommt einen eigenen Abschnitt ganz oben. Es geht ja
        // gerade darum, dass Liegengebliebenes auffällt statt sich unter den
        // Listen zu verteilen. Die Herkunftsliste steht als Punkt an der Zeile.
        var overdue = items.filter(function (it) { return it.overdue; });
        var todayItems = items.filter(function (it) { return !it.overdue; });

        if (overdue.length) {

        for (var i = 0; i < todayItems.length; i++) {

          byList[it.list.id].push(it);

        for (var j = 0; j < order.length; j++) {
