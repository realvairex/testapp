<title>Unfold — Konzept-Mockup (Desktop)</title>
<style>
  :root {
    /* --- Palette "Koernig", uebernommen 2026-08-13 ---
       Vier Farben kommen vom Nutzer: Sustainable Linen #faf3e1, Recycled
       Cotton #f5e7c6, Electric Tangerine #ff6d1f, Black Hole #222222,
       dazu sein Rot #b43852 fuer Ueberfaelliges. Alles Weitere ist
       ABGELEITET und als solches gekennzeichnet - die App braucht rund
       zwanzig Toene, nicht fuenf. Begruendungen: docs/decisions.md. */
    --paper: #f5e7c6;             /* Recycled Cotton */
    --surface: #faf3e1;           /* Sustainable Linen */
    --surface-sunken: #f5e7c6;    /* Recycled Cotton */
    --line: #e0ce9f;              /* ABGELEITET */
    --line-soft: #efe0be;         /* ABGELEITET */
    /* Eigener Ton fuers Ueberfahren in der Sidebar. --line-soft liegt auf
       dem Sandton der Sidebar praktisch unsichtbar (Kontrast 1,03).
       Hellt auf, nie ab - Regel aus docs/spec.md 3. */
    --nav-hover: #faf3e1;
    /* Strukturlinien der Gruppen: --line ist darauf zu leise (1,17). */
    --tree-line: #cbb78a;         /* ABGELEITET */
    /* Flaeche kleiner Schaltflaechen in der Sidebar. --surface waere hier
       der hellste Ton und damit ein harter Sprung auf dem Sandton. */
    --chip-bg: #efe0be;           /* ABGELEITET */
    --chip-hover: #faf3e1;
    --ink: #222222;               /* Black Hole */
    --ink-soft: #4a4a4a;          /* ABGELEITET */
    /* ABGELEITET. Zuerst #6b6b6b - das riss AA am Sidebar-Zaehler
       (4,35:1). Nachgezogen statt die Zusicherung entschaerft. */
    --ink-faint: #656565;
    --accent: #ff6d1f;            /* Electric Tangerine */
    /* Akzent fuer TEXT. --accent selbst ist als Textfarbe zu hell (2,54:1);
       es bleibt Fuell-/Dekorfarbe, wo die 3:1-Schwelle fuer Nicht-Text gilt.
       ABGELEITET: 65% Helligkeit des Tangerine, Farbton gehalten. */
    --accent-strong: #a64714;
    --accent-ink: #faf3e1;
    --accent-soft: #ffe3d2;       /* ABGELEITET */
    --accent-line: #ffc4a3;       /* ABGELEITET */
    /* Warnton. Der erste Vorschlag des Nutzers (#b43852) war ihm zu
       knallig - nachgemessen hatte er Buntheit 53, mehr als jede
       Listenfarbe. Dieser hier liegt bei 37: erkennbar dasselbe Rot, nur
       ohne Signalcharakter. Gehalten wurde der Rosenrot-Bereich, damit er
       nicht in Richtung Akzent (Orange) rutscht - Abstand zu Tangerine 62,
       zur naechsten Listenfarbe (Lehm) 29. */
    --urgent: #96444e;            /* ABGELEITET */
    --urgent-soft: #f6e6e8;       /* ABGELEITET */
    /* Erledigtes soll zuruecktreten, nicht rufen: ein gedaempftes Grau auf
       demselben Gewicht wie der durchgestrichene Text daneben. Eine dunkle
       Marke zoege mehr Blick auf sich als die offenen Aufgaben. */
    --done: #656565;              /* ABGELEITET */
    --done-ink: #faf3e1;
    /* Listenfarben, ABGELEITET (die Palette kennt keine). Erdtoene mit
       genau einem kuehlen Anker. Zwei Zonen bleiben frei, weil sie belegt
       sind: Orange traegt der Akzent, Rosenrot das Ueberfaellige. Petrol
       und Blauviolett sind ausgeschlossen - die standen schon einmal hier
       und wirkten als Fremdkoerper. */
    --list-inbox: #9b7355;        /* Lehm */
    --list-personal: #7d8a4e;     /* Olive */
    --list-work: #c1902f;         /* Ocker */
    --list-groceries: #5c7590;    /* Taubenblau */
    --list-5: #4a7a5e;            /* Tanne */
    --shadow-window: 0 30px 70px -25px rgba(34, 34, 34, 0.35), 0 2px 8px rgba(34, 34, 34, 0.06);
    --radius-window: 18px;

    /* --- Skalen. Vorher waren es 12 Schriftgroessen, 8 Radien, 18 Abstaende
       und 13 Uebergangsdauern, jede fuer sich gewachsen. Genau das laesst
       eine Oberflaeche unruhig wirken, ohne dass man ein einzelnes Element
       benennen koennte. Diese Werte gehen 1:1 nach Flutter. --- */
    --fs-xs: 11px;      /* Rubriken, Kuerzel */
    --fs-sm: 12px;      /* Metatext, Zaehler */
    --fs-md: 13.5px;    /* Fliesstext, Standard */
    --fs-lg: 15.5px;    /* Ueberschrift auf einer Seite */
    --fs-xl: 22px;      /* Spaltentitel */

    --fw-normal: 400;
    --fw-medium: 500;
    --fw-strong: 600;
    --fw-bold: 700;

    --r-sm: 6px;        /* kleine Schaltflaechen, Zeilen */
    --r-md: 10px;       /* Karten, Eingabefelder */
    --r-lg: 16px;       /* Menues, Overlays */
    --r-pill: 100px;

    --sp-1: 2px;
    --sp-2: 4px;
    --sp-3: 6px;
    --sp-4: 8px;
    --sp-5: 12px;
    --sp-6: 16px;
    --sp-7: 24px;

    --dur-fast: 120ms;  /* Hover, Fokus */
    --dur-base: 200ms;  /* Zustandswechsel */
    --dur-slow: 400ms;  /* Panels, Sidebar */
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    /* Zweite Kurve, und es bleibt bei zweien: Sie schwingt ueber ihr Ziel
       hinaus und sagt damit "geschafft". Das ist an einer Quittung richtig
       und ueberall sonst Unruhe - deshalb ausschliesslich in der
       Belohnungsschicht des Aufraeum-Modus (docs/spec.md 2.8). */
    --ease-spring: cubic-bezier(0.34, 1.28, 0.52, 1);
    /* Dritte und letzte Kurve, fuer Dinge die eine MENGE anzeigen:
       Fortschrittsbalken und Zaehler. Sie faengt langsam an, wird immer
       schneller und rastet am Ende ein - und sie schwingt bewusst NICHT
       ueber. Ein Balken, der ueber seine Kerbe hinausschiesst, zeigt fuer
       einen Moment einen Fortschritt an, den es nicht gibt; das ist nicht
       nur unruhig, es ist falsch. Der Ueberschwinger bleibt dort, wo etwas
       ANKOMMT (--ease-spring), nicht dort, wo etwas gemessen wird. */
    --ease-lauf: cubic-bezier(0.85, 0, 0.35, 1);

    /* Hoehen-Sprache: drei Ebenen statt beliebiger Schatten */
    /* Die Schatten trugen bis 2026-08-13 das Navy der alten Palette
       (41,50,65). Mit Koernig gibt es kein Navy mehr - ein blaustichiger
       Schatten unter einem Menue auf Sandgrund fiel als Fremdton auf. */
    --el-1: 0 1px 2px rgba(34, 34, 34, 0.06);
    --el-2: 0 18px 38px -14px rgba(34, 34, 34, 0.32);
    --el-3: 0 40px 80px -24px rgba(34, 34, 34, 0.45);
    --col-w: 276px;
    /* Mindestbreite des App-Fensters: Sidebar (248px) plus eine Spalte in
       Mindestbreite (240px) plus Rahmen. Steht hier einmal, weil sie an
       zwei Stellen gebraucht wird - am Fenster selbst und an der Seite. */
    --win-min: 490px;
    --page-pad: 24px;
    color-scheme: light;
  }

  /* Dunkelmodus der Koernig-Palette. Black Hole traegt die Flaechen,
     Linen den Text. Bemerkenswert: Hier braucht es KEINEN zweiten
     Akzentton - Tangerine traegt auf Schwarz als Text (5,65:1). Beim
     Ueberfaelligen ist es umgekehrt: Das Rot des Nutzers traegt dort
     nicht und wird aufgehellt. */
  :root[data-theme="dark"] {
    --paper: #1a1a1a;          /* ABGELEITET aus Black Hole */
    --surface: #222222;        /* Black Hole */
    --surface-sunken: #141414; /* ABGELEITET */
    --line: #3a3a3a;           /* ABGELEITET */
    --line-soft: #2e2e2e;      /* ABGELEITET */
    --nav-hover: #2e2e2e;      /* ABGELEITET */
    --tree-line: #4a4a4a;      /* ABGELEITET */
    --chip-bg: #222222;
    --chip-hover: #333333;     /* ABGELEITET */
    --ink: #faf3e1;            /* Sustainable Linen */
    --ink-soft: #b8b0a0;       /* ABGELEITET */
    --ink-faint: #a09a8c;      /* ABGELEITET */
    --accent: #ff6d1f;
    --accent-strong: #ff6d1f;  /* im Dunkelmodus bereits kontraststark genug */
    --accent-ink: #222222;
    --accent-soft: #3a2113;    /* ABGELEITET */
    --accent-line: #5c3520;    /* ABGELEITET */
    /* Aufgehellt, weil #96444e auf Schwarz als Text nicht traegt - und
       zugleich entsaettigt wie sein helles Gegenstueck (Buntheit 32). */
    --urgent: #c97b84;         /* ABGELEITET */
    --urgent-soft: #33191d;    /* ABGELEITET */
    --done: #8a8a8a;           /* ABGELEITET */
    --done-ink: #1a1a1a;
    --list-inbox: #bc9271;     /* Lehm */
    --list-personal: #9ba968;  /* Olive */
    --list-work: #ddae50;      /* Ocker */
    --list-groceries: #7e97b4; /* Taubenblau */
    --list-5: #6d9e82;         /* Tanne */
    --shadow-window: 0 30px 70px -25px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }

  @media (prefers-color-scheme: dark) {
    /* Rueckfallebene fuer "System dunkel", wenn kein data-theme gesetzt
       ist. Sie traegt jetzt DIESELBEN Werte wie :root[data-theme="dark"].
       Vorher wichen sie ab (#17161c/#1e1d24 statt #1f242e/#293241) - ein
       zweites, etwas kuehleres Dunkel, fuer das es keine Begruendung gab.
       Zwei Dunkelmodi zu pflegen, von denen man immer nur einen sieht, ist
       genau die Lage, aus der ein Theme entsteht, das je nach
       Systemeinstellung anders aussieht (status.md 4). Koernig hat ein
       Schwarz, also gibt es hier ein Dunkel. */
    :root:not([data-theme="light"]) {
      --paper: #1a1a1a;
      --surface: #222222;
      --surface-sunken: #141414;
      --line: #3a3a3a;
      --line-soft: #2e2e2e;
      --nav-hover: #2e2e2e;
      --tree-line: #4a4a4a;
      --chip-bg: #222222;
      --chip-hover: #333333;
      --ink: #faf3e1;
      --ink-soft: #b8b0a0;
      --ink-faint: #a09a8c;
      --accent: #ff6d1f;
      --accent-strong: #ff6d1f;
      --accent-ink: #222222;
      --accent-soft: #3a2113;
      --accent-line: #5c3520;
      --urgent: #c97b84;
      --urgent-soft: #33191d;
      --done: #8a8a8a;
      --done-ink: #1a1a1a;
      --list-inbox: #bc9271;
      --list-personal: #9ba968;
      --list-work: #ddae50;
      --list-groceries: #7e97b4;
      --list-5: #6d9e82;
      --shadow-window: 0 30px 70px -25px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }

  /* Schaltflaechen und Eingabefelder erben die Schrift der App. Ohne das
     traegt jedes davon die Browser-Vorgabe (13,33px) mit sich herum. */
  button, input, textarea, select { font: inherit; color: inherit; }

  /* Markierter Text lag bisher im Browser-Blau - mitten in einer warmen
     Sandumgebung ein Fremdkoerper. */
  ::selection { background: var(--accent-line); color: var(--ink); }

  /* Tastaturbedienung sichtbar machen. :focus-visible trifft nur echte
     Tastatur-Navigation, Mausklicks bekommen keinen Ring. */
  :focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }

  /* Scrollleisten auch ausserhalb der Inhaltsflaeche gestalten. */
  .sidebar::-webkit-scrollbar, .blocks::-webkit-scrollbar,
  .cmdk-results::-webkit-scrollbar { width: 8px; height: 8px; }
  .sidebar::-webkit-scrollbar-thumb, .blocks::-webkit-scrollbar-thumb,
  .cmdk-results::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--r-pill); }
  .sidebar::-webkit-scrollbar-track, .blocks::-webkit-scrollbar-track { background: transparent; }

  body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* Lag bis 2026-08-13 bei 0,25s - eine dreizehnte Dauer neben den drei
       Stufen, genau die Art Wildwuchs, gegen die die Skala angelegt wurde.
       Gefunden von test_stimmigkeit.js. */
    transition: background-color var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
  }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }

  /* min-width: min-content laesst die Seite nicht schmaler werden als ihr
     Inhalt. Wird das Fenster enger, scrollt die SEITE waagerecht - und der
     Innenabstand von 24px bleibt dabei auf beiden Seiten erhalten. Ohne das
     schrumpfte das App-Fenster immer weiter, sein Innenleben scrollte
     stattdessen, und der Inhalt stiess hart an die Fensterkante. */
  .page { max-width: 1180px; margin: 0 auto; padding: 40px var(--page-pad); min-height: 100vh; display: flex; align-items: center;
          min-width: calc(var(--win-min) + 2 * var(--page-pad)); }

  .window-frame { display: flex; justify-content: center; width: 100%; }

  .app-window {
    width: 100%;
    max-width: 1040px;
    /* Sidebar (248px) plus eine Spalte in Mindestbreite (240px) plus Rahmen.
       Darunter ist die App nicht mehr bedienbar - dann lieber die Seite
       scrollen lassen, als das Fenster weiter zu quetschen. */
    min-width: var(--win-min);
    height: 640px;
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-window);
    box-shadow: var(--shadow-window);
    overflow: hidden;
    position: relative;
  }

  /* --- Sidebar ---
     The sidebar itself is always position:absolute and only ever animates
     `transform` (compositor-only, no reflow). A separate invisible
     `.sidebar-track` flex item reserves/releases its 248px of space so the
     content-area resizes via a plain, natively-interpolated CSS transition
     on flex-basis instead of an instant grid-template-columns snap. Both
     run concurrently with the JS column FLIP animation, started in the
     same tick, so nothing has to "wait" for the sidebar and there's no
     freeze-frame between the two. */
  .sidebar-track {
    flex: 0 0 248px;
    transition: flex-basis var(--dur-slow) var(--ease);
  }
  .app-window.sidebar-collapsed .sidebar-track { flex-basis: 0; }
  @media (prefers-reduced-motion: reduce) { .sidebar-track { transition: none; } }

  .sidebar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 248px; z-index: 30;
    background: var(--surface-sunken); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto;
    transform: translateX(0);
    transition: transform var(--dur-slow) var(--ease);
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }

  .app-window.sidebar-collapsed .sidebar {
    transform: translateX(-100%);
    box-shadow: 14px 0 28px -14px rgba(0, 0, 0, 0.3);
  }
  .sidebar-hover-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; z-index: 25; }
  .app-window:not(.sidebar-collapsed) .sidebar-hover-zone { display: none; }
  .app-window.sidebar-collapsed:has(.sidebar-hover-zone:hover) .sidebar,
  .app-window.sidebar-collapsed .sidebar:hover {
    transform: translateX(0);
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 24px; }
  .brand-mark { display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--accent); }
  .brand-logo { height: 21px; width: auto; display: block; }
  .brand-name { font-size: var(--fs-lg); font-weight: var(--fw-strong); letter-spacing: -0.01em; }
  .nav-label { font-size: var(--fs-xs); font-weight: var(--fw-strong); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-faint); padding: 12px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: none; background: transparent; border-radius: var(--r-md); font-size: var(--fs-md); font-weight: var(--fw-medium); color: var(--ink); cursor: pointer; text-align: left; font-family: inherit; transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease, transform var(--dur-fast) var(--ease); }
  .nav-item:hover { background: var(--nav-hover); }
  .nav-item:active { transform: scale(0.97); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: var(--fw-strong); }
  /* Der Punkt belegt dieselbe Breite wie ein Icon, sonst beginnen die
     Beschriftungen von "Heute" (Icon) und "Inbox" (Punkt) an
     unterschiedlichen Stellen - hier waren es 7px Versatz. */
  /* 8px-Kreis + je 3.5px Rand = 15px Gesamtbreite. Wichtig: der Rand muss
     als margin gesetzt werden, nicht als padding - mit padding rechnet
     border-radius: 50% gegen die 15x8-Box und der Punkt wird zur Ellipse. */
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
             margin: 0 3.5px; }
  .nav-icon { width: 15px; height: 15px; flex-shrink: 0; color: var(--ink-soft); }
  .nav-item.active .nav-icon { color: var(--accent-strong); }
  .nav-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Centred, not right-aligned: the delete button swaps in for this number
     on hover, so the digit itself - not the box around it - has to sit on
     the button's centre line. Right-aligned text put the glyph ~4px to the
     right of that centre, which read as the two being right-edge aligned. */
  .nav-count { font-size: var(--fs-xs); font-variant-numeric: tabular-nums; color: var(--ink-faint); min-width: 16px; text-align: center; }
  /* Zaehler springen nicht, sie rollen - und zwar in die Richtung, in die
     sich der Wert bewegt: Wird weniger, kommt die neue Zahl von oben herein.
     Gilt in der ganzen Sidebar, nicht nur im Aufraeum-Modus: Es ist dieselbe
     Aussage ("eins weniger"), egal wo man etwas abgehakt hat. Die Klasse
     setzt zaehlerRollen() nach jedem Aufbau der Sidebar. */
  .nav-count.rollt-runter { animation: nav-count-runter var(--dur-slow) var(--ease-lauf); }
  .nav-count.rollt-hoch   { animation: nav-count-hoch   var(--dur-slow) var(--ease-lauf); }
  @keyframes nav-count-runter { from { transform: translateY(-0.75em); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes nav-count-hoch   { from { transform: translateY(0.75em);  opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .nav-count.rollt-runter, .nav-count.rollt-hoch { animation: none; } }
  .nav-item.active .nav-count { color: var(--accent-strong); }
  .nav-item-indented { padding-left: 24px; }
  /* Feine L-Linie, die die Zugehoerigkeit zur Gruppe nachzieht. Beim
     letzten Eintrag endet die Senkrechte auf halber Hoehe. */
  .nav-item-wrap.in-group { position: relative; }
  /* Durchgehende Senkrechte - nur solange noch Eintraege folgen. */
  .nav-item-wrap.in-group::before {
    content: ""; position: absolute; left: 13px; top: 0; bottom: 0; z-index: 1;
    border-left: 1px solid var(--tree-line); pointer-events: none;
  }
  .nav-item-wrap.in-group.last-in-group::before { display: none; }
  /* Der Bogen zur Zeile. Gerundet wie alles andere in der App. */
  .nav-item-wrap.in-group::after {
    content: ""; position: absolute; left: 13px; top: 0; height: 50%; width: 9px; z-index: 1;
    border-left: 1px solid var(--tree-line);
    border-bottom: 1px solid var(--tree-line);
    border-bottom-left-radius: 7px;
    pointer-events: none;
  }
  .nav-item[data-drag-type], .group-row[data-drag-type] { cursor: grab; }
  .sidebar.is-sorting .nav-item[data-drag-type], .sidebar.is-sorting .group-row[data-drag-type] { cursor: grabbing; }
  .nav-item.drag-ghost { opacity: 0.35; }

  .nav-item-wrap { position: relative; }
  /* Eine neu angelegte Liste kommt herein, statt dazustehen - DIESELBE
     Bewegung wie ein neuer Block auf einer Seite (block-in). Es ist
     dieselbe Aussage ("das ist gerade dazugekommen"), also sieht sie
     gleich aus; eine eigene Kurve oder Dauer waere eine zweite Sprache
     fuer denselben Satz. Der Nutzer wollte, dass sich das Anlegen so
     anfuehlt wie das Oeffnen des Eingangs - dort blenden genau diese
     block-in-Zeilen ein. */
  .nav-item-wrap.ist-neu { animation: block-in var(--dur-base) var(--ease); }
  @media (prefers-reduced-motion: reduce) { .nav-item-wrap.ist-neu { animation: none; } }
  .nav-item-wrap:hover .nav-count { opacity: 0; }
  /* The delete button replaces the count on hover, so the two must sit on
     exactly the same centre line - otherwise the icon appears to jump as
     the number fades out. The "Heute" row's count is the reference every
     other row is aligned to: its right edge is 23px from the sidebar edge
     and it is 16px wide, so its centre is 31px in. right: 7px puts this
     22px button on that same centre. */
  .nav-delete {
    opacity: 0; position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; padding: 0; border: none; background: transparent; color: var(--ink-faint);
    cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: var(--r-sm);
    transition: opacity var(--dur-fast) ease, color var(--dur-fast) ease, background-color var(--dur-fast) ease;
  }
  .nav-delete svg { flex-shrink: 0; }
  .group-actions {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 2px;
  }
  /* In der Gruppe sitzen die Knoepfe im Fluss, nicht einzeln absolut -
     so bleibt der Papierkorb auf derselben Achse wie die Zahl. */
  .group-actions .nav-delete { position: static; transform: none; }
  .group-actions .nav-delete:active { transform: scale(0.9); }
  .group-row:hover .group-actions .nav-delete { opacity: 1; }
  /* Der "+"-Knopf hebt sich beim Ueberfahren allein ueber die Farbe des
     Icons hervor - ausdruecklich ohne Flaeche. Er sitzt direkt neben dem
     Papierkorb: Zwei gefuellte Flaechen nebeneinander machen die
     Gruppenzeile unruhig, und eine Flaeche laesst das harmlose Anlegen
     einer Liste so gewichtig aussehen wie das Loeschen daneben. Die
     Gewichtung soll die Tragweite abbilden. */
  .group-actions [data-add-list-to]:hover { color: var(--accent-strong); background: transparent; }
  .nav-item-wrap:hover .nav-delete, .group-row:hover .nav-delete { opacity: 1; }
  /* Bei Tastaturbedienung muss der Knopf sichtbar sein, sonst steht der
     Fokus auf einem unsichtbaren Element - das gilt besonders hier, wo
     Enter eine Liste loescht. */
  .nav-delete:focus-visible, .row-delete:focus-visible { opacity: 1; }
  .nav-delete:hover { color: var(--urgent); background: var(--urgent-soft); }

  /* padding-right matches .nav-item's, so a group's count lands on the same
     line as every other row's count (see .nav-delete above). */
  .group-row { display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 10px 7px 6px; border-radius: var(--r-md); margin-top: 2px; position: relative; }
  .group-row.drag-ghost { opacity: 0.35; }
  .group-row:hover { background: var(--nav-hover); }
  .group-row:hover .nav-count { opacity: 0; }
  .group-chevron { width: 16px; height: 16px; flex-shrink: 0; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .group-chevron svg { transition: transform var(--dur-fast) var(--ease); }
  .group-chevron.collapsed svg { transform: rotate(-90deg); }
  .group-title { flex: 1; min-width: 0; text-overflow: ellipsis; border: none; background: transparent; font: inherit; font-size: var(--fs-sm); font-weight: var(--fw-strong); letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-soft); padding: 2px; border-radius: var(--r-sm); }
  /* Der Name ist das groesste Ziel der Gruppenzeile - und war als einziges
     Element mit Textcursor versehen. Ziehen funktionierte dort, aber der
     Zeiger sagte "hier wird getippt", also kam niemand auf die Idee. Beim
     Bearbeiten (fokussiert) ist der Textcursor richtig, vorher nicht. */
  .group-title { cursor: grab; }
  .group-title:focus { background: var(--surface); text-transform: none; cursor: text; }
  .group-title:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 1px; }

  .drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .drop-after { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .drop-into { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-soft); }

  .sidebar-spacer { flex: 1; }
  /* align-items: flex-end - der kleinere Gruppen-Knopf steht auf derselben
     Grundlinie wie der grosse Listen-Knopf, statt neben dessen Mitte zu
     schweben. */
  .sidebar-bottom-actions { display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 4px 2px; flex-shrink: 0; }
  .icon-action-btn { width: 30px; height: 30px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--chip-bg); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease, border-color var(--dur-fast) ease, transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) ease; }
  .icon-action-btn:hover { background: var(--chip-hover); color: var(--ink); border-color: var(--ink-faint); }
  .icon-action-btn:active { transform: scale(0.92); }
  .icon-action-btn.primary { width: 42px; height: 42px; border-radius: var(--r-lg); background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .icon-action-btn.primary svg { width: 15px; height: 15px; }
  .icon-action-btn.primary:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* --- Content: horizontal column stack --- */
  .content-area {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x proximity;
    height: 100%;
    background: var(--surface);
  }
  .content-area::-webkit-scrollbar { height: 8px; }
  .content-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: var(--r-md); }
  /* Transformed elements (the FLIP translateX/scaleX below) count toward
     their scrolling ancestor's scrollable-overflow area even though they
     don't affect real layout - during the animation a column can briefly
     report as "off to the right" and flash a scrollbar that has nothing
     real to scroll to. The final scroll position is already committed
     synchronously before the animation starts, so it's safe to just hide
     the scrollbar chrome for the animation's duration. */
  .content-area.anim-lock { overflow-x: hidden; }

  .column {
    position: relative;   /* Anker fuer den Zeilen-Kalender, siehe .row-cal */
    flex: 1 1 0%;
    min-width: 240px;
    height: 100%;
    border-right: 1px solid var(--line-soft);
    scroll-snap-align: start;
    transform-origin: left center;
  }
  .col-inner {
    height: 100%;
    display: flex;
    flex-direction: column;
    transform-origin: left center;
  }
  .column.col-animating, .col-inner.col-animating {
    transition: transform var(--dur-slow) var(--ease);
    will-change: transform;
  }

  .col-header { padding: 16px 16px 4px; flex-shrink: 0; }
  .col-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  /* Farbpunkt vor dem Listentitel. Er zeigt die Farbe und ist zugleich der
     Weg, sie zu ändern - ein Element, zwei Zwecke, kein Menü.
     margin statt padding: border-radius: 50% rechnet gegen die Border-Box,
     mit padding würde aus dem Kreis eine Ellipse. */
  .col-dot {
    width: 10px; height: 10px; border-radius: 50%; border: none; padding: 0;
    flex-shrink: 0; cursor: pointer; margin: 9px 2px 0 0;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) ease;
  }
  .col-dot:hover { transform: scale(1.25); }
  .col-dot:active { transform: scale(0.9); }
  /* Die Farbreihe klappt UNTER dem Titel auf, nicht daneben: Sonst rückte
     die Überschrift beim Öffnen zur Seite, und ein springender Titel ist
     unruhiger als eine zusätzliche Zeile. Kein schwebendes Fenster. */
  .color-strip {
    display: flex; gap: var(--sp-3); align-items: center;
    margin: 8px 0 2px;
  }
  @keyframes strip-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
  .color-strip.ist-neu { animation: strip-in var(--dur-base) var(--ease); }
  @media (prefers-reduced-motion: reduce) { .color-strip.ist-neu { animation: none; } }
  .color-swatch {
    width: 17px; height: 17px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) ease;
  }
  .color-swatch:hover { transform: scale(1.15); }
  /* Die gewählte Farbe trägt einen Ring aus der Grundfläche plus Kontur -
     nicht nur "etwas größer", das wäre allein über Größe kodiert. */
  .color-swatch.active { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-faint); }
  .col-title { font-size: var(--fs-xl); font-weight: var(--fw-bold); letter-spacing: -0.02em; line-height: 1.2; margin: 0; border: none; background: transparent; color: var(--ink); font-family: inherit; padding: 0; width: 100%; }
  .col-title.done { color: var(--ink-faint); text-decoration: line-through; }
  .col-title:focus { outline: none; }
  .col-meta { font-size: var(--fs-sm); color: var(--ink-faint); margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* padding: 0 matters on every icon button here - a <button> carries the
     browser's default 1px 6px padding, which was squeezing these 12px-wide
     icons down to 6-10px and making them look undersized next to the
     15px nav icons. */
  .col-close { width: 22px; height: 22px; padding: 0; border-radius: var(--r-sm); border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease, transform var(--dur-fast) var(--ease); }
  .col-close svg { flex-shrink: 0; }
  .col-close:hover { background: var(--line-soft); color: var(--ink); }
  .col-close:active { transform: scale(0.9); }

  .col-progress-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }

  /* War das lauteste Element der Seite: eine gefuellte Sandflaeche mitten
     in einer weissen Spalte, die die eigentlichen Aufgaben ueberstrahlt hat.
     Jetzt nur eine feine Linie darueber; Flaeche erst beim Hineinklicken. */
  .quick-add {
    margin: 0 16px 12px; display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-4) var(--sp-3); background: transparent;
    border: 1px solid transparent; border-radius: var(--r-md); flex-shrink: 0;
    transition: background-color var(--dur-fast) ease, border-color var(--dur-fast) ease;
  }
  .quick-add:hover { background: var(--line-soft); }
  .quick-add:focus-within { background: var(--surface-sunken); border-color: var(--line); }
  .quick-add svg { color: var(--accent); flex-shrink: 0; }
  .quick-add input { border: none; background: transparent; outline: none; font: inherit; font-size: var(--fs-md); color: var(--ink); flex: 1; min-width: 0; }
  .quick-add input::placeholder { color: var(--ink-faint); }

  .editor-toolbar { display: flex; gap: 6px; margin: 0 16px; padding-top: 10px; border-top: 1px solid var(--line-soft); flex-shrink: 0; }
  .insert-btn { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: var(--fw-strong); color: var(--ink-faint); background: transparent; border: 1px dashed var(--line); border-radius: var(--r-pill); padding: 4px 10px 4px 8px; cursor: pointer; font-family: inherit; transition: color var(--dur-fast) ease, border-color var(--dur-fast) ease, transform var(--dur-fast) var(--ease); }
  .insert-btn:hover { color: var(--ink-soft); border-color: var(--ink-faint); }
  .insert-btn:active { transform: scale(0.95); }

  .blocks { flex: 1; overflow-y: auto; padding: 4px 6px 24px; }

  .page-editor {
    min-height: 100%;
    /* Begrenzte Zeilenlaenge: lange Zeilen sind schwer zu lesen, und die
       Faelligkeits-Pillen driften sonst weit vom Aufgabentitel weg. */
    max-width: 680px;
    padding: 10px 12px;
    font-size: var(--fs-md);
    line-height: 1.65;
    color: var(--ink);
    white-space: pre-wrap;
    outline: none;
    cursor: text;
  }
  .page-editor:empty::before { content: attr(data-placeholder); color: var(--ink-faint); pointer-events: none; }
  /* A paragraph block. Every top-level child of the editor is either one of
     these or an .inline-embed - see the block model note in the JS. */
  .pe-line { min-height: 1.65em; }
  /* An empty paragraph sitting next to a task/image exists only so there is
     a caret position there - tasks would otherwise be unreachable to type
     between. Left at full line height it puts a blank line between every
     task and the list reads as loose, so it collapses to a thin strip and
     only opens up once the caret is actually in it. */
  /* Die Luecke nimmt gar keinen Platz ein, damit Aufgaben genauso dicht
     stehen wie zwei Textzeilen (die haben 0px Abstand). Getroffen wird sie
     trotzdem: ein unsichtbarer Streifen ueber der Blockgrenze faengt den
     Klick ab, und beim Druecken klappt die Zeile auf volle Hoehe auf -
     dadurch ist auch der Cursor nie kleiner als der Text. */
  .pe-line.pe-gap { min-height: 0; height: 0; overflow: hidden; }
  .pe-line.pe-gap.pe-open { height: auto; min-height: 1.65em; overflow: visible; }

  /* Die Einblend-Animation gehoert NUR an wirklich neue Bloecke - deshalb
     haengt sie an .ist-neu und nicht unbedingt an .inline-embed.
     Vorher stand sie hier ohne Bedingung, und weil jede Aenderung alle
     Zeilen neu erzeugt, blendeten sich bei JEDER Aktion saemtliche Zeilen
     neu ein: Kalender oeffnen, ein Datum waehlen, ein Kaestchen abhaken,
     eine Seite oeffnen. Nachgemessen mit document.getAnimations():
     sechs laufende block-in pro Klick. Der Nutzer sah das als staendiges
     "Refreshen" der Liste (2026-08-12). Die Klasse setzt
     einblendenNurNeu() nach jedem Aufbau. */
  .inline-embed { position: relative; margin: 0; padding-left: 16px; overflow: hidden; }
  /* Bis 2026-08-13 lief diese Animation auf der Browser-Vorgabe `ease`,
     waehrend dieselbe Animation an der Sidebar-Zeile die Hauskurve trug -
     ein Bild, zwei Bewegungen. Aufgefallen ist es erst, als die
     Sidebar-Zeile dazukam und test_stimmigkeit.js beide nebeneinander
     gemessen hat. */
  .inline-embed.ist-neu { animation: block-in var(--dur-base) var(--ease); }
  .inline-embed.drag-ghost { opacity: 0.4; }
  .inline-embed.drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .inline-embed.drop-after { box-shadow: inset 0 -2px 0 0 var(--accent); }
  /* Dieselbe Form wie in der Sidebar: Dort sitzt die Ablagemarke auf einer
     Zeile mit --r-md, und der inset-Schatten folgt der Rundung - die Linie
     biegt an den Enden weich ab. An der Aufgabenzeile lief sie bis
     2026-08-13 hart und eckig aus, weil .inline-embed keinen Radius hat.
     Es ist dieselbe Aussage ("hier landet es"), also muss sie gleich
     aussehen. Der Radius gilt NUR im Ablagezustand: Dauerhaft gesetzt
     wuerde er zusammen mit overflow:hidden den Ziehgriff an den Ecken
     beschneiden, ohne dass es dafuer einen Grund gaebe. */
  .inline-embed.drop-before,
  .inline-embed.drop-after,
  .inline-embed.drop-into { border-radius: var(--r-md); }

  /* Explicit drag handle. Dragging embeds is driven by pointer events, not
     the native HTML5 drag API: these blocks live inside a contenteditable,
     where the browser runs its own built-in drag/move behaviour for editable
     content and a long-press starts a native text-selection drag - both
     hijack the same gesture and fight any custom handler. A dedicated grip
     also keeps dragging from competing with clicking the row to open it. */
  .embed-grip {
    position: absolute; left: 0; top: 0; bottom: 0; width: 15px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); opacity: 0; cursor: grab;
    transition: opacity var(--dur-fast) ease, color var(--dur-fast) ease;
    touch-action: none; user-select: none;
  }
  /* Der Griff ist der einzige Hinweis darauf, dass sich die Zeile ziehen
     laesst. Bei 0,55 war er kaum zu erkennen - man kam gar nicht auf die
     Idee, es zu versuchen. */
  .inline-embed:hover .embed-grip { opacity: 0.85; }
  .embed-grip:hover { opacity: 1 !important; color: var(--ink-soft); }
  .embed-grip:active { cursor: grabbing; }
  /* --- Rueckmeldung beim Ziehen ---
     Vorher gab es nur die gedaempfte Quelle und den Rahmen am Ziel. Auf dem
     Weg vom Editor bis in die Sidebar - quer durchs Fenster - passierte
     nichts, und die Geste fuehlte sich an, als wuerde sie nicht
     funktionieren. */

  /* Das mitziehende Etikett: zeigt, WAS man zieht, und folgt dem Zeiger.
     Bewegt wird ausschliesslich per transform (docs/spec.md, Bewegung). */
  .drag-label {
    position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none;
    display: flex; align-items: center; gap: 6px; max-width: 260px;
    padding: 6px 10px; border-radius: var(--r-md);
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--el-2); color: var(--ink);
    font-size: var(--fs-sm); font-weight: var(--fw-medium);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drag-label svg { color: var(--ink-faint); flex-shrink: 0; }
  /* Der Zeiger bleibt waehrend der ganzen Geste "greifend" - auch weit weg
     vom Griff, wo sonst wieder der Textcursor erschiene. */
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
  /* Sobald eine Aufgabe gezogen wird, zeigen die Listen, dass sie Ziele
     sind. Ohne das muss man raten, ob die Geste hier ueberhaupt etwas
     bewirkt. Zurueckhaltend: eine Kontur, keine Flaeche. */
  #sidebar.drop-armed .nav-item[data-list] {
    box-shadow: inset 0 0 0 1px var(--accent-line);
    border-radius: var(--r-md);
  }
  #sidebar.drop-armed .nav-item[data-list].drop-into {
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  @keyframes block-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  .inline-embed.removing { animation: none; transition: height var(--dur-base) var(--ease), opacity var(--dur-base) ease, margin var(--dur-base) ease; opacity: 0 !important; margin: 0 !important; }
  @media (prefers-reduced-motion: reduce) { .inline-embed.ist-neu { animation: none; } .inline-embed.removing { transition: opacity var(--dur-fast) ease; } }
  .removing { transition: height var(--dur-base) var(--ease), opacity var(--dur-base) ease, margin var(--dur-base) ease; opacity: 0 !important; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .removing { transition: opacity var(--dur-fast) ease; } }

  /* Nur noch ein kleiner Randabstand: Der Loeschknopf steht seit
     2026-08-07 im Fluss hinter der Pille, nicht mehr am rechten Rand -
     es ist also keine Spur mehr freizuhalten. */
  .inline-embed .task-row { padding-right: 6px; }

  /* Rueckgaengig-Zeile: steht an der Stelle, an der geloescht wurde.
     Dadurch bleibt der Platz belegt - die Liste rutscht beim Loeschen nicht
     hoch und beim Zurueckholen nicht wieder runter. Eine schwebende Meldung
     unten im Fenster wurde verworfen: Sie verdeckt Inhalt (im Entwurf
     ausgerechnet das Erfassungsfeld) und steht immer am selben Ort, egal wo
     geloescht wurde. Siehe docs/decisions.md, 2026-08-08. */
  .undo-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; margin-right: 24px;
    border: 1px dashed var(--line); border-radius: var(--r-md);
    color: var(--ink-faint); font-size: var(--fs-md);
  }
  .undo-row-name { text-decoration: line-through; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .undo-row-meta { flex-shrink: 0; }
  .undo-btn {
    margin-left: auto; flex-shrink: 0; border: none; background: transparent;
    color: var(--accent-strong); font: inherit; font-size: var(--fs-sm);
    font-weight: var(--fw-strong); padding: 3px 8px; border-radius: var(--r-pill); cursor: pointer;
    transition: background-color var(--dur-fast) ease;
  }
  .undo-btn:hover { background: var(--accent-soft); }

  .block-image { display: flex; align-items: center; gap: 8px; padding: 12px 12px; border: 1px dashed var(--line); border-radius: var(--r-md); color: var(--ink-faint); font-size: var(--fs-sm); margin-right: 24px; }
  .block-image svg { flex-shrink: 0; }

  /* Steht im Fluss direkt hinter dem Inhalt, nicht am rechten Zeilenrand.
     Am Rand klaffte zwischen Inhalt und Knopf eine Luecke von mehreren
     hundert Pixeln, sobald das Fenster breit war.
     Er behaelt seinen Platz auch unsichtbar (opacity statt display), damit
     die Zeile beim Ueberfahren nicht springt. */
  /* Datum an der Zeile - EIN Steuerelement, nicht drei. Ohne Datum ein
     Kalendersymbol beim Ueberfahren; mit Datum ist die Pille selbst der
     Knopf. Sie zeigt das Datum ohnehin schon an, also braucht es daneben
     keinen zweiten Ort dafuer. */
  .row-due-cal {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; padding: 0; margin-left: 2px; flex-shrink: 0;
    border: none; background: transparent; color: var(--ink-faint);
    border-radius: var(--r-sm); cursor: pointer;
    opacity: 0; transition: opacity var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .inline-embed:hover .row-due-cal, .row-due-cal:focus-visible { opacity: 1; }
  .row-due-cal:hover { color: var(--accent-strong); }
  /* Die Pille ist auf editierbaren Zeilen ein Knopf. Eine feine Kontur beim
     Ueberfahren der Zeile verraet, dass man sie anfassen kann - ohne sie
     saehe sie aus wie reine Anzeige. */
  button.row-due-pill { font-family: inherit; cursor: pointer; }
  .inline-embed:hover .row-due-pill { box-shadow: inset 0 0 0 1px var(--accent-line); }
  .inline-embed:hover .row-due-pill.overdue { box-shadow: inset 0 0 0 1px var(--urgent); }

  /* Der Kalender einer Zeile haengt an der SPALTE, nicht an der Zeile:
     .inline-embed hat overflow: hidden und wuerde ihn abschneiden. */
  .due-cal.row-cal { position: absolute; z-index: 45; }

  .row-delete { opacity: 0; width: 22px; height: 22px; padding: 0; flex-shrink: 0; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: var(--r-sm); margin-left: 2px; transition: opacity var(--dur-fast) ease, color var(--dur-fast) ease, background-color var(--dur-fast) ease, transform var(--dur-fast) var(--ease); }
  .row-delete svg { flex-shrink: 0; }
  .inline-embed:hover .row-delete { opacity: 1; }
  .row-delete:hover { color: var(--urgent); background: var(--urgent-soft); }
  .row-delete:active { transform: scale(0.88); }

  .page-editor.drag-over { background: var(--accent-soft); }

  .task-row { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: var(--r-md); cursor: pointer; transition: background-color var(--dur-fast) ease, transform var(--dur-fast) var(--ease); }
  .task-row:hover { background: var(--line-soft); }
  .task-row:active { transform: scale(0.985); }

  .check-btn { width: 17px; height: 17px; flex-shrink: 0; border-radius: var(--r-sm); border: 1.5px solid var(--ink-faint); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color var(--dur-fast) ease, border-color var(--dur-fast) ease, transform var(--dur-fast) var(--ease-spring); }
  .check-btn.done { background: var(--done); border-color: var(--done); color: var(--done-ink); }
  .check-btn:active { transform: scale(0.85); }
  .check-btn svg { opacity: 0; transform: scale(0.4); transition: opacity var(--dur-fast) ease, transform var(--dur-slow) var(--ease-spring); }
  .check-btn.done svg { opacity: 1; transform: scale(1); }

  /* Das Kaestchen springt beim Abhaken kurz an und dreht sich dabei minimal
     - und genauso beim Zuruecknehmen (Wunsch des Nutzers 2026-08-13).
     Uebernommen wurde nur die BEWEGUNG einer Vorlage (uiverse,
     "keyframes-fill"); Form, Farben und Dauer bleiben unsere: unser
     Rechteck statt des Kreises, --dur-slow statt der 0,5s der Vorlage.

     Sie laeuft auf --ease und NICHT auf --ease-spring: Der Ueberschwinger
     steckt schon in den Bildern (1.2 bei 50%). Mit einer federnden Kurve
     obendrauf schwaenge es zweimal ueber - und eine vierte Kurve waere es
     ohnehin nicht, die Skala laesst genau drei zu (docs/spec.md 3).

     Abweichung von der Vorlage, bewusst: Die faengt bei scale(0) an, weil
     dort ein Symbol aus dem Nichts erscheint. Unser Kaestchen ist schon da
     und wechselt nur seinen Zustand - bei scale(0) saehe es aus, als waere
     es kurz weg gewesen. 0.6 sagt "das hat sich geaendert" statt "das ist
     neu".

     WICHTIG - die Klasse setzt der KLICK, nicht der Zustand. Haengt man sie
     an .done, laeuft sie bei jedem Neuaufbau fuer jede erledigte Aufgabe
     erneut los. Das ist woertlich das "Refreshen der Liste", das der Nutzer
     am 2026-08-12 gemeldet hat (siehe Kommentar bei .inline-embed.ist-neu). */
  .check-btn.gerade-abgehakt { animation: check-pop var(--dur-slow) var(--ease); }
  @keyframes check-pop {
    0%   { transform: scale(0.6); }
    50%  { transform: scale(1.2) rotate(15deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { .check-btn.gerade-abgehakt { animation: none; } }

  /* flex: 0 1 auto statt 1 - der Titel nimmt nur so viel Platz, wie sein
     Text braucht, und schrumpft erst, wenn es eng wird. Mit flex: 1 dehnte
     er sich ueber die ganze Zeile und drueckte die Faelligkeits-Pille ans
     rechte Ende: bei 680px Zeilenlaenge lagen 534px zwischen Titelanfang
     und Pille. Die 680px-Grenze war schon gegen dieses Wegdriften gesetzt,
     hat es aber nur gedaempft statt behoben.
     Eine rechtsbuendige Datumsspalte waere die uebliche Alternative - sie
     traegt hier nicht, weil nur ein Teil der Aufgaben ein Datum hat und
     dadurch kein durchgehender Rand zum Abscannen entsteht. min-width: 0
     bleibt noetig, damit lange Titel weiterhin mit ... kuerzen. */
  .task-title { font-size: var(--fs-md); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color var(--dur-base) ease; }
  /* Fortschritt und Pille duerfen nicht mitschrumpfen - sonst wird bei
     einem langen Titel die Information gekuerzt statt des Titels. */
  .task-row .mini-progress, .task-row .due-pill { flex-shrink: 0; }
  .task-row.done .task-title { color: var(--ink-faint); text-decoration: line-through; }

  .list-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .mini-progress { width: 34px; height: 5px; border-radius: var(--r-pill); background: var(--line); flex-shrink: 0; overflow: hidden; }
  /* Fortschritt an einer Aufgabenzeile - dieselbe Bewegung wie der Balken
     im Aufraeum-Modus: transform statt width (Layout-Eigenschaften werden
     nie animiert), Kurve --ease-lauf (langsam an, immer schneller, rastet
     ein, kein Ueberschwingen) und dieselbe Dauer. Es ist dieselbe Aussage -
     "es ist mehr geworden" -, also muss sie sich auch gleich anfuehlen.
     Vorher lief hier gar keine Animation: Sie stand auf width und das
     Element wird bei jeder Aenderung neu erzeugt. */
  .mini-progress > span {
    display: block; height: 100%; width: 100%; background: var(--accent);
    border-radius: var(--r-pill); transform-origin: left center;
    transition: transform calc(var(--dur-slow) + var(--dur-base)) var(--ease-lauf);
  }
  @media (prefers-reduced-motion: reduce) { .mini-progress > span { transition: none; } }

  .due-pill { font-size: var(--fs-xs); font-weight: var(--fw-strong); padding: 4px 7px; border-radius: var(--r-pill); background: var(--line-soft); color: var(--ink-soft); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .due-pill.today { background: var(--urgent-soft); color: var(--urgent); }
  /* Überfällig traegt zusaetzlich einen Rahmen: Farbe allein darf nie der
     einzige Traeger einer Information sein (Farbfehlsichtigkeit). */
  .due-pill.overdue { background: var(--urgent-soft); color: var(--urgent); box-shadow: inset 0 0 0 1px var(--urgent); }
  .group-heading.overdue-heading { color: var(--urgent); }

  /* --- Fälligkeits-Steuerung ---
     Eine dauerhaft sichtbare Zeile im Kopf der Aufgabenseite statt eines
     Aufklappmenues: Schnellwahl "Heute"/"Morgen" plus ein Chip fuer jedes
     andere Datum. "Naechste Woche" ist bewusst NICHT dabei - fuer einen
     Termin in einer Woche greift man ohnehin zum Kalender, und die
     gewonnene Breite braucht die Zeile in der schmalsten Spalte.
     nowrap ist Absicht: Bricht die Zeile, ist sie zu breit, und das soll
     auffallen statt sich still in zwei Zeilen zu verstecken. */
  .due-block { position: relative; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .due-row { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: nowrap; min-width: 0; }
  button.due-pill { border: none; font-family: inherit; cursor: pointer; }
  .due-seg { display: flex; background: var(--surface-sunken); border: 1px solid var(--line); border-radius: var(--r-md); padding: 3px; flex-shrink: 0; }
  .due-seg-btn {
    border: none; background: transparent; color: var(--ink-soft);
    font: inherit; font-size: var(--fs-sm); font-weight: var(--fw-medium);
    padding: 4px 11px; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap;
    transition: color var(--dur-fast) ease, background-color var(--dur-fast) ease;
  }
  .due-seg-btn:not(.active):hover { color: var(--ink); }
  .due-seg-btn.active { background: var(--surface); color: var(--ink); font-weight: var(--fw-strong); box-shadow: var(--el-1); }

  /* Chip und Loeschknopf sitzen in einer gemeinsamen Pille, damit die Zeile
     aus zwei Bloecken besteht und nicht aus dreien. */
  .due-chip {
    display: inline-flex; align-items: center; min-width: 0;
    background: var(--line-soft); color: var(--ink-soft);
    border-radius: var(--r-pill); padding: 0 2px 0 0;
    transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .due-chip.set { background: var(--accent-soft); color: var(--accent-strong); }
  /* Ueberfaellig traegt zusaetzlich einen Rahmen - Farbe darf nie der
     einzige Traeger einer Information sein. */
  .due-chip.today { background: var(--urgent-soft); color: var(--urgent); }
  .due-chip.overdue { background: var(--urgent-soft); color: var(--urgent); box-shadow: inset 0 0 0 1px var(--urgent); }
  .due-chip-label {
    position: relative; display: inline-flex; align-items: center; gap: 6px; min-width: 0;
    font-size: var(--fs-xs); font-weight: var(--fw-strong); font-variant-numeric: tabular-nums;
    padding: 5px 9px; border-radius: var(--r-pill); cursor: pointer; white-space: nowrap;
  }
  .due-chip-label > span { overflow: hidden; text-overflow: ellipsis; }
  .due-chip-label svg { flex-shrink: 0; }
  .due-chip-label { border: none; background: transparent; font-family: inherit; color: inherit; }

  /* Kalender. Klappt IM FLUSS unter der Zeile auf, nicht als schwebendes
     Fenster - dadurch kann er nicht ueber den Fensterrand hinauslaufen,
     ohne eine einzige Zeile Positionierungslogik. Sieben Spalten a 26px
     plus Innenabstand passen in die schmalste Spalte (240px). */
  /* Er schwebt ueber dem Inhalt, aber INNERHALB der Spalte: an .due-block
     verankert, nicht am Fenster. Dadurch schiebt er nichts nach unten (ein
     Kalender, der die Aufgabenliste verrueckt, ist unruhig) und kann
     trotzdem nicht am Fensterrand abgeschnitten werden - das war der Grund,
     ihn zuerst in den Fluss zu setzen. Beides zugleich geht nur so.
     Breite 199px, damit er auch in die schmalste Spalte passt: 240px
     minus 2x16px Innenabstand des Kopfes laesst 208px. */
  .due-cal {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 40;
    padding: 8px; width: max-content;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); box-shadow: var(--el-2);
    /* Nur beim Oeffnen einblenden, nicht bei jedem Neuaufbau der Spalte -
       dieselbe Ursache wie bei .inline-embed. */
  }
  .due-cal.ist-neu { animation: strip-in var(--dur-base) var(--ease); }
  @media (prefers-reduced-motion: reduce) { .due-cal.ist-neu { animation: none; } }
  .due-cal-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-bottom: var(--sp-3); }
  .due-cal-month { font-size: var(--fs-sm); font-weight: var(--fw-strong); color: var(--ink); }
  .due-cal-nav {
    width: 22px; height: 22px; padding: 0; border: none; background: transparent;
    color: var(--ink-faint); border-radius: var(--r-sm); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .due-cal-nav:hover { background: var(--chip-hover); color: var(--ink); }
  .due-cal-grid { display: grid; grid-template-columns: repeat(7, 25px); gap: 1px; }
  .due-cal-wd { font-size: var(--fs-xs); font-weight: var(--fw-strong); color: var(--ink-faint); text-align: center; padding-bottom: 4px; }
  .due-cal-day {
    height: 25px; padding: 0; border: none; background: transparent;
    font: inherit; font-size: var(--fs-sm); font-variant-numeric: tabular-nums;
    color: var(--ink); border-radius: var(--r-sm); cursor: pointer;
    transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .due-cal-day:hover { background: var(--chip-hover); }
  /* Tage der Nachbarmonate bleiben anklickbar, treten aber zurueck. */
  .due-cal-day.fremd { color: var(--ink-faint); opacity: 0.5; }
  /* Heute traegt einen Ring, das gewaehlte Datum eine Flaeche - zwei
     verschiedene Traeger, damit beide gleichzeitig lesbar sind. */
  .due-cal-day.heute { box-shadow: inset 0 0 0 1px var(--ink-faint); font-weight: var(--fw-strong); }
  .due-cal-day.gewaehlt { background: var(--accent); color: var(--accent-ink); font-weight: var(--fw-strong); }
  .due-cal-day.gewaehlt:hover { background: var(--accent); }
  /* Im Aufraeum-Modus steht derselbe Kalender IM FLUSS statt zu schweben:
     Die Seite ist leer genug, es gibt nichts zu verdecken, und schwebende
     Flaechen sind hier die Ausnahme (concept.md, Design-Richtung). */
  .due-cal.tidy-cal { position: static; margin-top: var(--sp-4); box-shadow: none; }
  .due-chip-x {
    width: 20px; height: 20px; padding: 0; border: none; background: transparent;
    color: currentColor; opacity: 0.55; border-radius: 50%; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity var(--dur-fast) ease;
  }
  .due-chip-x:hover { opacity: 1; }
  .due-chip-x svg { width: 11px; height: 11px; }
  .col-progress-row:empty { display: none; }

  /* --- Überschrift und Trenner --- */
  .pe-line.pe-h { font-size: var(--fs-lg); font-weight: var(--fw-bold); letter-spacing: -0.01em; color: var(--ink); margin: 10px 0 2px; }
  .pe-line.pe-h:first-child { margin-top: 0; }
  .pe-divider { height: 1px; background: var(--line); border: none; margin: 12px 2px; }

  /* --- Auswahl-Leiste (erscheint über markiertem Text) --- */
  .sel-bar {
    position: fixed; z-index: 60; display: flex; align-items: center; gap: 2px;
    background: var(--ink); border-radius: var(--r-md); padding: 4px;
    box-shadow: var(--el-2);
    animation: sel-bar-in var(--dur-fast) var(--ease);
  }
  @keyframes sel-bar-in { from { opacity: 0; transform: translateY(3px) scale(0.97); } to { opacity: 1; transform: none; } }
  .sel-btn {
    min-width: 27px; height: 27px; padding: 0 7px; border: none; background: transparent;
    color: var(--paper); border-radius: 7px; cursor: pointer; font-family: inherit;
    font-size: var(--fs-sm); display: flex; align-items: center; justify-content: center;
    transition: background-color var(--dur-fast) ease;
  }
  .sel-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .sel-btn.b { font-weight: var(--fw-bold); }
  .sel-btn.i { font-style: italic; font-family: Georgia, serif; }
  .sel-btn.s { text-decoration: line-through; }
  .sel-sep { width: 1px; height: 15px; background: rgba(255, 255, 255, 0.2); margin: 0 4px; }

  /* --- "/"-Blockmenü --- */
  /* Die Einblendung hiess frueher "due-menu-in" und war beim
     Faelligkeitsmenue definiert. Mit dessen Wegfall waere sie mitgegangen
     und das Menue haette lautlos ohne Animation aufgeschlagen - deshalb
     steht sie jetzt bei ihrem einzigen Verwender und heisst neutral. */
  @keyframes menu-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .slash-menu {
    position: fixed; z-index: 60; min-width: 208px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--el-2); padding: 6px;
    display: flex; flex-direction: column; gap: 2px;
    animation: menu-in var(--dur-fast) var(--ease);
  }
  .slash-opt {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font: inherit; font-size: var(--fs-sm); text-align: left; color: var(--ink);
    background: transparent; border: none; border-radius: var(--r-md); padding: 7px 8px; cursor: pointer;
  }
  .slash-opt:hover, .slash-opt.active { background: var(--line-soft); }
  .slash-opt svg { color: var(--ink-faint); flex-shrink: 0; }
  .slash-hint { font-size: var(--fs-xs); color: var(--ink-faint); margin-left: auto; }

  .group-heading { display: flex; align-items: center; gap: 8px; padding: 12px 8px 6px; font-size: var(--fs-xs); font-weight: var(--fw-strong); color: var(--ink-soft); }
  .group-heading:first-child { padding-top: 4px; }

  .empty-state {
    text-align: center; padding: 56px 24px; color: var(--ink-faint); font-size: var(--fs-md);
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
  }
  .empty-state .empty-mark { color: var(--accent); opacity: 0.5; }
  .empty-state .empty-mark .brand-logo { height: 34px; }
  .empty-state .empty-sub { font-size: var(--fs-sm); color: var(--ink-faint); opacity: 0.8; }

  /* Segmentierter Schalter mit gleitendem Knopf. Er steht direkt in der
     Sidebar, wo vorher der Knopf "Optionen" ein Aufklapp-Panel oeffnete:
     Ein Menue fuer eine einzige Einstellung mit zwei Werten ist ein
     Umweg - man sieht die aktuelle Wahl nicht, ohne es zu oeffnen.
     Kein gap zwischen den Feldern: sie muessen exakt gleich breit sein,
     sonst stimmt der Weg des Knopfes (translateX(100%) = genau ein Feld)
     nicht mehr. --seg-count wird von der Auszeichnung gesetzt, damit
     CSS und JS nicht auseinanderlaufen koennen. */
  .theme-segmented { position: relative; display: flex; background: var(--surface-sunken); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px; margin-top: 4px; }
  /* Der Knopf ist ein eigenes Element und wird ausschliesslich ueber
     transform bewegt, nie ueber left/width. Layout-Eigenschaften zu
     animieren erzwingt in jedem Bild ein neues Layout; transform laeuft
     im Compositor. Gilt in dieser App durchgaengig - siehe docs/spec.md,
     Abschnitt "Bewegung". */
  .theme-seg-thumb {
    position: absolute; left: 4px; top: 4px; bottom: 4px;
    width: calc((100% - 8px) / var(--seg-count, 2));
    background: var(--surface); border-radius: var(--r-sm);
    box-shadow: var(--el-1); pointer-events: none;
    /* --ease-lauf statt --ease (Wunsch des Nutzers, 2026-08-13): dieselbe
       Kurve wie der Fortschrittsbalken. Sie faengt langsam an, wird
       schneller und rastet ein - und schwingt bewusst NICHT ueber. Genau
       das will man hier: Der Knopf landet auf einer von zwei festen
       Stellen. Ein Ueberschwinger liesse ihn kurz ueber das Feld
       hinausrutschen, auf dem er stehen bleiben soll.
       Dauer bleibt --dur-base; nur die Kurve wurde getauscht. */
    transition: transform var(--dur-base) var(--ease-lauf);
  }
  @media (prefers-reduced-motion: reduce) { .theme-seg-thumb { transition: none; } }
  .theme-seg-btn { position: relative; z-index: 1; flex: 1; border: none; background: transparent; color: var(--ink-faint); font: inherit; font-size: var(--fs-sm); font-weight: var(--fw-medium); padding: 6px 4px; border-radius: var(--r-sm); cursor: pointer; transition: color var(--dur-fast) ease; }
  .theme-seg-btn.active { color: var(--ink); font-weight: var(--fw-strong); }
  .theme-seg-btn:not(.active):hover { color: var(--ink-soft); }

  /* ==================== Aufräum-Modus (docs/spec.md 2.8) ====================
     Ein gefuehrter Durchgang durch den Eingang. KEIN Overlay: Die Spalte
     tauscht ihren Inhalt aus, Sidebar und Fensterrahmen bleiben stehen.
     Das folgt der Design-Richtung, hat hier aber ein eigenes Argument -
     die Zielliste in der Sidebar ist das Ziel der Wegflug-Bewegung und
     muss deshalb sichtbar bleiben. Ein Overlay haette ausgerechnet die
     Belohnung verdeckt, um die es geht. */

  .tidy-start {
    display: inline-flex; align-items: center; gap: var(--sp-3);
    border: 1px solid var(--line); background: var(--chip-bg); color: var(--ink-soft);
    font: inherit; font-size: var(--fs-sm); font-weight: var(--fw-medium);
    padding: 5px 12px 5px 9px; border-radius: var(--r-pill); cursor: pointer;
    transition: background-color var(--dur-fast) ease, color var(--dur-fast) ease, transform var(--dur-fast) var(--ease);
  }
  .tidy-start:hover { background: var(--chip-hover); color: var(--ink); }
  .tidy-start svg { color: var(--accent); }

  .tidy { display: flex; flex-direction: column; flex: 1 1 auto; height: 100%; min-height: 0; }
  .tidy-head { padding: 16px 24px 0; }
  .tidy-head-top { display: flex; align-items: baseline; gap: var(--sp-5); }
  /* "Aufraeumen" ist der NAME DES MODUS, nicht der Gegenstand des
     Bildschirms. Es stand vorher auf fs-xl und damit groesser als die
     Aufgabe, um die es geht - in der ganzen App gilt aber: fs-xl traegt
     das, was man gerade ansieht. Deshalb hier zurueckgenommen auf die
     Rubrikenschrift dieser Seite; das fs-xl bekommt der Aufgabentitel. */
  .tidy-title { font-size: var(--fs-xs); font-weight: var(--fw-strong); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-faint); }
  .tidy-quit {
    margin-left: auto; border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: var(--fs-sm); font-weight: var(--fw-medium);
    padding: 4px 8px; border-radius: var(--r-sm); cursor: pointer;
    transition: color var(--dur-fast) ease, background-color var(--dur-fast) ease;
  }
  .tidy-quit:hover { color: var(--ink); background: var(--line-soft); }

  .tidy-meta { margin-top: var(--sp-2); font-size: var(--fs-sm); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  /* Der Zaehler rollt, statt umzuspringen: die alte Zahl nach oben hinaus,
     die neue von unten herein. Der Kasten schneidet ab, damit die Bewegung
     einen Rand hat - ohne ihn wanderte die Ziffer sichtbar durch die
     Nachbartexte. */
  .tidy-zahl { display: inline-block; overflow: hidden; vertical-align: bottom; }
  .tidy-zahl > span { display: inline-block; }
  .tidy-meta.rollt .tidy-zahl > span { animation: tidy-roll var(--dur-slow) var(--ease-lauf); }
  @keyframes tidy-roll { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Fortschritt ueber transform: scaleX, nicht ueber width - dieselbe Regel
     wie ueberall (docs/spec.md, "Bewegung"). Nur hier darf die Bewegung
     ueberschwingen. */
  .tidy-bar { position: relative; margin-top: var(--sp-5); height: 3px; border-radius: var(--r-pill); background: var(--line); overflow: hidden; }
  .tidy-bar > span {
    display: block; height: 100%; width: 100%; border-radius: var(--r-pill);
    background: var(--accent); transform-origin: left center;
    /* Bewusst laenger als jede andere Bewegung der App - aber KEIN neuer
       Skalenwert, sondern zwei vorhandene Stufen addiert (400 + 200 = 600).
       Der Balken ist das Einzige, das man beim Laufen ZUSEHEN soll; bei
       400 ms war er am Ziel, bevor der Blick von der weggeflogenen Karte
       zurueck war. */
    transition: transform calc(var(--dur-slow) + var(--dur-base)) var(--ease-lauf);
  }
  /* Kerben: eine je Aufgabe. Der Balken laeuft damit sichtbar auf den
     NAECHSTEN PUNKT zu, statt nur laenger zu werden - jeder Schritt ist ein
     abgeschlossenes Stueck, kein Fortschritt ins Unbestimmte. Ab einer
     bestimmten Menge werden die Stuecke zu schmal, um noch etwas zu sagen;
     dann traegt der Balken keine Kerben (siehe --tidy-n in renderTidy). */
  .tidy-bar[data-kerben]::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to right,
      transparent 0, transparent calc(100% / var(--tidy-n) - 2px),
      var(--surface) calc(100% / var(--tidy-n) - 2px), var(--surface) calc(100% / var(--tidy-n)));
  }

  /* Senkrecht mittig: Die eine Aufgabe soll der Gegenstand des Bildschirms
     sein, nicht ein Formular, das oben klebt - und die Karte verlaesst beim
     Wegfliegen die Mitte, was die Bewegung deutlicher macht. "safe center"
     ist wichtig: Bei einer langen Aufgabe waere zentrierter Inhalt sonst
     oben abgeschnitten und nicht mehr erreichbar. */
  /* Oben angesetzt, nicht mittig. Zwischenzeitlich stand hier
     "justify-content: safe center" - das sah bei einer kurzen Aufgabe nach
     einem Loch zwischen Balken und Titel aus, weil der Kopfbereich oben
     klebt und die Karte in die Mitte rutschte. Der Zusammenhang zwischen
     Fortschritt und Aufgabe ist wichtiger als eine optische Mitte. */
  .tidy-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px; display: flex; flex-direction: column; }

  .tidy-card { flex: 0 0 auto; padding: var(--sp-6) 0 var(--sp-4); }

  /* "Erledigt" steht UNTEN am Rand des Bereichs, mittig, mit Abstand zu den
     Rubriken - nicht als vierte Rubrik darunter. Zwei Gruende:
     Eine Rubrik ("ODER") mit genau EINEM Knopf darunter liest sich wie ein
     Rest, der uebrig geblieben ist - Rubriken buendeln mehrere Dinge. Und

     laesst ihn bei langem Inhalt (offener Kalender) einfach nachruecken. */

     Bild und damit der optische Schwerpunkt: Die Seite luede zum Abhaken
     ein, obwohl sie zum EINSORTIEREN einladen soll. Er hebt sich so klar
     von den grauen Pillen ab, ohne sie zu ueberstimmen. */

  .tidy-erledigt:active { transform: scale(0.96); }
  /* fs-xl: Der Aufgabentitel ist der Gegenstand dieses Bildschirms. In der
     ganzen App traegt fs-xl genau das - eine Spalte zeigt ihren Titel so.
     Vorher stand er auf fs-lg und war damit kleiner als das Wort
     "Aufräumen" darueber, was die Rangfolge der App auf den Kopf stellte. */

     text-decoration sich nicht animieren laesst. */

  // geoeffneten Spalten ab diesem Knoten geschlossen. Stand vorher an zwei
  // Stellen einzeln im Code.
  function closePanelsFrom(nodeId) {
    var i = state.panelStack.indexOf(nodeId);
    if (i >= 0) state.panelStack = state.panelStack.slice(0, i);
  }

  function moveTaskToList(taskId, ownerId, targetListId) {
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    var target = findList(targetListId);
    if (!owner || !target || owner === target) return false;

    var kids = childrenOf(owner);
    var ki = kids.findIndex(function (k) { return k.id === taskId; });
    if (ki < 0) return false;
    var node = kids[ki];

    kids.splice(ki, 1);
    var bi = owner.blocks.findIndex(function (b) { return b.id === taskId; });
    if (bi >= 0) owner.blocks.splice(bi, 1);
    // Sonst bleiben zwei Fuellzeilen nebeneinander stehen und werden zu
    // echten Leerzeilen - dieselbe Ursache wie beim Aufraeum-Modus.
    leereAbsaetzeVerschmelzen(owner);

    childrenOf(target).push(node);
    target.blocks.push({ type: "task", id: node.id });

    // Eine offene Spalte, die auf die verschobene Aufgabe zeigt, wuerde
    // sonst auf einen Ort verweisen, den es in diesem Zweig nicht mehr gibt.
    closePanelsFrom(taskId);

    // Der bisherige Besitzer kann durch den Weggang fertig werden.
    if (owner.subtasks) {
      owner.done = owner.subtasks.length > 0 && owner.subtasks.every(function (x) { return x.done; });
      recomputeAncestors(owner.id);
    }
    return true;
  }

  // --- Aufgabe in eine andere Aufgabe (= Unteraufgabe) ---
  //
  // Bis hierher liess sich eine Aufgabe nur auf eine LISTE in der Sidebar
  // ziehen. Eine Aufgabe unter eine andere zu haengen ging gar nicht, obwohl
  // das Datenmodell beliebig tiefe Verschachtelung kennt (spec.md 1).
  //
  // Anmerkung, bewusst nicht angefasst: moveTaskToList() oben macht das
  // Aushaengen von Hand, obwohl es knotenAushaengen() gibt - dieselbe Arbeit
  // an zwei Stellen. Hier wird der Helfer benutzt.

  // Enthaelt der Teilbaum unter `wurzel` die Aufgabe `id`? Die Wurzel selbst
  // zaehlt mit: Eine Aufgabe in sich selbst zu haengen ist derselbe Fehler.
  function istImTeilbaum(wurzel, id) {
    if (!wurzel) return false;
    if (wurzel.id === id) return true;
    for (var i = 0; i < wurzel.subtasks.length; i++) {
      if (istImTeilbaum(wurzel.subtasks[i], id)) return true;
    }
    return false;
  }

  // Darf `quelleId` unter `zielId` haengen? Das ist die Frage, die BEIM
  // ZIEHEN gestellt wird, damit im eigenen Unterbau erst gar keine Ablage
  // angeboten wird (Entscheidung des Nutzers, 2026-08-13): Man sieht, dass
  // dort nichts hingeht, statt es nach dem Loslassen zu erfahren.
  //
  // Warum das kein theoretischer Fall ist: Zieht man "Urlaub planen" auf ihre
  // eigene Unteraufgabe "Fluege vergleichen", entstuende ein Baum, der sich
  // selbst enthaelt. recomputeAncestors() traegt gegen genau diese Lage schon
  // eine Notbremse ("would loop forever and freeze the whole app") - besser,
  // die Lage entsteht gar nicht erst.
  function darfHineinZiehen(quelleId, zielId) {
    if (!quelleId || !zielId || quelleId === zielId) return false;
    var quelle = findTaskGlobal(quelleId);
    var ziel = findTaskGlobal(zielId);
    if (!quelle || !ziel) return false;
    // Der eigene Unterbau - der Kreisschluss.
    if (istImTeilbaum(quelle, zielId)) return false;
    // Schon direktes Kind? Dann waere die Ablage ein Aus- und Wiedereinbau
    // am selben Ort, sichtbar nur als Sprung ans Ende der Unteraufgaben.
    for (var i = 0; i < ziel.subtasks.length; i++) {
      if (ziel.subtasks[i].id === quelleId) return false;
    }
    return true;
  }

  function moveTaskIntoTask(taskId, ownerId, zielId) {
    if (!darfHineinZiehen(taskId, zielId)) return false;
    var ziel = findTaskGlobal(zielId);
    // Knoten UND Blockverweis wandern gemeinsam - eines von beiden zu
    // vergessen erzeugt eine Aufgabe ohne Zeile oder eine Zeile ins Leere.
    // knotenAushaengen() schliesst auch die Spalten, die auf die verschobene
    // Aufgabe zeigen (die zentrale Regel aus spec.md 4.3).
    var aus = knotenAushaengen(ownerId, taskId);
    if (!aus) return false;
    knotenEinhaengen(zielId, aus.node, ziel.subtasks.length, -1);

    // Das Ziel hat ein Kind mehr und kann dadurch unfertig werden; der
    // bisherige Besitzer hat eines weniger und kann dadurch fertig werden.
    // Beide brauchen ihren eigenen Durchgang: Das Ziel muss KEIN Nachfahre
    // des Besitzers sein - zieht man aus einer Spalte rechts in eine Aufgabe
    // links, liegen sie in verschiedenen Zweigen.
    ziel.done = ziel.subtasks.length > 0 && ziel.subtasks.every(function (x) { return x.done; });
    recomputeAncestors(ziel.id);
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    if (owner && owner.subtasks) {
      owner.done = owner.subtasks.length > 0 && owner.subtasks.every(function (x) { return x.done; });
      recomputeAncestors(owner.id);
    }
    return true;
  }

  // ==================== Aufräum-Modus (docs/spec.md 2.8) ====================
  //
  // Ein gefuehrter Durchgang durch den Eingang: eine Aufgabe nach der
  // anderen, zu jeder die drei Entscheidungen (Liste - Datum - erledigt/weg)
  // gross und direkt. Er kann NICHTS, was das Einsortieren per Ziehen nicht
  // auch koennte; sein einziger Vorteil ist, dass man ihn gern oeffnet.
  // Deshalb ist die Belohnungsschicht hier kein Zierrat, sondern der Zweck -
  // faellt sie weg, bleibt ein Formular mit sieben Runden uebrig.
  var TIDY_FLUG_MS = 260;

  // Ein- und Aushaengen mit MERKEN DER STELLE. moveTaskToList() haengt hinten
  // an, was zum Einsortieren richtig ist - fuer "Zurueck" braucht es aber die
  // urspruengliche Position, sonst kommt die Aufgabe an einem anderen Platz
  // zurueck als sie weg war. Knoten UND Blockverweis wandern immer gemeinsam.
  function istLeererText(blk) {
    return !!blk && blk.type === "text" &&
           !String(blk.text || "").replace(/<[^>]*>/g, "").replace(/ /g, " ").trim();
  }

  // Zwischen zwei Bloecken braucht der Editor GENAU EINE Fuellzeile. Nimmt
  // man einen Block heraus, koennen zwei Leerabsaetze nebeneinander geraten
  // - und zwei nebeneinander kann er nicht mehr einklappen, er zeigt sie als
  // echte Leerzeilen. Genau das war die Luecke, die nach dem Aufraeumen oben
  // im Eingang stand: kein Rest der Aufgabe, sondern zwei Fuellzeilen, die
  // ohne die Aufgabe dazwischen aneinandergerieten.
  //
  // Beim gewoehnlichen Loeschen faellt es nicht auf, weil der Block dort
  // durch die Rueckgaengig-Zeile ERSETZT wird und der Platz belegt bleibt
  // (spec.md 4.3). Ueberall sonst, wo ein Block wirklich verschwindet, muss
  // aufgeraeumt werden.
  function leereAbsaetzeVerschmelzen(owner) {
    if (!owner || !owner.blocks) return;
    for (var i = owner.blocks.length - 1; i > 0; i--) {
      if (istLeererText(owner.blocks[i]) && istLeererText(owner.blocks[i - 1])) {
        owner.blocks.splice(i, 1);
      }
    }
  }

  function knotenAushaengen(ownerId, taskId) {
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    if (!owner) return null;
    var kids = childrenOf(owner);
    var ki = kids.findIndex(function (k) { return k.id === taskId; });
    if (ki < 0) return null;
    var node = kids[ki];
    var bi = owner.blocks.findIndex(function (b) { return b.id === taskId; });
    kids.splice(ki, 1);
    if (bi >= 0) owner.blocks.splice(bi, 1);
    leereAbsaetzeVerschmelzen(owner);
    closePanelsFrom(taskId);
    return { node: node, kidIndex: ki, blockIndex: bi };
  }

  function knotenEinhaengen(ownerId, node, kidIndex, blockIndex) {
    var owner = findList(ownerId) || findTaskGlobal(ownerId);
    if (!owner || !node) return;
    var kids = childrenOf(owner);
    kids.splice(Math.max(0, Math.min(kidIndex, kids.length)), 0, node);
    var bi = blockIndex >= 0 ? Math.min(blockIndex, owner.blocks.length) : owner.blocks.length;
    owner.blocks.splice(bi, 0, { type: "task", id: node.id });
  }

  // Auf dem Desktop folgenlos - dort traegt das Nachgeben der Knoepfe beim
  // Druecken (:active, scale 0.96). Auf dem Telefon wird daraus in Flutter
  // HapticFeedback.selectionClick() bzw. mediumImpact(). Nie ohne die
  // sichtbare Bewegung: Die Haptik verstaerkt, sie ersetzt nicht.
  function haptik(muster) {
    if (navigator.vibrate) { try { navigator.vibrate(muster); } catch (e) {} }
  }

  // Setzt JEDEN frisch aufgebauten Fortschrittsbalken im naechsten Bild auf
  // sein Ziel, damit das transition eine Strecke zu laufen hat. Betrifft den
  // Balken des Aufraeum-Modus und die kleinen Balken an den Aufgabenzeilen -
  // beide werden bei jeder Aenderung neu erzeugt, und ein frisches Element
  // hat keinen Vorzustand, von dem aus eine Animation laufen koennte.
  //
  // Gilt in BEIDE Richtungen: Wird der neue Wert kleiner (Zurueck im
  // Aufraeum-Modus, ein Haken wieder entfernt), laeuft der Balken genauso
  // zurueck - er springt nicht.
  //
  // Der Merkspeicher der alten Werte liegt bei den Aufrufern
  // (state.tidy.balkenAlt bzw. fortschrittAlt), weil nur die wissen,
  // welcher Balken zu welchem Gegenstand gehoert.
  var fortschrittAlt = {};

  // Einblenden ist fuer NEUE Dinge da. Weil jede Aenderung die ganze Spalte
  // neu erzeugt, hat vorher alles bei jeder Aktion neu eingeblendet - fuer
  // das Auge ein staendiges Aufblitzen der Liste. Hier wird gemerkt, was
  // beim letzten Aufbau schon dastand; nur was neu dazukommt, bekommt die
  // Klasse .ist-neu und damit die Animation.
  //
  // Der Schluessel ist der vorhandene data-embed-marker bzw. ein eigener
  // data-neu-schluessel. Verschwindet etwas und kommt spaeter wieder,
  // blendet es zu Recht erneut ein - es ist dann ja wirklich neu da.
  var bekannteEinblender = {};

  function einblendenNurNeu() {
    var els = document.querySelectorAll("[data-embed-marker], [data-neu-schluessel]");
    var jetzt = {};
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute("data-embed-marker") || els[i].getAttribute("data-neu-schluessel");
      if (!k) continue;
      jetzt[k] = true;
      if (!bekannteEinblender[k]) els[i].classList.add("ist-neu");
    }
    bekannteEinblender = jetzt;
  }

  function balkenLaufen() {
    var els = document.querySelectorAll("[data-balken-ziel]");
    var ohneBewegung = prefersReducedMotion();
    for (var i = 0; i < els.length; i++) {
      (function (s) {
        var ziel = s.getAttribute("data-balken-ziel");
        if (ohneBewegung) { s.style.transform = "scaleX(" + ziel + ")"; return; }
        // Zwei Bilder warten: Nach einem einzigen requestAnimationFrame hat
        // der Browser das Element noch nicht zwingend mit seinem Startwert
        // gemalt, und die Aenderung wuerde wieder zusammenfallen.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { s.style.transform = "scaleX(" + ziel + ")"; });
        });
      })(els[i]);
    }
  }

  function tidyStart() {
    var l = findList(INBOX_ID);
    // Nur Offenes. Erledigtes ist kein Triage-Material.
    var offen = l.tasks.filter(function (t) { return !t.done; });
    state.tidy = {
      queue: offen.map(function (t) { return t.id; }),
      i: 0,
      einflug: "von-unten",
      rollt: false,
      busy: false,
      kalender: false,
      neueListe: false,
      verlauf: [],
      balkenAlt: 0,
      proListe: {},
      erledigt: 0, spaeter: 0
    };
    state.view = "list";
    state.currentListId = INBOX_ID;
    state.panelStack = [];
    state.calendarFor = null;
    renderAll();
  }

  function tidyBeenden() {
    if (!state.tidy) return;
    var etwasGeschafft = state.tidy.verlauf.length > 0;
    state.tidy = null;
    if (etwasGeschafft) haptik([12, 40, 18]);
    renderAll();
  }

  function tidyAktuell() {
    var t = state.tidy;
    if (!t || t.i >= t.queue.length) return null;
    return findTaskGlobal(t.queue[t.i]);
  }

  // Erst die Bewegung, dann die Aenderung. Solange die Karte fliegt, sind
  // weitere Klicks gesperrt - sonst ueberholt die zweite Entscheidung die
  // erste und landet auf der falschen Aufgabe.
  function tidySchritt(wegKlasse, einflug, tick, aendern) {
    var t = state.tidy;
    if (!t || t.busy) return;
    var karte = document.querySelector(".tidy-card");
    if (tick) haptik(tick);

    function fertig() {
      aendern();
      t.busy = false;
      t.einflug = einflug;
      t.rollt = true;
      t.kalender = false;
      t.neueListe = false;
      var puls = t.zielPuls;
      t.zielPuls = null;
      renderAll();
      // Die Quittung "dort liegt es jetzt". Ohne sie fliegt die Karte
      // irgendwohin - deshalb bleibt die Sidebar auch sichtbar (kein Overlay).
      if (puls && !prefersReducedMotion()) {
        var zeile = document.querySelector('.nav-item[data-list="' + puls + '"]');
        if (zeile) zeile.classList.add("tidy-ziel");
      }
    }

    if (!karte || prefersReducedMotion()) { fertig(); return; }
    t.busy = true;
    karte.classList.remove("tidy-karte-rein", "von-unten", "von-links", "von-rechts");
    karte.classList.add("tidy-karte-weg", wegKlasse);
    // Erledigen zieht erst den Strich und sinkt dann - es braucht laenger.
    setTimeout(fertig, wegKlasse === "zusammen" ? TIDY_FLUG_MS + 140 : TIDY_FLUG_MS);
  }

  function tidyInListe(listId) {
    var node = tidyAktuell();
    var t = state.tidy;
    if (!node || !t) return;
    tidySchritt("nach-links", "von-unten", 12, function () {
